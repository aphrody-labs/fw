[project]
name = "fw"
version = "4.2.0"
description = "fw Python tooling: llama.cpp/vLLM/Hermes migration helpers and the ML pipeline bridge"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Heretic (AGPL-3.0) is consumed as the upstream PyPI package, never vendored in this MIT repository.
heretic = ["heretic-llm~=2.1"]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.ruff]
src = ["core/py", "tests"]
exclude = ["packages", "plugin", "plugins", "native", "dist", "cloudflare", "vercel"]

[tool.ruff.lint]
ignore = ["B023", "BLE001", "TRY002", "SIM117"]
