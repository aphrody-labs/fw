[workspace]
members = [
    "crates/fw-a2a",
    "crates/fw-agent",
    "crates/fw-agent-context",
    "crates/fw-gemini",
    "crates/fw-ggml",
    "crates/fw-llama",
    "crates/fw-m3",
    "crates/fw-material",
    "crates/fw-video",
    "crates/fw-files",
    "crates/fw-google",
    "crates/fw-drive",
    "crates/fw-llama-sys",
    "crates/fw-ml",
    "crates/fw-model",
    "crates/fw-proc",
    "crates/fw-rag",
    "crates/fw-rag-core",
    "crates/fw-ring3-agent",
    "crates/fw-toolcall",
    "crates/fw-translate-core",
    "crates/fw-compute",
    "crates/fw-config",
    "crates/fw-http",
    "crates/fw-secrets",
    "crates/fw-cluster",
    "crates/fw-proto",
    "crates/fw-ui-blitz",
    "crates/fw-wasm",
    "crates/fw-ostd-wasm",
    "crates/fw-uutils",
    "crates/fw-nix",
    "crates/fw-unified-stack",
    "crates/fw-wayland-wgpu",
    "crates/fw-hermes-claw",
    "crates/fw-apm",
    "crates/fw-fx",
    "crates/fw-depot",
    "crates/fw-crates",
    "crates/fw-linux",
    "crates/fw-bin",
    "xtask",
]
exclude = ["os/fw-os", "os/fw-os-boot", "os/fw-ostd-vfs", "native/fw-kernel", "native/fw-world", "native/fw-abi", "packages", "crates/fw-edge", "aphrody", "ay"]
resolver = "2"

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/aphrody-labs/fw"
keywords = ["fw", "rust-os", "wasm", "mcp", "cluster"]
categories = ["command-line-utilities", "development-tools", "os"]

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
needless_collect = "deny"
inefficient_to_string = "deny"

[workspace.dependencies]

# External zero-bloat dependencies (verified latest on crates.io 2026-11-19)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
flate2 = "1.1.11"
mimalloc = "0.1.52"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }

anyhow = "1.0.104"
argh = "0.1.19"
aes-gcm = "0.11.1"
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
bytes = "1.12.2"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive", "env", "cargo", "string", "unicode"] }
criterion = "0.8.2"
dirs = "7.0.0"
futures = "0.3.34"
futures-util = "0.3"
hex = "0.4.3"
hf-hub = "1.0.0"
http = "1.5.0"
http-body-util = "0.1"
hyper = "1"
ignore = "0.4.34"
libc = "0.2.191"
libloading = "0.9.1"
memmap2 = "0.9.12"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
oxc_syntax = "0.159.0"
pretty_assertions = "1.4.1"
prost = "0.14.6"
protoc-bin-vendored = "3.2.0"
pyo3 = "0.30.1"
rayon = "1.12.0"
rcgen = "0.14"
regex = "1.13.2"
rustls = "0.23.46"
rusqlite = "0.40"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio-postgres = "0.7.18"
tokio-rustls = "0.26"
toml = "1.2.1"
tonic-prost-build = "0.14.6"
tower = "0.5"
tracing = "0.1.44"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
url = { version = "2.5.8", features = ["serde"] }
uuid = "1.29.3"
walkdir = "2.5.0"
which = "8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_System_Threading", "Win32_Security", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinSock", "System"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Security"] }
zerocopy = { version = "0.8.63", features = ["derive", "alloc", "simd"] }
zeroize = "1.9.2"

# layout:begin cargo.dependencies (generated by tools/layout.ts from layout.toml; edit layout.toml)
fw-a2a = { path = "crates/fw-a2a" }
fw-agent = { path = "crates/fw-agent", default-features = false }
fw-agent-context = { path = "crates/fw-agent-context" }
fw-apm = { version = "2026.11.0", path = "crates/fw-apm" }
fw-bin = { path = "crates/fw-bin" }
fw-cluster = { version = "2026.11.0", path = "crates/fw-cluster" }
fw-compute = { version = "2026.11.0", path = "crates/fw-compute" }
fw-config = { version = "2026.11.0", path = "crates/fw-config" }
fw-crates = { version = "2026.11.0", path = "crates/fw-crates", default-features = false, features = ["live"] }
fw-depot = { path = "crates/fw-depot" }
fw-drive = { path = "crates/fw-drive" }
fw-files = { path = "crates/fw-files" }
fw-fx = { version = "2026.11.0", path = "crates/fw-fx" }
fw-gemini = { path = "crates/fw-gemini", default-features = false }
# Internal publishable fw-* crates (pinned with version + path for crates.io)
fw-ggml = { version = "2026.11.0", path = "crates/fw-ggml" }
fw-google = { path = "crates/fw-google" }
fw-hermes-claw = { version = "2026.11.0", path = "crates/fw-hermes-claw" }
fw-http = { version = "2026.11.0", path = "crates/fw-http", default-features = false }
fw-linux = { path = "crates/fw-linux" }
fw-llama = { path = "crates/fw-llama" }
fw-llama-sys = { path = "crates/fw-llama-sys" }
fw-m3 = { path = "crates/fw-m3" }
fw-material = { path = "crates/fw-material" }
fw-ml = { path = "crates/fw-ml", default-features = false }
fw-model = { path = "crates/fw-model", default-features = false }
fw-nix = { version = "2026.11.0", path = "crates/fw-nix" }
fw-ostd-wasm = { version = "2026.11.0", path = "crates/fw-ostd-wasm" }
fw-proc = { path = "crates/fw-proc" }
fw-proto = { version = "2026.11.0", path = "crates/fw-proto" }
fw-rag = { path = "crates/fw-rag" }
fw-rag-core = { path = "crates/fw-rag-core" }
fw-ring3-agent = { path = "crates/fw-ring3-agent" }
fw-secrets = { version = "2026.11.0", path = "crates/fw-secrets" }
fw-toolcall = { path = "crates/fw-toolcall", default-features = false }
fw-translate-core = { path = "crates/fw-translate-core" }
fw-ui-blitz = { version = "2026.11.0", path = "crates/fw-ui-blitz" }
fw-unified-stack = { version = "2026.11.0", path = "crates/fw-unified-stack" }
fw-uutils = { version = "2026.11.0", path = "crates/fw-uutils" }
fw-video = { path = "crates/fw-video" }
fw-wasm = { path = "crates/fw-wasm" }
fw-wayland-wgpu = { version = "2026.11.0", path = "crates/fw-wayland-wgpu" }
xtask = { path = "xtask" }
# layout:end cargo.dependencies

# layout:begin cargo.patch (generated by tools/layout.ts from layout.toml; edit layout.toml)
[patch.crates-io]
# hyperium/h3 master carries fixes the 0.0.8 release lacks (send_data flushed before finish, stop_sending, request tracking);
# fw-http's client (through reqwest) and server both use it. Fork of hyperium/h3; drop the patch once the next release ships.
h3 = { git = "https://github.com/aphrody-labs/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
h3-quinn = { git = "https://github.com/aphrody-labs/h3", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
# layout:end cargo.patch

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
