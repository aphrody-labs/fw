[workspace]
members = [
    "crates/fw-ggml",
    "crates/fw-compute",
    "crates/fw-cluster",
    "crates/fw-proto",
    "crates/fw-ui-blitz",
    "crates/fw-wasm",
    "crates/fw-ostd-wasm",
    "crates/fw-uutils",
    "crates/fw-nix",
    "crates/fw-unified-stack",
    "crates/fw-wayland-wgpu",
    "crates/fw-hermes-claw",
    "crates/fw-apm",
    "crates/fw-fx",
    "crates/fw-bin",
    "xtask",
]
exclude = [
    "os/fw-os",
    "native/fw-pe",
    "native/fw-sniff",
    "native/fw-kernel",
    "native/fw-world",
    "native/fw-abi",
    "native/fw-agy",
    "core/rs/tui-test",
    "core/rs/wta",
    "packages",
]
resolver = "2"

[workspace.package]
version = "4.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/aphrody-labs/fw"
keywords = ["fw", "rust-os", "wasm", "mcp", "cluster"]
categories = ["command-line-utilities", "development-tools", "os"]

[workspace.lints.clippy]
perf = { level = "deny", priority = -1 }
needless_collect = "deny"
inefficient_to_string = "deny"

[workspace.dependencies]
# Internal publishable fw-* crates (pinned with version + path for crates.io)
fw-ggml = { version = "4.2.0", path = "crates/fw-ggml" }
fw-compute = { version = "4.2.0", path = "crates/fw-compute" }
fw-cluster = { version = "4.2.0", path = "crates/fw-cluster" }
fw-proto = { version = "4.2.0", path = "crates/fw-proto" }
fw-ui-blitz = { version = "4.2.0", path = "crates/fw-ui-blitz" }
fw-ostd-wasm = { version = "4.2.0", path = "crates/fw-ostd-wasm" }
fw-uutils = { version = "4.2.0", path = "crates/fw-uutils" }
fw-nix = { version = "4.2.0", path = "crates/fw-nix" }
fw-unified-stack = { version = "4.2.0", path = "crates/fw-unified-stack" }
fw-wayland-wgpu = { version = "4.2.0", path = "crates/fw-wayland-wgpu" }
fw-hermes-claw = { version = "4.2.0", path = "crates/fw-hermes-claw" }
fw-apm = { version = "4.2.0", path = "crates/fw-apm" }
fw-fx = { version = "4.2.0", path = "crates/fw-fx" }

# External zero-bloat dependencies (verified latest on crates.io 2026-11-19)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
flate2 = "1.1.11"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
