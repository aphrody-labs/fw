# One Cargo workspace for fw, aphrody and ay (tools/monorepo/unify.ts, phase 1 of docs/roadmap/2026-os-monorepo.md).
# Members keep their origin's package fields and lints (spelled out in their own manifests); dependencies shared by several members live below.
[workspace]
members = [
    "aphrody/crates/*",
    "ay/crates/*",
    "crates/fw-a2a",
    "crates/fw-agent",
    "crates/fw-agent-context",
    "crates/fw-gemini",
    "crates/fw-ggml",
    "crates/fw-llama",
    "crates/fw-m3",
    "crates/fw-material",
    "crates/fw-video",
    "crates/fw-files",
    "crates/fw-google",
    "crates/fw-drive",
    "crates/fw-llama-sys",
    "crates/fw-ml",
    "crates/fw-model",
    "crates/fw-proc",
    "crates/fw-rag",
    "crates/fw-rag-core",
    "crates/fw-ring3-agent",
    "crates/fw-toolcall",
    "crates/fw-translate-core",
    "crates/fw-compute",
    "crates/fw-config",
    "crates/fw-http",
    "crates/fw-secrets",
    "crates/fw-cluster",
    "crates/fw-estate",
    "crates/fw-proto",
    "crates/fw-ui-blitz",
    "crates/fw-wasm",
    "crates/fw-ostd-wasm",
    "crates/fw-uutils",
    "crates/fw-nix",
    "crates/fw-unified-stack",
    "crates/fw-wayland-wgpu",
    "crates/fw-hermes-claw",
    "crates/fw-apm",
    "crates/fw-fx",
    "crates/fw-depot",
    "crates/fw-crates",
    "crates/fw-linux",
    "crates/fw-workerd",
    "crates/fw-bin",
    "xtask",
    "aphrody/crates/refineable/derive_refineable",
    "aphrody/extensions/glsl",
    "aphrody/extensions/html",
    "aphrody/extensions/proto",
    "aphrody/extensions/test-extension",
    "aphrody/tooling/compliance",
    "aphrody/tooling/crates_io_client",
    "aphrody/tooling/perf",
    "ay/crates/ay-core/capi",
    "ay/crates/ay-core/jni",
]
exclude = ["os/fw-os", "os/fw-os-boot", "os/fw-ostd-vfs", "native/fw-kernel", "native/fw-world", "native/fw-abi", "packages", "crates/fw-edge", "aphrody/templates/wasm-wgpu/*", "ay/third_party", "ay/crates/ay-core/capi/py", "ay/packages", "ay/crates/ay-vault", "aphrody/tooling/xtask"]
resolver = "3"

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/aphrody-labs/fw"
keywords = ["fw", "rust-os", "wasm", "mcp", "cluster"]
categories = ["command-line-utilities", "development-tools", "os"]

[workspace.lints.clippy]
needless_collect = "deny"
inefficient_to_string = "deny"

[workspace.lints.clippy.perf]
level = "deny"
priority = -1

