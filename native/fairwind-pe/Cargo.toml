[package]
name = "fairwind-pe"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "First-party Fairwind Rust PE binary parser crate (Fat-LTO/AOT)"

[lib]
name = "craft_pe"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
