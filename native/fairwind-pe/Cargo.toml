[package]
name = "fairwind-pe"
version = "0.1.0"
edition = "2024"
description = "Thin standalone crate binding core/rs/craft-libs/crates/pe into Fairwind LTO/AOT targets"

[lib]
name = "craft_pe"
path = "../../core/rs/craft-libs/crates/pe/src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
