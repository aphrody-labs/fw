[package]
name = "fairwind-abi"
version = "0.3.0"
edition = "2024"
description = "Unified Fairwind Fat-LTO C ABI bridge (heretic, neon, craft-libs/craft-pe, craft-anything, tree-sitter)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tree-sitter-all"]
tree-sitter-all = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
]

[dependencies]
fairwind-pe = { path = "../fairwind-pe", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
