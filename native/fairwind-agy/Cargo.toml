[package]
name = "fairwind-agy"
version = "0.1.0"
edition = "2024"
description = "Fairwind Fat-LTO AOT native agy launcher, PE inspector, and self-upgrade front-end"

[[bin]]
name = "agy"
path = "src/main.rs"

[dependencies]
fairwind-abi = { path = "../fairwind-abi", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
