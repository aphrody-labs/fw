[package]
name = "fairwind-world"
version = "0.1.0"
edition = "2024"
description = "Bare-metal no_std and WebAssembly-compatible System-1 fast decision, quantized ML, and Latent World Model engine"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
