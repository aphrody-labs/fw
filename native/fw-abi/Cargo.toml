[package]
name = "fw-abi"
version = "0.4.0"
edition = "2024"
description = "Unified Fw Fat-LTO C ABI v4 (Tree-sitter 11 grammars + Query/Symbols, craft-pe, craft-sniff, iced-x86 disasm, GGUF/GGML, Rust crypto/Git/SSH/OCI)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["tree-sitter-all"]
tree-sitter-all = [
    "dep:tree-sitter",
    "dep:streaming-iterator",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
    "dep:tree-sitter-c",
    "dep:tree-sitter-cpp",
    "dep:tree-sitter-java",
    "dep:tree-sitter-go",
    "dep:tree-sitter-json",
    "dep:tree-sitter-bash",
]

[dependencies]
base64 = "0.22"
blake3 = "1"
fw-pe = { path = "../fw-pe", features = ["serde"] }
fw-sniff = { path = "../fw-sniff" }
hmac = "0.12"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
streaming-iterator = { version = "0.1", optional = true }
tree-sitter = { version = "0.27.2", optional = true }
tree-sitter-bash = { version = "0.25.1", optional = true }
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = { version = "0.24.8", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
