# Configuration of tools/hardcoded.ts: what is scanned, what is allowed to hold literal design values, and which
# language constructs count as a color, a user-facing string or an icon reference.
# The check is a measurement first (`bun tools/hardcoded.ts`); `--check` compares per-file counts with the ratchet
# baseline, so the existing debt does not fail CI and only an increase does.

[scan]
# Extension -> language of the scanner. A file with another extension is never read.
languages = { rs = "rust", ts = "ts", tsx = "ts", js = "ts", jsx = "ts", mjs = "ts", cjs = "ts", mts = "ts", css = "css", scss = "css", kt = "kotlin", kts = "kotlin", html = "html", htm = "html" }
# Blocks between these markers are generated token output (fw-m3 css --write) and count as token files.
generated_blocks = [["m3-colors:begin", "m3-colors:end"]]
# Paths that are not first-party UI code: vendored upstream trees, generated output, tests and fixtures.
exclude = [
  "third_party/**",
  "**/vendor/**",
  "**/node_modules/**",
  "**/dist/**",
  "**/target/**",
  "**/*.min.*",
  "**/*.d.ts",
  "**/tests/**",
  "**/test/**",
  "**/__tests__/**",
  "**/fixtures/**",
  "**/testdata/**",
  "**/*_tests.rs",
  "**/tests.rs",
  "**/*.generated.*",
  "**/*_test.rs",
  "**/*.test.*",
  "**/*.spec.*",
  "**/examples/**",
  "**/benches/**",
  "plugins/aphrody/skills/**",
  "aphrody/site/public/**", # generated by aphrody/site/build.ts (its text and icon names are counted in build.ts)
  "packages/linux-types/**",
  "docs/**",
  "tools/hardcoded.*",
  "crates/fw-theme/data/**",
]

[allow]
# The token, catalog and theme files: the only places where a color, a text or an icon name may be written as a literal.
# Each entry is a glob; the reason says which declaration the file is the home of.
files = [
  { glob = "ay/brand/tokens/**", why = "generated M3 tokens from product.toml [brand] (m3-tokens.css, Compose scheme)" },
  { glob = "aphrody/templates/m3-gpui-nsh/m3-tokens.css", why = "generated M3 tokens shipped with the template" },
  { glob = "crates/fw-m3/**", why = "fw-m3 is the token source (tokens, scheme, reference palette)" },
  { glob = "crates/fw-theme/**", why = "fw-theme renders themes and owns the settings schema" },
  { glob = "crates/fw-material/**", why = "Material Symbols path data and codepoints, generated by tools/material-cdn" },
  { glob = "tools/material-cdn/**", why = "icon set generator for material.aphrody.com" },
  { glob = "cloudflare/material-cdn/**", why = "the material.aphrody.com worker that serves the icon sets" },
  { glob = "aphrody/crates/theme/src/{fallback_themes,default_colors,icon_theme}.rs", why = "built-in theme, default color table and icon theme of the aphrody theme crate" },
  { glob = "aphrody/crates/brand/**", why = "brand crate generates identity from product.toml" },
  { glob = "ay/crates/ay-design/src/brand/**", why = "ay brand dataset" },
  { glob = "kotlin/fw-material3/src/main/kotlin/com/aphrody/fw/material3/M3Catalog.kt", why = "Material 3 component catalog" },
  { glob = "**/generated/**", why = "generated output of the token pipeline" },
  { glob = "themes/**", why = "theme directories" },
  { glob = "**/locales/**", why = "locale catalogs" },
]

[baseline]
# Per-file counts at the last accepted state (`bun tools/hardcoded.ts --update-baseline`); --check fails on any file above it.
file = "docs/research/hardcoded-baseline.tsv"

[color]
# Named colors counted in color contexts (CSS declarations, SVG/HTML attributes, TSX style objects). Keywords that
# carry no color (transparent, inherit, currentColor, none, initial, unset) are not listed.
named = [
  "aliceblue", "antiquewhite", "aqua", "aquamarine", "azure", "beige", "bisque", "black", "blanchedalmond", "blue",
  "blueviolet", "brown", "burlywood", "cadetblue", "chartreuse", "chocolate", "coral", "cornflowerblue", "cornsilk",
  "crimson", "cyan", "darkblue", "darkcyan", "darkgoldenrod", "darkgray", "darkgreen", "darkgrey", "darkkhaki",
  "darkmagenta", "darkolivegreen", "darkorange", "darkorchid", "darkred", "darksalmon", "darkseagreen", "darkslateblue",
  "darkslategray", "darkslategrey", "darkturquoise", "darkviolet", "deeppink", "deepskyblue", "dimgray", "dimgrey",
  "dodgerblue", "firebrick", "floralwhite", "forestgreen", "fuchsia", "gainsboro", "ghostwhite", "gold", "goldenrod",
  "gray", "green", "greenyellow", "grey", "honeydew", "hotpink", "indianred", "indigo", "ivory", "khaki", "lavender",
  "lavenderblush", "lawngreen", "lemonchiffon", "lightblue", "lightcoral", "lightcyan", "lightgoldenrodyellow",
  "lightgray", "lightgreen", "lightgrey", "lightpink", "lightsalmon", "lightseagreen", "lightskyblue", "lightslategray",
  "lightslategrey", "lightsteelblue", "lightyellow", "lime", "limegreen", "linen", "magenta", "maroon",
  "mediumaquamarine", "mediumblue", "mediumorchid", "mediumpurple", "mediumseagreen", "mediumslateblue",
  "mediumspringgreen", "mediumturquoise", "mediumvioletred", "midnightblue", "mintcream", "mistyrose", "moccasin",
  "navajowhite", "navy", "oldlace", "olive", "olivedrab", "orange", "orangered", "orchid", "palegoldenrod", "palegreen",
  "paleturquoise", "palevioletred", "papayawhip", "peachpuff", "peru", "pink", "plum", "powderblue", "purple",
  "rebeccapurple", "red", "rosybrown", "royalblue", "saddlebrown", "salmon", "sandybrown", "seagreen", "seashell",
  "sienna", "silver", "skyblue", "slateblue", "slategray", "slategrey", "snow", "springgreen", "steelblue", "tan",
  "teal", "thistle", "tomato", "turquoise", "violet", "wheat", "white", "whitesmoke", "yellow", "yellowgreen",
]
# CSS properties (and SVG/HTML attributes, TSX style keys) whose bare keyword value is a color.
properties = [
  "color", "background", "background-color", "border", "border-color", "border-top", "border-right", "border-bottom",
  "border-left", "border-top-color", "border-right-color", "border-bottom-color", "border-left-color", "outline",
  "outline-color", "fill", "stroke", "caret-color", "accent-color", "stop-color", "flood-color", "text-decoration-color",
  "backgroundColor", "borderColor", "caretColor", "accentColor",
]
# Color functions whose literal numeric arguments count (CSS, gpui, TS strings).
functions = ["rgb", "rgba", "hsl", "hsla", "hwb", "oklch", "oklab", "lab", "lch"]
# Kotlin: Color(0x...) and Color.<Name> constants.
kotlin_named = ["Red", "Green", "Blue", "Black", "White", "Gray", "DarkGray", "LightGray", "Yellow", "Cyan", "Magenta"]

[string]
# A literal counts as user-facing text when it holds letters and either a space or a leading capital.
# Rust (gpui and the ui crate): constructor and builder calls whose string argument is shown to the user.
rust_calls = [
  "Label::new", "LabelLike::new", "Headline::new", "Button::new", "IconButton::new", "ToggleButton::new", "Checkbox::new",
  "ListItem::new", "Tab::new", "Banner::new", "Callout::new", "Tooltip::text", "Tooltip::simple", "SharedString::new_static",
  "SharedString::from", "ContextMenu::entry", "ContextMenu::header", "ContextMenu::label", "show_toast", "Toast::new",
  "StatusToast::new", "Text::new", "Heading::new", "Paragraph::new",
]
# Rust and TS builder methods and object keys taking display text.
rust_methods = ["label", "title", "tooltip", "placeholder", "description", "child", "detail", "message", "heading", "subtitle", "caption", "text", "hint"]
ts_keys = ["title", "placeholder", "label", "tooltip", "description", "heading", "subtitle", "caption", "text", "message", "ariaLabel", "alt", "hint"]
# HTML and JSX attributes whose value is shown or read out.
html_attributes = ["title", "placeholder", "aria-label", "aria-description", "alt", "label", "data-tooltip"]
# Kotlin named arguments and composables taking display text.
kotlin_arguments = ["text", "title", "label", "contentDescription", "placeholder", "supportingText", "description", "headlineText", "subtitle"]
kotlin_calls = ["Text", "Button", "TextButton", "OutlinedButton", "FilledTonalButton", "Tab", "ListItem"]

[icon]
# Literal icon names and paths: string arguments and keys naming an icon, and image path literals.
keys = ["icon", "iconName", "icon_name", "glyph", "symbol", "leadingIcon", "trailingIcon", "icon_path"]
rust_calls = ["Icon::from_path", "Icon::from_name", "svg().path", "Svg::path", "icon_path"]
path_suffixes = [".svg", ".ico"]
path_prefixes = ["icons/", "icon/", "assets/icons/"]
# Material Symbols ligature elements: <md-icon>name</md-icon>, <span class="material-symbols-...">name</span>.
ligature_elements = ["md-icon", "mat-icon", "Icon"]
ligature_classes = ["material-symbols", "material-icons"]
# Kotlin: Icons.<Style>.<Name> references.
kotlin_icons = true
