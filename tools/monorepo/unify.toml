# Decisions for tools/monorepo/unify.ts that the manifests cannot express. Each entry says why.

# ed25519-dalek 3 dropped the `std` feature; aphrody's members keep fast + zeroize at the version ay already uses.
[spec.ed25519-dalek]
aphrody = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }

# The tree-sitter git revision brings tree-sitter-language 0.1.8, patched in through [patch.crates-io]; a ^0.1.9 requirement from ay would not match the patch and link a second copy.
[spec.tree-sitter-language]
hoisted = { version = "0.1.8" }
ay = { version = "0.1.8" }
aphrody = { version = "0.1.8" }
fw = { version = "0.1.8" }

# One libsqlite3-sys (links = "sqlite3"). rusqlite 0.43 pairs with 0.40, but bun-windows-winclean 1.4.8 (fw-agent, published from aphrody-labs/bun) requires rusqlite 0.40 and so libsqlite3-sys 0.38;
# every consumer moves to that lane (sqlez from 0.30) until winclean is republished against rusqlite 0.43.
[spec.libsqlite3-sys]
hoisted = { version = "0.38.2", features = ["bundled"] }

# fw-files SFTP (yazi-sftp + russh) and nsh-js crypto (quickjs-jit-stdlib 0.14.2) cannot share one graph today, verified against crates.io:
# russh <= 0.65.1 pins rsa =0.10.0-rc.18, russh 0.65.2 needs rsa ^0.10 (stable, which has no `sha2` feature), while quickjs-jit-stdlib 0.14.2 (longbridge/quickjs-jit main too)
# needs rsa ^0.10.0-rc.19 with its `sha2` feature. NSH crypto is default in every NSH app, SFTP is an optional feature of fw-files, so the optional feature leaves the workspace
# until quickjs-jit-stdlib moves to rsa 0.10.0; the code stays behind its cfg(feature = "sftp").
[[edit]]
file = "crates/fw-files/Cargo.toml"
from = '^yazi-sftp = .*\n'
to = ""

[[edit]]
file = "crates/fw-files/Cargo.toml"
from = '^russh = .*\n'
to = ""

[[edit]]
file = "crates/fw-files/Cargo.toml"
from = '^sftp = \[.*\]\n'
to = ""

[[edit]]
file = "crates/fw-files/Cargo.toml"
from = '^default = \["sftp"\]'
to = "default = []"

# Newest releases that break code which has not moved yet are pinned back to the version the origin's own lock used.
[[pin]]
package = "yawc"
version = "0.4.2"
why = "later 0.4.x releases dropped WebSocketBuilder::with_connector, which aphrody's cloud_api_client calls"

[[lock]]
package = "wgpu-sync"
from = '"lock_api 0.5.0"'
to = '"lock_api 0.4.14"'
why = "wgpu declares lock_api >=0.4.6, <0.6.0 but its code implements the 0.4 RawMutex (GuardMarker)"

# age 0.12.1 (the newest) needs ml-kem ^0.2, which pins kem =0.3.0-pre.0; the mullvad fork behind aphrody_vpn needs ml-kem 0.3.4 and kem 0.3.0. Two ml-kem lanes cannot share the kem 0.3 lane.
# ay-vault is a leaf (nothing in the workspace depends on it), so it leaves until age moves to ml-kem 0.3.
[[exclude]]
path = "ay/crates/ay-vault"
why = "age 0.12.1 needs ml-kem 0.2 (kem =0.3.0-pre.0), the mullvad fork needs ml-kem 0.3.4 (kem 0.3.0)"

[[lock]]
package = "wgpu-sync"
from = '"parking_lot 0.13.0"'
to = '"parking_lot 0.12.5"'
why = "parking_lot 0.13 implements the lock_api 0.5 traits, wgpu-sync is pinned to lock_api 0.4 above"

# ay pins the rolldown family and oxc exactly. rolldown 1.3.2 (newest on its own lane) needs oxc ^0.158 and every rolldown_* crate at =1.3.2.
[spec.rolldown]
hoisted = { version = "=1.3.2" }
[spec.rolldown_common]
hoisted = { version = "=1.3.2" }
[spec.rolldown_error]
hoisted = { version = "=1.3.2" }
[spec.rolldown_sourcemap]
hoisted = { version = "=1.3.2" }
[spec.string_wizard]
hoisted = { version = "=1.3.2", features = ["sourcemap"] }

[spec.oxc_sourcemap]
hoisted = { version = "9" }

[upgrade]
packages = ["oxc", "oxc_allocator", "oxc_ast", "oxc_ast_visit", "oxc_parser", "oxc_span", "oxc_syntax", "async-tungstenite"]

# jupyter-websocket-client 3.0.1 (newest) speaks async-tungstenite 0.35; aphrody's repl hands it the stream of its own connection, so both move to 0.35 (async-tungstenite is in [upgrade] above).
