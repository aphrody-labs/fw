# Standalone harness (own empty workspace) behind docs/research/modern-toolchain-2026-11.md steps 4 and 5.
# Not a fw workspace member: it pins candidate crates side by side, including duplicates of what the workspace uses.
[package]
name = "modern-toolchain-bench"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "modern-toolchain-bench"
path = "src/main.rs"

[dependencies]
# compression
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
miniz_oxide = "0.9.1"
libdeflater = "1.26.1"
zstd = "0.14.4"
ruzstd = "0.9.1"
brotli = "9.1.3"
liblzma = "0.4.9"
lzma-rs = "0.3.0"
tar = "0.4.46"
zip = { version = "9.8.1", default-features = false, features = ["deflate", "zstd"] }
# parsing
serde = "1"
serde_json = "1.0.154"
sonic-rs = "0.5.12"
simd-json = "0.19.0"
toml = "1.2.2"
serde_norway = "0.9.42"
serde-saphyr = "2.2.0"
saphyr = "0.4.0"
yaml-rust2 = "0.13.2"
csv = "1.4.0"
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = "1"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
cpu-time = "1"
pulldown-cmark = "0.13.6"
comrak = { version = "1.1.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
