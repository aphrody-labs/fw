[project]
name = "fw-google"
version = "0.1.0"
description = "Typed Google Drive, Sheets and YouTube automations over ADC or gcloud user credentials"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "google-api-python-client>=2.200",
    "google-auth>=2.40",
]

[project.scripts]
fw-google = "fw_google.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw_google"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]
