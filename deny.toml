# cargo-deny gate: `cargo deny check` (advisories, bans, licenses, sources). Run in CI by the rust-hygiene job and on fr1 by configs/claude/scripts/rust-audit.ts.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices are enforced for direct dependencies only; transitive ones (paste, pin-utils, serial, ttf-parser, rustybuzz, humantime) have no fw-side fix.
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std is discontinued; direct dependency of aphrody (Zed) crates, the replacement is smol and follows Zed upstream" },
    { id = "RUSTSEC-2024-0384", reason = "instant is unmaintained; transitive of aphrody's dependencies, no safe upgrade" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; used by aphrody (Zed) crates, follows Zed upstream" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained; used by the Zed text stack through cosmic-text and font crates" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 is pinned by Zed crates (^0.16); the patched line needs an upstream Zed change" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 reaches the workspace through p256 0.13 in craft-anything-formats (aphrody-labs fork, tag v0.6.1-aphrody.20261120); the fix needs p256 0.14 in that fork" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; direct dependency of 7 crates, the move to jiff is not done" },
    { id = "RUSTSEC-2025-0066", reason = "google-apis-common is unmaintained; the generated google-*3 crates of fw-google depend on it" },
    { id = "RUSTSEC-2026-0459", reason = "fixed in libsqlite3-sys 0.39 (rusqlite 0.43); blocked because bun-windows-winclean 1.4.8 pins rusqlite 0.40 and only one package may link sqlite3" },
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.10.0-rc.18 comes from russh 0.63.1; the fix needs russh 0.65 but yazi-sftp (aphrody-labs/yazi tag v26.9.1) pins russh 0.63.1 and pkcs1 =0.8.0-rc.4" },
    { id = "RUSTSEC-2026-0495", reason = "russh 0.63.3 agent-server advisory (fixed in 0.65); same yazi-sftp pin, and fw-files uses russh as a client only" },
    { id = "RUSTSEC-2026-0367", reason = "zip 8.6.0 comes from aphrody-wireguard 1.4.7 via aphrody-remote-desktop; fixed in zip 9, fw's own zip dependency is 9.x" },
    { id = "RUSTSEC-2026-0368", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0369", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0429", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0545", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0546", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0547", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9" },
    { id = "RUSTSEC-2026-0548", reason = "zip 8.6.0 via aphrody-wireguard, fixed in zip 9.0.5" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-3.0",
    "LGPL-3.0-or-later",
    "OFL-1.1",
    "OpenSSL",
    "Ubuntu-font-1.0",
    "Unicode-DFS-2016",
    "WTFPL",
]

[bans]
multiple-versions = "warn"
# crates marked publish = true (fw-a2a, fw-llama) and their path-only dependencies are the findings: crates.io needs a version next to each path.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
