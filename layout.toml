repo = "fw"

[repos.fw]
layer = 0
path = "."
url = "https://github.com/aphrody-labs/fw"

[policy]
pinned_git = true

[cargo]
members = [
    "crates/fw-a2a",
    "crates/fw-agent",
    "crates/fw-agent-context",
    "crates/fw-gemini",
    "crates/fw-ggml",
    "crates/fw-llama",
    "crates/fw-m3",
    "crates/fw-material",
    "crates/fw-video",
    "crates/fw-files",
    "crates/fw-google",
    "crates/fw-drive",
    "crates/fw-llama-sys",
    "crates/fw-ml",
    "crates/fw-model",
    "crates/fw-proc",
    "crates/fw-rag",
    "crates/fw-rag-core",
    "crates/fw-ring3-agent",
    "crates/fw-toolcall",
    "crates/fw-translate-core",
    "crates/fw-compute",
    "crates/fw-config",
    "crates/fw-http",
    "crates/fw-secrets",
    "crates/fw-cluster",
    "crates/fw-proto",
    "crates/fw-ui-blitz",
    "crates/fw-wasm",
    "crates/fw-ostd-wasm",
    "crates/fw-uutils",
    "crates/fw-nix",
    "crates/fw-unified-stack",
    "crates/fw-wayland-wgpu",
    "crates/fw-hermes-claw",
    "crates/fw-apm",
    "crates/fw-fx",
    "crates/fw-depot",
    "crates/fw-crates",
    "crates/fw-linux",
    "crates/fw-bin",
    "xtask",
]

[cargo.crate.fw-ggml]
version = "auto"
why = "Internal publishable fw-* crates (pinned with version + path for crates.io)"

[cargo.crate.fw-compute]
version = "auto"

[cargo.crate.fw-config]
version = "auto"

[cargo.crate.fw-http]
version = "auto"
default-features = false

[cargo.crate.fw-secrets]
version = "auto"

[cargo.crate.fw-cluster]
version = "auto"

[cargo.crate.fw-proto]
version = "auto"

[cargo.crate.fw-ui-blitz]
version = "auto"

[cargo.crate.fw-ostd-wasm]
version = "auto"

[cargo.crate.fw-uutils]
version = "auto"

[cargo.crate.fw-nix]
version = "auto"

[cargo.crate.fw-unified-stack]
version = "auto"

[cargo.crate.fw-wayland-wgpu]
version = "auto"

[cargo.crate.fw-hermes-claw]
version = "auto"

[cargo.crate.fw-apm]
version = "auto"

[cargo.crate.fw-crates]
version = "auto"
default-features = false
features = ["live"]

[cargo.crate.fw-fx]
version = "auto"

[cargo.crate.fw-model]
default-features = false

[cargo.crate.fw-toolcall]
default-features = false

[cargo.crate.fw-gemini]
default-features = false

[cargo.crate.fw-ml]
default-features = false

[cargo.crate.fw-agent]
default-features = false

[[cargo.patch]]
source = "crates-io"
crate = "h3"
git = "https://github.com/aphrody-labs/h3"
rev = "43745ad87e95b0c035ac9c547aad467303213425"
why = """
hyperium/h3 master carries fixes the 0.0.8 release lacks (send_data flushed before finish, stop_sending, request tracking);
fw-http's client (through reqwest) and server both use it. Fork of hyperium/h3; drop the patch once the next release ships.
"""

[[cargo.patch]]
source = "crates-io"
crate = "h3-quinn"
git = "https://github.com/aphrody-labs/h3"
rev = "43745ad87e95b0c035ac9c547aad467303213425"


# Bun workspaces: apps/* and packages/* only (the root holds config, not code).
[bun]
workspaces = [
    "apps/agents",
    "apps/chromium-dash",
    "packages/gnu",
    "packages/ai-os",
    "packages/ai-os/engines/*",
    "packages/ai-os/protocols/*",
    "packages/chromium",
    "packages/chromium-releases",
    "packages/linux-types",
]
# Own lockfile and deploy unit (wrangler); skill templates and references that are copied out, never installed from here.
exclude = [
    # imported repositories keep their own workspaces until their unification step
    "aphrody",
    "aphrody/**",
    "ay",
    "ay/**",
    "cloudflare/material-cdn",
    "plugins/aphrody/skills/3dviz-pro-max/templates/scaffold-vite-threejs",
    "plugins/aphrody/skills/stitch/references/react-components",
    "plugins/aphrody/skills/stitch/references/react-native",
]

# fw (layer 0) must not depend on ay (layer 2). These packages still link ay packages by path; the fix is to move the four ay
# packages they use (core, env-kit, automate, wck, edge-stack) down into fw or to move ai-os up into ay. Tracked here until then;
# `check` fails when an entry no longer applies.
[[bun.debt]]
path = "apps/agents"
why = "links @aphrody/ay-env-kit from ay"

[[bun.debt]]
path = "apps/chromium-dash"
why = "links @aphrody/ay-edge-stack from ay"

[[bun.debt]]
path = "packages/ai-os"
why = "links @aphrody/ay-automate, ay-core, ay-env-kit and ay-wck from ay"

[[bun.debt]]
path = "packages/ai-os/engines/inference"
why = "links @aphrody/ay-env-kit from ay"

[[bun.debt]]
path = "packages/ai-os/engines/rag-core"
why = "links @aphrody/ay-env-kit from ay"

# uv: Python projects live under python/. fw-agent-context is a maturin crate (built by cargo and maturin, not synced by uv);
# tools/google has its own lock.
[uv]
members = ["python/hermes_agent_memory", "crates/fw-agent-context"]
# research_ref needs Python >=3.14 (a workspace has one requires-python, the intersection, and the root pins 3.12); tools/google has its own lock.
exclude = ["python/research_ref", "tools/google", "aphrody", "aphrody/**", "ay", "ay/**"]

[gradle]
root = "core/kotlin"
include = ["fw-core", "fw-material3", "fw-rust-ffi"]
catalog = "core/kotlin/gradle/libs.versions.toml"

[dotnet]
root = "dotnet"
solution = "fw.slnx"
projects = ["dotnet/*"]

[cmake]
projects = ["cpp"]

