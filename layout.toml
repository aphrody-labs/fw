# Bun workspaces: apps/* and packages/* only (the root holds config, not code).
[bun]
workspaces = [
    "apps/agents",
    "apps/chromium-dash",
    "packages/gnu",
    "packages/ai-os",
    "packages/ai-os/engines/*",
    "packages/ai-os/protocols/*",
    "packages/chromium",
    "packages/chromium-releases",
    "packages/linux-types",
    # ay packages and apps: one Bun workspace with fw (they were linked by path from outside the repository before the merge)
    "ay/packages/*",
    "ay/packages/env-kit/*",
    "ay/apps/*",
]
# Own lockfile and deploy unit (wrangler); skill templates and references that are copied out, never installed from here.
exclude = [
    # imported repositories keep their own workspaces until their unification step
    "aphrody",
    "aphrody/**",
    "ay",
    "ay/packages/org-mirror/test/fixtures",
    # own lockfile and deploy unit (Astro Starlight, wrangler); pages are generated by crates/fw-site
    "apps/docs",
    "cloudflare/material-cdn",
    "cloudflare/media-cdn",
    "plugins/aphrody/skills/3dviz-pro-max/templates/scaffold-vite-threejs",
    "plugins/aphrody/skills/stitch/references/react-components",
    "plugins/aphrody/skills/stitch/references/react-native",
]


# uv: Python projects live under python/. fw-agent-context is a maturin crate (built by cargo and maturin, not synced by uv);
# tools/google has its own lock.
[uv]
members = ["python/hermes_agent_memory", "crates/fw-agent-context"]
# research_ref needs Python >=3.14 (a workspace has one requires-python, the intersection, and the root pins 3.12); tools/google has its own lock.
exclude = ["python/research_ref", "tools/google", "aphrody", "aphrody/**", "ay", "ay/**"]

[gradle]
root = "kotlin"
include = ["fw-core", "fw-material3", "fw-rust-ffi"]
catalog = "kotlin/gradle/libs.versions.toml"

[dotnet]
root = "dotnet"
