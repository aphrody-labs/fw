# GitHub reads workflows and actions only from the root .github; the nested copies of the imported trees were ported to the root
# (ay-*.yml, bun-native.yml, release-publish.yml, aphrody-ci.yml, aphrody-release.yml) and must not come back.
[[forbidden]]
path = "ay/.github/workflows"
why = "GitHub ignores it; the workflows live in .github/workflows (ay-*.yml, bun-native.yml, release-publish.yml)"

[[forbidden]]
path = "ay/.github/actions"
why = "GitHub ignores it; the composite action is .github/actions/ay-llvm-pinned"

[[forbidden]]
path = "aphrody/.github/workflows"
why = "GitHub ignores it; the workflows live in .github/workflows (aphrody-*.yml, zed-sync.yml) and aphrody/tooling/bun reads them there"

[[area]]
