# Pure Rust is the direction (owner, 2026-11-21; audit in docs/research/pure-rust-audit-2026-11-21.md). The baseline is every
# non-Rust source file that exists today; it only shrinks as ports land (`bun tools/layout.ts rustonly` rewrites it). A new file
# outside the baseline and the deliberate list below fails `layout.ts check`.
[rustonly]
baseline = "docs/research/pure-rust-baseline.txt"
allow = [
    "packages/linux-types/**",   # generated Linux UAPI types
    "plugins/aphrody/skills/**", # vendored third-party skill scripts and templates
]
