# Pure Rust is the direction (owner, 2026-11-21; audit in docs/research/pure-rust-audit-2026-11-21.md). The baseline is every
# non-Rust source file that exists today; it only shrinks as ports land (`bun tools/layout.ts rustonly` rewrites it). A new file
# outside the baseline and the deliberate list below fails `layout.ts check`.
[rustonly]
baseline = "docs/research/pure-rust-baseline.txt"
allow = [
    "packages/linux-types/**",   # generated Linux UAPI types
    "plugins/aphrody/skills/**", # vendored third-party skill scripts and templates
    "apps/docs/astro.config.mjs",  # Astro framework config of the docs site (pages, sidebar and colors are generated by fw-site)
    "apps/docs/src/content.config.ts", # Starlight content collection, required by the framework
    "cloudflare/media-cdn/**",   # Worker of media.aphrody.com next to cloudflare/material-cdn: Workers run JS or wasm, the Rust port belongs to the fw-workerd lot
    "tools/media-cdn/**",        # Bun CLIs that drive ffmpeg, vips and R2 on the cluster nodes, as tools/material-cdn does
    "tools/hardcoded.*",         # the hardcoded-value measurement and CI check requested for Lot B, configured by tools/hardcoded.toml
    "tools/modern-toolchain/**", # step gates (check.ts, steps.toml) that probe nodes over SSH and parse the step table; Bun like tools/media-cdn, port to a fw subcommand with the xtask lot
]

