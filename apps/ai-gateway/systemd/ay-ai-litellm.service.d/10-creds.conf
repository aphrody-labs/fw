# Drop-in de ay-ai-litellm (prod host) : identifiants systemd-creds au lieu de /etc/aphrody/secrets.env, routes et
# caps patched by apps/ai-gateway/litellm-serve.ts. Installation: apps/ai-gateway/systemd/install-prod.sh.
[Service]
LoadCredentialEncrypted=CLOUDFLARE_API_TOKEN
LoadCredentialEncrypted=LITELLM_MASTER_KEY
LoadCredentialEncrypted=ANTHROPIC_API_KEY
LoadCredentialEncrypted=ANTHROPIC_WORKSPACE_ID
LoadCredentialEncrypted=VERTEX_APHRODY_SA_KEY
Environment=CLOUDFLARE_ACCOUNT_ID=@@accounts.cloudflare_account_id@@
Environment=GOOGLE_CLOUD_LOCATION=us-central1
Environment=AY_AI_HOST=prod
RuntimeDirectory=ay-ai
RuntimeDirectoryMode=0700
ExecStart=
ExecStart=%h/.bun/bin/bun /usr/local/lib/aphrody-ai/litellm-serve.ts --manifest /usr/local/lib/aphrody-ai/ai.toml --overlay /usr/local/lib/aphrody-ai/litellm-overlay.toml --ay %h/.local/bin/ay --litellm %h/.local/bin/litellm
