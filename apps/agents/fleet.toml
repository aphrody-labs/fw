# Agent fleet: which roles run on which host, with per-role timeout and budget.
# No provider list here: ai-os (packages/ai-os) names the CLI/model in each task (`providers`),
# otherwise the runner asks the ai-os (llm_models). growth tasks are drafts only (approval = owner).
# Hosts are named by role: build, test, prod (the ssh aliases are `[hosts]` of ay.local.toml, see packages/env-kit/src/hosts.ts).
# heavy = true: builds/tests/training, the build host only (enforced by runner.ts at enqueue and claim; the prod and test
# hosts never run them, tasks landing there are forwarded to the build host by health). The prod host keeps light prod roles only.
# Read by apps/agents/runner.ts. Doc: docs/agents/AGENT-FIRST.md.

[roles.coder]
heavy = true
timeout_s = 3600
budget_usd = 5

[roles.reviewer]
timeout_s = 1200
budget_usd = 2

[roles.tester]
heavy = true
timeout_s = 2400
budget_usd = 3

[roles.linter]
heavy = true
timeout_s = 1200
budget_usd = 1

[roles.designer]
timeout_s = 2400
budget_usd = 3

[roles.deployer]
timeout_s = 1800
budget_usd = 2

[roles.sre]
timeout_s = 1200
budget_usd = 2

[roles.chromium]
# Chromium/LLVM factory tasks.
heavy = true
timeout_s = 21600
budget_usd = 5

[roles.build]
# Images, release artefacts, toolchains (aphrody-heavy).
heavy = true
timeout_s = 21600
budget_usd = 5

[roles.training]
heavy = true
timeout_s = 43200
budget_usd = 10

[roles.growth]
timeout_s = 1800
budget_usd = 2

# Hosts. `src` = git checkout (main) the runner works in; `ssh` = targets tried in order
# (<host>-mesh = sshd through the cluster mTLS mesh, TCP 7444, fleet IPs only (device/cluster, docs/infra/CLUSTER.md);
# then PC aliases, WireGuard @@network.mesh_cidr@@, public IP). `ship` = where every host sends log.jsonl.
[hosts.prod]
# Production backends only: light prod roles (deploy, health, text-only growth drafts).
roles = ["deployer", "sre", "growth"]
# Every host: user `agent` (systemd --user + linger, sudo NOPASSWD, docker), never uid 0.
src = "~/agents/src"
ssh = ["agent@@@hosts.prod.ssh@@-mesh", "agent@@@hosts.prod.ssh@@", "agent@@@hosts.prod.mesh_ip@@", "agent@@@hosts.prod.public_ip@@"]

[hosts.build]
# Factory (12 cores / 45 GB): every heavy role, plus review/design/sre.
roles = [
  "coder",
  "reviewer",
  "tester",
  "linter",
  "designer",
  "build",
  "chromium",
  "training",
  "sre",
]
src = "~/agents/src"
ssh = [
  "agent@@@hosts.build.ssh@@-mesh",
  "agent@@@hosts.build.ssh@@",
  "agent@@@hosts.build.mesh_ip@@",
  "agent@@@hosts.build.public_ip@@",
]

[hosts.test]
# Edge/proxy/CDN host, 11 GB RAM: minimal, sre only.
roles = ["sre"]
src = "~/agents/src"
ssh = ["agent@@@hosts.test.ssh@@-mesh", "agent@@@hosts.test.ssh@@", "agent@@@hosts.test.mesh_ip@@", "agent@@@hosts.test.public_ip@@"]

[hosts.pc]
# No heavy builds on the PC.
roles = ["reviewer", "designer", "growth"]
# No `src`: the runner works in the checkout it is started from (or $AY_ROOT).

[schedule]
# template (apps/agents/tasks/<name>.json) = period in hours; enqueued by the ship host (the prod host).
# growth templates end as drafts in var/agents/publish/<id>/ (approval = owner): nothing is published.
deps-update = 168
release-notes = 168
seo-check = 168

[ship]
# Every host appends its log.jsonl lines to the prod host over ssh (WireGuard or public ssh).
host = "prod"
dir = "/var/lib/aphrody-agents/logs"
