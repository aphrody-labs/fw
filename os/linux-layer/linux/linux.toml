# The Linux flavour of Aphrody (formerly aphrody-dev/anu): kernel pins, userland Rust map and the upstream sets read by tools/linux-*.ts.

# Upstream sets read live by tools/linux-sources.ts. `all` takes every active repo of the org; `rust` keeps Rust repos
# ranked by stars; `min_stars` drops the long tail.
[sources.unixwin]
org = "unixwin"
take = "all"
dir = "unixwin"

[sources.uutils]
org = "uutils"
take = "all"
dir = "uutils"

[sources.rust-for-linux]
org = "Rust-for-Linux"
take = "all"
dir = "kernel/rust-for-linux"

[sources.microsoft]
org = "microsoft"
take = "rust"
min_stars = 1000
dir = "microsoft"

[sources.rust-lang]
org = "rust-lang"
take = "rust"
min_stars = 500
dir = "rust-lang"

# Hand-picked repositories outside those orgs: Rust kernels, GNU replacements, LFS, docs.
[picks]
kernel = ["asterinas/asterinas", "redox-os/kernel", "theseus-os/Theseus", "maestro-os/maestro", "tock/tock", "hermit-os/kernel", "torvalds/linux"]
gnu-rs = ["trifectatechfoundation/sudo-rs", "pendulum-project/ntpd-rs", "trifectatechfoundation/zlib-rs", "BurntSushi/ripgrep", "sharkdp/fd", "sharkdp/bat", "eza-community/eza", "nushell/nushell", "rustls/rustls", "ajeetdsouza/zoxide", "astral-sh/uv"]
lfs = ["lfs-book/lfs", "lfs-book/blfs"]
docs = ["mkerrisk/man-pages", "MicrosoftDocs/win32", "MicrosoftDocs/sdk-api", "MicrosoftDocs/windows-driver-docs"]
ntfs = ["ColinFinck/ntfs", "ColinFinck/nt-hive", "tuxera/ntfs-3g", "omerbenamram/mft", "winfsp/winfsp", "dokan-dev/dokany", "microsoft/ProjFS-Managed-API"]
nt = ["winsiderss/systeminformer", "winsiderss/phnt", "hfiref0x/WinObjEx64", "googleprojectzero/sandbox-attacksurface-analysis-tools", "x64dbg/x64dbg", "microsoft/Detours", "microsoft/krabsetw", "n4r1b/ferrisetw", "rust-minidump/rust-minidump", "omerbenamram/evtx", "ohadravid/wmi-rs", "CasualX/pelite", "lief-project/LIEF", "ionescu007/SimpleVisor", "microsoft/CsWin32", "microsoft/windows-drivers-rs", "microsoft/win32metadata", "microsoft/wil", "microsoft/cppwinrt", "reactos/reactos", "wine-mirror/wine"]
win32-docs = ["MicrosoftDocs/win32", "MicrosoftDocs/sdk-api", "MicrosoftDocs/windows-driver-docs", "MicrosoftDocs/windows-powershell-docs", "microsoft/Windows-classic-samples", "microsoft/Windows-driver-samples", "microsoft/Windows-universal-samples", "microsoft/WinDbg-Samples"]

# The path-literal scanner of the test suite: a file of another repository at a pinned commit, fetched into .cache/ (gitignored) by
# tools/paths.test.ts, skipped when it cannot be fetched. Nothing else of that repository is read.
[kernel]
arch_commit = "5749fb5c31f8bd47f3c45aa52aa29c8c8873ac35"   # archlinux/packaging/packages/linux: PKGBUILD and config.x86_64
tag = "v7.4-rc3"                                            # mainline tag to build
fragments_repo = "aphrody-dev/aphrody"
fragments_commit = "9694214d3200b17436c79491cf67c122b97262c3"
fragments_dir = "tooling/kernel-watch/kconfig/fragments"
fragments = ["rust.config", "android.config", "wayland.config", "optimize.config", "wsl.config"]

# The Rust map: every GNU or C component of the userland and its Rust replacement. tools/rust-map.ts probes the Arch repositories live and writes
# index/rust-map.toml. status: ships (an Arch package exists) | aur (AUR only) | experimental | none (candidate to watch, no mature replacement).
[[rust_map]]
component = "coreutils"
replaces = "coreutils"
rust = "uutils-coreutils"
upstream = "uutils/coreutils"
arch_pkg = "uutils-coreutils"
[[rust_map]]
component = "sudo"
replaces = "sudo"
rust = "sudo-rs"
upstream = "trifectatechfoundation/sudo-rs"
arch_pkg = "sudo-rs"
[[rust_map]]
component = "time sync"
replaces = "systemd-timesyncd"
rust = "ntpd-rs"
upstream = "pendulum-project/ntpd-rs"
arch_pkg = "ntpd-rs"
[[rust_map]]
component = "grep"
replaces = "grep"
rust = "ripgrep"
upstream = "BurntSushi/ripgrep"
arch_pkg = "ripgrep"
[[rust_map]]
component = "find"
replaces = "findutils"
rust = "fd"
upstream = "sharkdp/fd"
arch_pkg = "fd"
[[rust_map]]
component = "cat"
replaces = "coreutils cat"
rust = "bat"
upstream = "sharkdp/bat"
arch_pkg = "bat"
[[rust_map]]
component = "ls"
replaces = "coreutils ls"
rust = "eza"
upstream = "eza-community/eza"
arch_pkg = "eza"
[[rust_map]]
component = "interactive shell"
replaces = "bash"
rust = "nushell"
upstream = "nushell/nushell"
arch_pkg = "nushell"
[[rust_map]]
component = "bash-compatible shell"
replaces = "bash"
rust = "brush"
upstream = "reubeno/brush"
arch_pkg = "brush"
[[rust_map]]
component = "bash engine"
replaces = "bash"
rust = "rubash"
upstream = "aphrody-labs/rubash"
status = "experimental"
[[rust_map]]
component = "zlib"
replaces = "zlib"
rust = "zlib-rs"
upstream = "trifectatechfoundation/zlib-rs"
status = "experimental"
[[rust_map]]
component = "terminal"
replaces = "xterm"
rust = "alacritty"
upstream = "alacritty/alacritty"
arch_pkg = "alacritty"
[[rust_map]]
component = "editor"
replaces = "vim"
rust = "helix"
upstream = "helix-editor/helix"
arch_pkg = "helix"
[[rust_map]]
component = "editor (GPUI)"
replaces = "vim"
rust = "zed"
upstream = "zed-industries/zed"
arch_pkg = "zed"
[[rust_map]]
component = "desktop session"
replaces = "gnome-session"
rust = "cosmic-session"
upstream = "pop-os/cosmic-session"
arch_pkg = "cosmic-session"
[[rust_map]]
component = "compositor"
replaces = "mutter"
rust = "cosmic-comp"
upstream = "pop-os/cosmic-comp"
arch_pkg = "cosmic-comp"
[[rust_map]]
component = "tiling compositor"
replaces = "sway"
rust = "niri"
upstream = "YaLTeR/niri"
arch_pkg = "niri"
[[rust_map]]
component = "libc"
replaces = "glibc"
