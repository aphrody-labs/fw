# Fw Custom .wslgconfig — Copy to %USERPROFILE%\.wslgconfig
# Pairs with microsoft/wslg PR #1046 (keymap) + RTX 4070 D3D12/Vulkan Wayland acceleration

[system-distro-env]
WESTON_RDP_DEBUG_CLIPBOARD_LEVEL=0
WESTON_RDP_FRACTIONAL_SCALING=true
WESTON_RDP_DISABLE_HI_DPI_SCALING=false
MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
GALLIUM_DRIVER=d3d12
WGPU_BACKEND=vulkan
WAYLAND_DISPLAY=wayland-0
