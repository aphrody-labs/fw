# Fw Custom .wslconfig — Tuned for Windows 11 Insider (WSL 3.0.5) + 24 vCPU / 32 GB RAM / RTX 4070
# Copy to %USERPROFILE%\.wslconfig (adjust kernel/systemDistro paths once built on fr1)

[wsl2]
processors=20
memory=24GB
swap=8GB
localhostForwarding=true
guiApplications=true
nestedVirtualization=true
networkingMode=mirrored
dnsTunneling=true
autoProxy=true
hostAddressLoopback=true
kernelCommandLine=transparent_hugepage=madvise zswap.enabled=0
# Uncomment after copying custom bzImage from fr1:
# kernel=%USERPROFILE%\\.wsl\\fw-bzImage
# Uncomment after copying custom WSLg VHD from fr1:
# systemDistro=%USERPROFILE%\\.wsl\\fw-wslg.vhdx

[experimental]
autoMemoryReclaim=gradual
sparseVhd=true
bestEffortDnsParsing=true
