# Fw v4.0 Official Asterinas OSDK Manifest
# Follows https://asterinas.github.io/book/osdk/guide/create-project.html

project_type = "kernel"

[boot]
method = "grub-rescue-iso"

[grub]
boot_protocol = "multiboot2"

[qemu]
args = """\
    -machine q35,kernel-irqchip=split \
    -cpu Icelake-Server,+x2apic \
    --no-reboot \
    -m 8G \
    -smp 4 \
    -nographic \
    -serial chardev:mux \
    -monitor chardev:mux \
    -chardev stdio,id=mux,mux=on,signal=off \
    -display none \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
"""

[scheme."microvm"]
boot.method = "vmm-direct"
build.strip_elf = true
qemu.args = """\
    -machine microvm,x-option-roms=off,pit=off,pic=off,rtc=on \
    -cpu host \
    -m 4G \
    -smp 4 \
    -no-reboot \
    -nographic \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
"""

[scheme."virtio-gpu"]
boot.method = "vmm-direct"
build.features = ["virtio_webgpu"]
qemu.args = """\
    -machine q35,kernel-irqchip=split \
    -cpu host \
    -m 8G \
    -smp 4 \
    -device virtio-gpu-gl-pci \
    -nographic \
    -device isa-debug-exit,iobase=0xf4,iosize=0x04 \
"""

[scheme."tdx"]
supported_archs = ["x86_64"]
build.features = ["cvm_guest"]
boot.method = "grub-qcow2"
grub.boot_protocol = "linux"
