name: Release & CD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-artifacts:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: fw
            asset: fw-x86_64-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: fw.exe
            asset: fw-x86_64-windows.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: fw
            asset: fw-aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p fw-bin --bin fw
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  publish-cloudflare:
    name: Deploy Cloudflare Edge Worker
    runs-on: ubuntu-latest
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Deploy fw-edge (Workers Static Assets + SQLite DO)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run cf:deploy

  publish-crates-io:
    name: Publish fw-* to crates.io
    runs-on: ubuntu-latest
    if: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order (product.toml)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in fw-wasm fw-ggml fw-compute fw-cluster fw-ostd-wasm fw-uutils fw-nix fw-ui-blitz fw-unified-stack fw-wayland-wgpu fw-hermes-claw fw-proto fw-bin; do
            cargo publish -p "$c" || true
            sleep 15
          done
