name: Release & CD

# Builds the fw binaries and the fw-wasm module, then calls the shared publish job of the ay SDK repository (checksums, release manifest,
# provenance, GitHub Release, R2 objects served by the edge Worker). The matrix and the file names are release.toml [products.fw] of that repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release train channel of a main or release/<M> build (ay docs/release/model.md); a v* tag carries its own
        type: choice
        default: canary
        options: [canary, dev, beta]

permissions:
  contents: read

jobs:
  meta:
    name: Resolve version and channel
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      # Full history: the build number of a version is a commit count (release train, ay docs/release/model.md).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: aphrody-labs/ay
          path: release-tools
          sparse-checkout: |
            tools/release-plan.ts
            release.toml
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
      - id: meta
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          meta=$(bun release-tools/tools/release-plan.ts meta)
          echo "$meta"
          # stable, extended and lts tags name a committed version: product.toml and every copy of it must already hold it.
          case "$(echo "$meta" | bun -e "console.log(JSON.parse(await Bun.stdin.text()).channel)")" in
            stable | extended | lts) bun tools/version.ts --expect "$(echo "$meta" | bun -e "console.log(JSON.parse(await Bun.stdin.text()).version)")" ;;
          esac

  build-artifacts:
    name: Build (${{ matrix.target }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: fw
            asset: fw-x86_64-linux-musl
            package: fw-bin
            cargo_args: --bin fw
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: fw.exe
            asset: fw-x86_64-windows.exe
            package: fw-bin
            cargo_args: --bin fw
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: fw
            asset: fw-aarch64-macos
            package: fw-bin
            cargo_args: --bin fw
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
            bin: fw_wasm.wasm
            asset: fw_wasm.wasm
            package: fw-wasm
            cargo_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain pinned by rust-toolchain.toml, with the target added to that same toolchain (a stable install would miss it).
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl C toolchain for crates with C build scripts
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: oven-sh/setup-bun@v2
      # The binary reports the release version on every channel, canary and beta included.
      - name: Stamp the release version into every manifest
        shell: bash
        run: bun tools/version.ts set "${{ needs.meta.outputs.version }}"
      - name: Build release artifact
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }} ${{ matrix.cargo_args }}
      - name: Stage the artifact under its release name
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  mcp-gate:
    name: MCP conformance of the release binary
    needs: [build-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: release-fw-x86_64-linux-musl
          path: dist
      - name: Build the fixture server of this commit
        run: cargo build --locked -p fw-proto --example mcp_fixture_server
      - name: Run the suite against the release binary
        env:
          FW_ROOT: ${{ github.workspace }}
        run: |
          chmod +x dist/fw-x86_64-linux-musl
          bun tools/mcp-conformance/run.ts \
            --fw dist/fw-x86_64-linux-musl \
            --fixture target/debug/examples/mcp_fixture_server \
            --out target/mcp-conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-gate
          path: target/mcp-conformance

  publish:
    name: Publish fw
    needs: [meta, build-artifacts, mcp-gate]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: aphrody-labs/ay/.github/workflows/release.yml@main
    with:
      product: fw
      version: ${{ needs.meta.outputs.version }}
      channel: ${{ needs.meta.outputs.channel }}
      tag: ${{ needs.meta.outputs.tag }}
      commit: ${{ github.sha }}
      artifacts-pattern: release-*
      tools-repository: aphrody-labs/ay
    secrets: inherit

  publish-cloudflare:
    name: Deploy Cloudflare Edge Worker
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Deploy fw-edge (Workers Static Assets + SQLite DO)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set: fw-edge is not deployed"; exit 0; fi
          bun run cf:deploy

  publish-crates-io:
    name: Publish fw-* to crates.io
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: oven-sh/setup-bun@v2
      # The roots in product.toml plus every workspace crate they depend on, one cargo publish call, versions already on
      # crates.io skipped; any failure fails the job.
      - name: Publish the product.toml crates and their workspace dependencies
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "::error::CARGO_REGISTRY_TOKEN is not set"; exit 1; fi
          bun tools/crates-publish.ts
