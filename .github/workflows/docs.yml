name: Docs

# apps/docs is generated by `fw site` (crates/fw-site) from `fw --help`, the MCP tool list, cargo metadata, the product files and the live
# release manifest, then built with Astro Starlight and deployed as the fw-docs Worker (static assets).
#
# push and pull request: build the binaries, `fw site check` (the committed pages must match the code), build the site.
# push to main, every six hours and manual runs: regenerate with the live release manifest, build and deploy.
#
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts edit on the Aphrody account) and CLOUDFLARE_ACCOUNT_ID are required to deploy.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "crates/fw-site/**"
      - "crates/fw-bin/src/cli_parser.rs"
      - "src/mcp_server.ts"
      - "src/fw_cli.ts"
      - "product.toml"
      - "release.toml"
      - "aphrody/product.toml"
      - "ay/ay.toml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "crates/fw-site/**"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fw-docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/fw-site -> target
      - uses: oven-sh/setup-bun@v2
      - name: Build fw, fw-m3 and fw-site
        run: |
          cargo build --release -p fw-bin --bin fw -p fw-m3 --bin fw-m3
          cargo build --release --manifest-path crates/fw-site/Cargo.toml
      - name: Pages match the code (drift gate)
        if: github.event_name != 'schedule'
        run: crates/fw-site/target/release/fw-site check --fw target/release/fw --m3 target/release/fw-m3
      - name: Regenerate with the live release manifest
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: crates/fw-site/target/release/fw-site gen --live --fw target/release/fw --m3 target/release/fw-m3
      - name: Install
        working-directory: apps/docs
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: apps/docs
        run: bun run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: apps/docs
        run: bunx wrangler@4.166.0 deploy
