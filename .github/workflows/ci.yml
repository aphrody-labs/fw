name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: fw-ci-${{ github.ref }}
  # Pull requests cancel superseded runs; main lets the running one finish so a busy main still gets a verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-cross-os:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Zero-warning Clippy and workspace tests
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Build Fat-LTO fw binary and smoke-verify
        run: |
          cargo build --release -p fw-bin --bin fw
          ./target/release/fw claw status
          ./target/release/fw claw mcp

  wasm-musl-container:
    name: Wasm32 + Linux musl + Alpine OCI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl C toolchain for crates with C build scripts
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build fw-wasm (wasm32) and check fw (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --target wasm32-unknown-unknown -p fw-wasm
          cargo check --target x86_64-unknown-linux-musl -p fw-bin

  crates-io-package:
    name: crates.io Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Verify publishable fw-* tarballs
        run: |
          cargo package -p fw-wasm -p fw-ggml -p fw-compute -p fw-uutils -p fw-nix -p fw-hermes-claw

  bun-edge-and-native:
    name: Bun + Cloudflare Edge + Native ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/fw-abi
      - name: Build the artifacts the live tests execute (fw, fw_wasm.wasm, libfw_abi)
        run: |
          cargo build --release -p fw-bin --bin fw
          cargo build --release --target wasm32-unknown-unknown -p fw-wasm
          cargo build --release --manifest-path native/fw-abi/Cargo.toml
      - name: Native ABI tests
        run: |
          cargo test --manifest-path native/fw-abi/Cargo.toml
      - name: Bun test suite & Cloudflare Workers dry-run
        run: |
          bun test
          bun run cf:dry-run

  kotlin-compose:
    name: Kotlin + Compose Material 3 (theme from ay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned ay source (public repository, no registry credentials)
        id: ay
        run: |
          echo "repo=$(sed -n 's/^theme_source = "\(.*\)"/\1/p' product.toml)" >> "$GITHUB_OUTPUT"
          echo "rev=$(sed -n 's/^theme_source_rev = "\(.*\)"/\1/p' product.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.ay.outputs.repo }}
          ref: ${{ steps.ay.outputs.rev }}
          path: ay-source
          sparse-checkout: |
            kotlin
            brand/tokens
            ay.toml
            Cargo.toml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: core/kotlin
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fw-abi
      - name: Android SDK platform of compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: libfw_abi for the fw-rust-ffi tests
        run: cargo build --release --manifest-path native/fw-abi/Cargo.toml
      - name: Gradle build and tests (fw-material3 consumes aphrody-theme from the pinned ay source)
        working-directory: core/kotlin
        run: |
          export FW_ABI_PATH="$GITHUB_WORKSPACE/native/fw-abi/target/release/libfw_abi.so"
          bash ./gradlew --no-daemon --console=plain -Paphrody.ay.checkout="$GITHUB_WORKSPACE/ay-source" test assembleRelease :fw-material3:dependencies --configuration releaseRuntimeClasspath

  python-and-purity:
    name: Python + Repo Map & Purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - name: Python lint & tests
        run: |
          uvx ruff check .
          uv run python -m unittest discover -s tests
      - name: Verify MAP.tsv & zero hardcoded machine paths (cargo xtask)
        run: |
          cargo xtask purity
          cargo xtask map

  rust-hygiene:
    name: Rust hygiene (deny, machete, shear, rust-stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-shear
      - name: Advisories, bans, licenses and sources (deny.toml)
        run: cargo deny check
      - name: Unused dependencies in the workspace members
        run: |
          cargo machete $(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].manifest_path | sub("/Cargo.toml$"; "")')
          cargo shear --exclude fw-depot
      - name: Rust stack catalog matches its data and the manifests
        run: |
          bun test ./configs/claude/scripts/rust-stack.test.ts
          bun configs/claude/scripts/rust-stack.ts --check

  retired-surfaces:
    name: Retired surfaces and Claude config gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Retired terms (configs/claude/retired.toml), config script tests, claude-bridge over stdio
        run: bun configs/claude/scripts/check.ts
      - name: One product version (product.toml and every copy of it)
        run: bun tools/version.ts
