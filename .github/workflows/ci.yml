name: CI

on:
  push:
    # release/<M> branches of the release train (aphrody-labs/ay docs/release/model.md) get the same gates as main.
    branches: [main, "release/**"]
    # Research notes and agent queue files gate nothing (80 of 1167 main commits since 2026-11-14 touched only these).
    paths-ignore: ["docs/research/**", "docs/agents/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/research/**", "docs/agents/**"]

# Linux jobs of pushes run on our own runners (label cluster: every node of cluster/build.toml, no node preferred); pull requests, which may come from forks, stay on
# GitHub-hosted runners. Windows runs in ci-windows.yml: its 1674 to 2531 s job in this group made every newer push replace the pending run.
concurrency:
  group: fw-ci-${{ github.ref }}
  # Pull requests cancel superseded runs; main lets the running one finish so a busy main still gets a verdict.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust-linux:
    name: Rust (linux)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      # One Cargo workspace holds fw, aphrody/ and ay/; each origin has its own CI job (aphrody-ci.yml, ay-check.yml), this job gates fw's members.
      - name: fw workspace members
        shell: bash
        run: |
          pkgs=$(cargo metadata --no-deps --format-version 1 | jq -r --arg root "$(pwd)/" '.packages[]|select((.manifest_path|startswith($root+"aphrody/")|not) and (.manifest_path|startswith($root+"ay/")|not))|"-p "+.name' | tr -d '\r' | tr '\n' ' ')
          echo "FW_PKGS=$pkgs" >> "$GITHUB_ENV"
      - name: Zero-warning Clippy and workspace tests
        shell: bash
        run: |
          cargo clippy $FW_PKGS --all-targets -- -D warnings
          cargo test $FW_PKGS
      - name: Build Fat-LTO fw binary and smoke-verify
        run: |
          cargo build --release -p fw-bin --bin fw
          ./target/release/fw claw status
          ./target/release/fw claw mcp

  wasm-musl-container:
    name: Wasm32 + Linux musl + Alpine OCI
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: musl C toolchain for crates with C build scripts
        run: command -v musl-gcc || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools; }
      - name: Build fw-wasm (wasm32) and check fw (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --target wasm32-unknown-unknown -p fw-wasm
          cargo check --target x86_64-unknown-linux-musl -p fw-bin

  crates-io-package:
    name: crates.io Packaging
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Verify publishable fw-* tarballs
        run: |
          cargo package -p fw-wasm -p fw-ggml -p fw-compute -p fw-uutils -p fw-nix -p fw-hermes-claw

  bun-edge-and-native:
    name: Bun + Cloudflare Edge + Native ABI
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            native/fw-abi
      - name: Build the artifacts the live tests execute (fw, fw_wasm.wasm, libfw_abi)
        run: |
          cargo build --release -p fw-bin --bin fw
          cargo build --release --target wasm32-unknown-unknown -p fw-wasm
          cargo build --release --manifest-path native/fw-abi/Cargo.toml
      - name: Native ABI tests
        run: |
          cargo test --manifest-path native/fw-abi/Cargo.toml
      - name: Bun test suite & Cloudflare Workers dry-run
        run: |
          bun test
          bun run cf:dry-run

  kotlin-compose:
    name: Kotlin + Compose Material 3 (theme from ay/kotlin)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: kotlin
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fw-abi
      - name: Android SDK platform of compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - name: libfw_abi for the fw-rust-ffi tests
        run: cargo build --release --manifest-path native/fw-abi/Cargo.toml
      - name: Gradle build and tests (fw-material3 consumes aphrody-theme from the included ay/kotlin build)
        working-directory: kotlin
        run: |
          export FW_ABI_PATH="$GITHUB_WORKSPACE/native/fw-abi/target/release/libfw_abi.so"
          bash ./gradlew --no-daemon --console=plain test assembleRelease :fw-material3:dependencies --configuration releaseRuntimeClasspath

  python-and-purity:
    name: Python + Repo Map & Purity
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - name: Python lint & tests
        run: |
          uvx ruff check .
          uv run python -m unittest discover -s tests
      - name: Verify MAP.tsv & zero hardcoded machine paths (cargo xtask)
        run: |
          cargo xtask purity
          cargo xtask map

  rust-hygiene:
    name: Rust hygiene (deny, machete, shear, rust-stack)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ./.github/actions/rust-toolchain
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-machete,cargo-shear
      - name: Advisories, bans, licenses and sources (deny.toml)
        run: cargo deny check
      - name: Unused dependencies in the workspace members
        run: |
          cargo machete $(cargo metadata --no-deps --format-version 1 | jq -r --arg root "$(pwd)/" '.packages[].manifest_path | select((startswith($root+"aphrody/")|not) and (startswith($root+"ay/")|not)) | sub("/Cargo.toml$"; "")')
          cargo shear --exclude fw-depot
      - name: Rust stack catalog matches its data and the manifests
        run: |
          bun test ./configs/claude/scripts/rust-stack.test.ts
          bun configs/claude/scripts/rust-stack.ts --check

  retired-surfaces:
    name: Retired surfaces and Claude config gate
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'cluster' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Retired terms (configs/claude/retired.toml), config script tests, claude-bridge over stdio
        run: bun configs/claude/scripts/check.ts
      - name: One product version (product.toml and every copy of it)
        run: bun tools/version.ts

  layout:
    name: Layout map (crate homes, dependency direction, covered paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: layout.toml generates every manifest it owns, no stale or uncovered path
        run: bun tools/layout.ts check
