name: Material CDN

# Daily: move tools/material-cdn/lock.json to the latest google/material-design-icons and google/fonts commits, rebuild the /v1 tree when
# an input changed, republish it to the material.aphrody.com R2 bucket and re-pin crates/fw-material. Commits straight to main, no branch.
# The Worker job (workflow_dispatch) tests and deploys cloudflare/material-cdn.
#
# Secrets: CLOUDFLARE_API_TOKEN (R2 edit, Workers Scripts edit and zone cache purge on the Aphrody account) is required to publish and deploy.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and republish even when the sources are unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fw-material-cdn
  cancel-in-progress: false

jobs:
  worker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WOFF2 encoder (wasm)
        run: bun tools/material-cdn/wasm.ts
      - name: Install and typecheck
        working-directory: cloudflare/material-cdn
        run: |
          bun install --frozen-lockfile
          bunx wrangler@4.166.0 types
          bunx tsc -p .
      - name: Unit tests (grammar and client; the Worker suite runs against a built tree)
        working-directory: cloudflare/material-cdn
        run: bun test
      - name: Deploy
        working-directory: cloudflare/material-cdn
        run: bunx wrangler@4.166.0 deploy

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MATERIAL_CDN_BASE: https://material.aphrody.com/v1
      MATERIAL_CDN_HOST: material.aphrody.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Move the lock to the latest upstream commits and fetch them
        run: bun tools/material-cdn/sync.ts --update --work .cache/material-cdn
      - name: Changed since the last publish?
        id: changed
        run: bun tools/material-cdn/changed.ts --work .cache/material-cdn
      - name: Build
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: |
          bun tools/material-cdn/build.ts --work .cache/material-cdn --out .cache/material-cdn-out
          bun tools/material-cdn/extras.ts --out .cache/material-cdn-out --aphrody none
      - name: Publish to R2
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: bun tools/material-cdn/publish.ts --out .cache/material-cdn-out
      - name: Pin fw-material
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: bun tools/material-cdn/pin.ts --out .cache/material-cdn-out
      - name: Verify the live outputs by their bytes
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: uv run --quiet --with fonttools==4.68.0 --with brotli==1.2.1 tools/material-cdn/verify.py
      - name: Commit the new lock and pin to main
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: |
          paths="crates/fw-material/vendor tools/material-cdn/lock.json"
          if git diff --quiet -- $paths; then
            echo "lock and pin unchanged"
            exit 0
          fi
          git config user.name "fw-sync"
          git config user.email "fw-sync@users.noreply.github.com"
          git add -- $paths
          git commit -m "chore: pin the Material CDN sources and fw-material to the latest upstream commits"
          git pull --rebase origin main
          git push origin HEAD:main
