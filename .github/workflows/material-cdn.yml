name: Material CDN

# Daily: fast-forward the aphrody-labs forks of google/material-design-icons, googlefonts/googlesans-flex and
# googlefonts/googlesans-code from their upstreams, rebuild tools/material-cdn when an input changed, republish to the
# material.aphrody.com R2 bucket and re-pin crates/fw-material. Commits straight to main, no branch.
#
# Secrets: CLOUDFLARE_API_TOKEN (R2 edit + Workers/zone cache purge on the Aphrody account) is required to publish.
# MATERIAL_FORKS_TOKEN (fine-grained PAT, contents:write on the three forks) is optional: without it the forks are not
# fast-forwarded and the build reads the upstream repositories directly (same content).
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and republish even when the sources are unchanged"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fw-material-cdn
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MATERIAL_CDN_BASE: https://material.aphrody.com/v1
      MATERIAL_CDN_HOST: material.aphrody.com
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - name: Fast-forward the forks
        env:
          FORKS_TOKEN: ${{ secrets.MATERIAL_FORKS_TOKEN }}
        run: |
          if [ -n "$FORKS_TOKEN" ]; then
            GH_TOKEN="$FORKS_TOKEN" bun tools/material-cdn/sync.ts --forks --work .cache/material-cdn
          else
            echo "MATERIAL_FORKS_TOKEN not set: reading the upstream repositories directly"
            bun tools/material-cdn/sync.ts --upstream --work .cache/material-cdn
          fi
      - name: Changed since the last publish?
        id: changed
        run: bun tools/material-cdn/changed.ts --work .cache/material-cdn
      - name: Build
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: bun tools/material-cdn/build.ts --work .cache/material-cdn --out .cache/material-cdn-out
      - name: Publish to R2
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: bun tools/material-cdn/publish.ts --out .cache/material-cdn-out
      - name: Pin fw-material
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: bun tools/material-cdn/pin.ts --out .cache/material-cdn-out
      - name: Commit the new pin to main
        if: steps.changed.outputs.changed == 'true' || inputs.force
        run: |
          paths="crates/fw-material/vendor"
          if git diff --quiet -- $paths; then
            echo "pin unchanged"
            exit 0
          fi
          git config user.name "fw-sync"
          git config user.email "fw-sync@users.noreply.github.com"
          git add -- $paths
          git commit -m "chore: pin fw-material to the latest Material Symbols data"
          git pull --rebase origin main
          git push origin HEAD:main
