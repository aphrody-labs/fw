name: Organization check

# `fw org check` diffs the live aphrody-labs organization against org.toml (profile, settings, security configurations, secrets,
# Actions, labels, rulesets, repository metadata) and fails on drift or on an error finding. Changes go through
# org.toml, `fw org plan`, a committed org.plan.json and `fw org apply`, never through the settings pages.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "org.toml"
      - "org.plan.json"
      - "crates/fw-org/**"
      - ".github/workflows/org-check.yml"

concurrency:
  group: org-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: cluster
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APHRODY_APP_CLIENT_ID }}
          private-key: ${{ secrets.APHRODY_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Build
        run: cargo build --locked --release -p fw-org
      - name: Check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: target/release/fw-org check
