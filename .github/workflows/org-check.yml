name: Organization check

# `fw org check`: the live aphrody-labs organization against org.toml (drift, then best-practice findings). Exit 1 on drift or an error finding.
# `fw org plan` and `fw org apply` stay manual: the plan file is committed first, apply runs only a committed plan.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "org.toml"
      - "org.plan.json"
      - "crates/fw-org/**"
      - ".github/workflows/org-check.yml"

concurrency:
  group: fw-org-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: cluster
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
      - uses: Swatinem/rust-cache@v2
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APHRODY_APP_CLIENT_ID }}
          private-key: ${{ secrets.APHRODY_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Check the organization against org.toml
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: cargo run --release -p fw-org -- check --org org.toml
