name: Sync upstreams

# Cron refresh (bun only: the Cargo workspace needs the sibling ay repository, absent in CI) of the live upstream catalog (plugins/aphrody/skills/upstreams/) and of the research snapshot
# (docs/research/upstream-watch.tsv) for every upstream declared in upstreams.toml, and of the DioxusLabs snapshot (docs/research/dioxuslabs-ecosystem.*, tools/dioxus-snapshot). Commits straight to main, no branch.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fw-sync-upstreams
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Refresh catalog and research snapshot
        run: |
          bun tools/upstream_watch.ts
      - name: Refresh the DioxusLabs snapshot
        run: |
          cargo run --release --manifest-path tools/dioxus-snapshot/Cargo.toml
      - name: Commit changes to main
        run: |
          paths="plugins/aphrody/skills/upstreams docs/research/upstream-watch.tsv docs/research/dioxuslabs-ecosystem.json docs/research/dioxuslabs-ecosystem.md"
          if git diff --quiet -- $paths; then
            echo "upstreams unchanged"
            exit 0
          fi
          git config user.name "fw-sync"
          git config user.email "fw-sync@users.noreply.github.com"
          git add -- $paths
          git commit -m "chore: sync upstream catalog and research snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
