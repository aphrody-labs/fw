name: Rust toolchain from rust-toolchain.toml
description: Install the channel and components pinned by rust-toolchain.toml, then add the requested targets to that same toolchain.
inputs:
  targets:
    description: Space-separated rustup targets to add
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        # A cluster runner keeps its own isolated CARGO_HOME; bootstrap rustup there when it is missing.
        if ! command -v rustup >/dev/null; then
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
        fi
        rustup toolchain install
        if [ -n "$TARGETS" ]; then rustup target add $TARGETS; fi
        rustc --version
