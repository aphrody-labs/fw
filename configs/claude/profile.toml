# Global Claude Code profile, applied by `bun scripts/profile.ts ~/.claude` (also checked by `bun run check`).
# Repositories narrow it further with their own .claude/profile.toml or tools/claude/profile.toml.

[mcp]
# Servers every project keeps; scripts/mcp-profiles.ts disables the rest per project from transcript evidence,
# except in repositories that declare their own profile.
baseline = ["plugin:aphrody:ai-os", "plugin:aphrody:claude-bridge", "plugin:aphrody:memory", "claude-in-chrome"]

[skills]
# Not mirrored from agy into packages/aphrody (scripts/align-agy.ts also skips every skill that an installed plugin ships,
# for example the official cloudflare plugin): unofficial content with no upstream source.
exclude = [
  "cloudflare-platform", # unofficial Cloudflare reference; the cloudflare plugin and mcp.cloudflare.com are the sources
  "ay-cf-finops-infra",  # runbook for the internal cloud units of aphrody-labs/ay (packages/cf-control-plane), not Cloudflare material
]
# Duplicates: hidden from both the model and the / menu in Claude Code (agy keeps them through align-agy).
off = [
  "aphrody:no-slop-humanizer", # aphrody:humanizer covers it with the repository rules
]
# Overlapping specialisations: listed by name only, the umbrella skill carries the description.
# Families merged into one parent skill by scripts/merge-skill-families.ts (bun-*, design, docker-*, ...) need no entry here.
name_only = [
  "aphrody:agent-browser", "aphrody:chrome-devtools", # built-in claude-in-chrome first
]
