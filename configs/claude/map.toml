# Tier and gate of each top-level directory of this repository (scripts/map.ts renders MAP.tsv from the tracked files and this table).
# "packages/<name>" rows are one per plugin; any directory not listed is "misc" with the repository gate.
[default]
tier = "misc"
gate = "bun scripts/check.ts"

["(root)"]
tier = "config"
gate = "bun scripts/check.ts"

[".claude-plugin"]
tier = "marketplace"
gate = "claude plugin validate ."

["packages/aphrody"]
tier = "plugin"
gate = "claude plugin validate packages/aphrody"

["packages/bun"]
tier = "plugin"
gate = "claude plugin validate packages/bun"

[scripts]
tier = "typed-bun"
gate = "bun test scripts"

[skills]
tier = "user-skill"
gate = "bun scripts/skills.ts"

[docs]
tier = "docs"
gate = "read-only"
