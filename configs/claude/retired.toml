# Surfaces that were retired and must not come back. `bun configs/claude/scripts/retired.ts --check` (CI job `retired-surfaces`)
# fails when a tracked file outside an `allow` entry matches a `term`.
#
#   term.pattern   JavaScript regular expression, case-insensitive
#   allow.paths    repository-relative globs (Bun.Glob); `terms` limits the entry to those term ids, otherwise it covers all
#
# History notes keep the retired words on purpose; vendored upstream text and unrelated networking uses of the same word are
# the other allowed paths. A new reference anywhere else fails the check.

[[term]]
id = "relay-hub"
# The removed relay hub (MCP server, SQLite mailbox, RELAY_HOME and RELAY_URL), not the word inside identifiers such as
# TextureLayer or RelayCommand.
pattern = '(?<![a-z])relay(?![a-z])|AphrodyRelay'
reason = "the relay hub was removed on 2026-11-16; cross-session delivery is the claude_inject MCP tool and scripts/notify.ts"

[[term]]
id = "fr2-host"
pattern = '\bfr2\b'
reason = "fr2 is out of service; the cluster nodes are n1 and n2 (cluster/build.toml)"

[[term]]
id = "cluster-role-names"
# Case-sensitive on purpose: PRD (product requirements) and similar words are not the old ssh alias.
pattern = '\b(?-i:fr1|prd)\b'
reason = "nodes are named <node_prefix><index> in cluster/build.toml (n1, n2) and have equal roles; fr1 and prd stay as secondary ssh aliases until every reference is migrated, so new references use the node names"

[[term]]
id = "agy-tooling"
pattern = '\bantigravity\b|\bagy\b|configs/gemini|~/\.gemini/scripts'
reason = "agy (Antigravity CLI) is retired and its repository is archived; the plugin source targets Claude Code only"

[[term]]
id = "ci-setup-node"
pattern = 'uses:\s*actions/setup-node@'
reason = "Bun is the JavaScript runtime of every workflow (oven-sh/setup-bun); node and npm are not installed on the cluster runners (docs/research/modern-toolchain-2026-11.md)"

[[term]]
id = "fairwind-name"
pattern = '\bfairwind'
reason = "Fairwind was an invented name from the agy period; build slices and services use the fleet names (fw-build.slice)"

[[term]]
id = "invented-cluster"
pattern = '10\.66\.0\.|fw-hybrid-v3|default_hybrid_cluster|\bgpu-\d-(pc|gcloud|tpu)|\bvps-\d-(fr1|prd|pingora)|fw-models-gguf|fw-gguf-cas|cluster/topology\.toml|cloudflare-gcloud\.toml'
reason = "a cluster layout that was never deployed (gcloud L4/T4 hosts, a TPU node, 10.66.0.x, a bucket and an R2 store that do not exist); nodes come from cluster/build.toml and live measurement"

[[term]]
id = "invented-seed"
pattern = 'fw-m3-tui-superblock|asterinas-ostd-superblock'
reason = "a made-up superblock written into an empty block store so that it reported blocks it never held"

[[term]]
id = "unfinished-macro"
pattern = '\btodo!\(|\bunimplemented!\('
reason = "a Rust body that panics at run time; return a typed error or implement it"

[[allow]]
paths = ["docs/agents/queue/**", "docs/agents/consolidation-*.md", "docs/release/**", "docs/research/fictional-purge-2026-11.md"]
reason = "history notes of the retirement itself"

[[allow]]
terms = ["cluster-role-names"]
paths = [
  # The declaration of the aliases and the files that exercise them.
  "cluster/build.toml",
  "configs/claude/scripts/build-cluster.test.ts",
  "configs/claude/CLAUDE.md",
  # Not yet migrated to the node names, owned by other lots (see the unified-cluster lot, remaining: remove the old aliases).
  "aphrody/**",
  "ay/**",
  "crates/**",
  "docs/**",
  "nix/**",
  "os/**",
  "packages/**",
  "src/**",
  "tests/**",
  "tools/**",
  ".github/**",
  "AGENTS.md",
  "deny.toml",
  "flake.nix",
  "justfile",
  "layout.toml",
  "upstreams.toml",
  "cluster/dns-removed-2026-11-21.json",
  "cluster/estate.plan.json",
  "cluster/estate.toml",
  "cluster/topology.toml",
  "configs/claude/scripts/rust-audit.ts",
  "configs/claude/toolchain.toml",
  "plugins/aphrody/skills/ai-os-orchestrator/SKILL.md",
  "plugins/aphrody/skills/bun-reference/data/**",
  "plugins/aphrody/skills/bun-upstream/SKILL.md",
  "plugins/aphrody/skills/context7-deep-research/SKILL.md",
  "plugins/aphrody/skills/depot-tools/SKILL.md",
  "plugins/aphrody/skills/emscripten/references/**",
  "plugins/aphrody/skills/fleet/SKILL.md",
  "plugins/aphrody/skills/formal-verification/references/**",
  "plugins/aphrody/skills/gpui/references/**",
  "plugins/aphrody/skills/hostinger/SKILL.md",
  "plugins/aphrody/skills/ie-game-formats/SKILL.md",
  "plugins/aphrody/skills/learn/SKILL.md",
  "plugins/aphrody/skills/linux-kernel/SKILL.md",
  "plugins/aphrody/skills/modern-web/data/**",
  "plugins/aphrody/skills/rust-cargo/**",
  "plugins/aphrody/skills/rust-lang-process/SKILL.md",
  "plugins/aphrody/skills/upstreams/**",
  "plugins/aphrody/skills/wasm-bindgen/SKILL.md",
  "plugins/aphrody/skills/web-quality/**",
]
reason = "the files below still carry the old ssh aliases fr1 and prd: the allow list shrinks as each is migrated, and anything new outside it fails"

[[allow]]
terms = ["fr2-host"]
paths = ["aphrody/**"]
reason = "the imported aphrody/ tree still names fr2 in fleet tooling and tests; owned by the unified-cluster lot (remove fr2 aliases), the entry goes away with the last reference"

[[allow]]
paths = ["configs/claude/retired.toml", "configs/claude/scripts/retired.ts", "configs/claude/scripts/retired.test.ts"]
reason = "the check names the terms it rejects"

# Vendored upstream text and generated data that use the same words for unrelated things.
[[allow]]
paths = ["aphrody/**"]
terms = ["relay-hub", "agy-tooling", "unfinished-macro"]
reason = "the Zed fork: upstream Zed source uses the same words for unrelated things (relay, agy as an identifier prefix) and unimplemented!() for trait contracts and test doubles; the invented names and seeds stay guarded here"

[[allow]]
paths = [
  "plugins/aphrody/skills/gemini-api/references/**",
  "plugins/aphrody/skills/stitch/references/**",
  "plugins/aphrody/skills/android/references/**",
  "plugins/aphrody/skills/bun-aphrody/references/bun-crates/**",
  "plugins/aphrody/skills/bun-reference/data/**",
]
reason = "upstream documentation copied by plugins/aphrody/scripts/unify.ts: Google's `antigravity-preview-*` managed-agent model ids, the Relay GraphQL transpiler of Bun, a baton metaphor"

[[allow]]
paths = ["docs/crates/index.jsonl", "docs/research/upstream-watch.tsv"]
terms = ["relay-hub"]
reason = "generated indexes of crates.io and upstream repositories (iroh-relay, tor-relay-selection, moq-relay)"

[[allow]]
paths = ["os/kernel-pipeline/prd.config"]
terms = ["relay-hub"]
reason = "CONFIG_RELAY is a Linux kernel option"

[[allow]]
paths = ["crates/fw-material/vendor/**"]
terms = ["agy-tooling"]
reason = "generated Material Symbols tables: the glyph is named antigravity"

[[allow]]
paths = ["docs/research/acp-mcp-gemini-4-2026-11-21.md", "docs/research/rust-stack.md", "docs/research/rust-stack.toml"]
terms = ["agy-tooling"]
reason = "research notes that record what the retirement removed"

[[allow]]
paths = ["crates/fw-gemini/src/google/atlas.json"]
terms = ["agy-tooling"]
reason = "measured audit snapshot of Google hosts: antigravity.google is one audited host and its counts are pinned to the source"

[[allow]]
paths = ["ay/docs/research/**", "ay/docs/features.md", "ay/docs/features.toml"]
terms = ["agy-tooling", "relay-hub"]
reason = "research on third-party products (Googlebook, Pixel, Cloudflare TURN and OHTTP relays, Stitch) and the feature catalog derived from it"

[[allow]]
paths = ["ay/naming.toml"]
terms = ["agy-tooling"]
reason = "list of crate names already published on crates.io, which never frees a name"

[[allow]]
paths = ["ay/locales/**", "ay/packages/org-mirror/test/fixtures/**", "ay/packages/wck/data/**", "packages/linux-types/**"]
terms = ["relay-hub"]
reason = "locale catalogs, mirrored GitHub text, a word list and generated Linux UAPI names (AMT_MODE_RELAY, 6rd relay_prefix) use the word for networking"

[[allow]]
paths = ["packages/linux-types/**"]
terms = ["relay-hub"]
reason = "generated Linux UAPI identifiers (struct fields such as relay_prefixlen)"

[[allow]]
terms = ["ci-setup-node"]
paths = ["ay/tools/bun-native.test.ts"]
reason = "test fixture of the legacy scanner that rewrites this very line"

[[allow]]
paths = ["plugins/aphrody/skills/*/data/**"]
terms = ["unfinished-macro"]
reason = "generated indexes of upstream API text (wgpu documents a todo! example)"
