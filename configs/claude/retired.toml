# Surfaces that were retired and must not come back. `bun configs/claude/scripts/retired.ts --check` (CI job `retired-surfaces`)
# fails when a tracked file outside an `allow` entry matches a `term`.
#
#   term.pattern   JavaScript regular expression, case-insensitive
#   allow.paths    repository-relative globs (Bun.Glob); `terms` limits the entry to those term ids, otherwise it covers all
#
# History notes keep the retired words on purpose; vendored upstream text and unrelated networking uses of the same word are
# the other allowed paths. A new reference anywhere else fails the check.

[[term]]
id = "relay-hub"
# The removed relay hub (MCP server, SQLite mailbox, RELAY_HOME and RELAY_URL), not the word inside identifiers such as
# TextureLayer or RelayCommand.
pattern = '(?<![a-z])relay(?![a-z])|AphrodyRelay'
reason = "the relay hub was removed on 2026-11-16; cross-session delivery is the claude_inject MCP tool and scripts/notify.ts"

[[term]]
id = "fr2-host"
pattern = '\bfr2\b'
reason = "fr2 is out of service; fleet roles are fr1 (builds, CI, heavy agents) and prd"

[[term]]
id = "agy-tooling"
pattern = '\bantigravity\b|\bagy\b|configs/gemini|~/\.gemini/scripts'
reason = "agy (Antigravity CLI) is retired and its repository is archived; the plugin source targets Claude Code only"

[[allow]]
paths = ["docs/agents/queue/**", "docs/agents/consolidation-*.md", "docs/release/**"]
reason = "history notes of the retirement itself"

[[allow]]
paths = ["configs/claude/retired.toml", "configs/claude/scripts/retired.ts", "configs/claude/scripts/retired.test.ts"]
reason = "the check names the terms it rejects"

# Vendored upstream text and generated data that use the same words for unrelated things.
[[allow]]
paths = ["aphrody/**"]
reason = "the Zed fork: upstream Zed source and docs use the same words for unrelated things (relay, agy as an identifier prefix)"

[[allow]]
paths = [
  "plugins/aphrody/skills/gemini-api/references/**",
  "plugins/aphrody/skills/stitch/references/**",
  "plugins/aphrody/skills/android/references/**",
  "plugins/aphrody/skills/bun-aphrody/references/bun-crates/**",
  "plugins/aphrody/skills/bun-reference/data/**",
]
reason = "upstream documentation copied by plugins/aphrody/scripts/unify.ts: Google's `antigravity-preview-*` managed-agent model ids, the Relay GraphQL transpiler of Bun, a baton metaphor"

[[allow]]
paths = ["docs/crates/index.jsonl", "docs/research/upstream-watch.tsv"]
terms = ["relay-hub"]
reason = "generated indexes of crates.io and upstream repositories (iroh-relay, tor-relay-selection, moq-relay)"

[[allow]]
paths = ["os/kernel-pipeline/prd.config"]
terms = ["relay-hub"]
reason = "CONFIG_RELAY is a Linux kernel option"

[[allow]]
paths = ["crates/fw-material/vendor/**"]
terms = ["agy-tooling"]
reason = "generated Material Symbols tables: the glyph is named antigravity"

[[allow]]
paths = ["docs/research/acp-mcp-gemini-4-2026-11-21.md", "docs/research/rust-stack.md", "docs/research/rust-stack.toml"]
terms = ["agy-tooling"]
reason = "research notes that record what the retirement removed"

[[allow]]
paths = ["crates/fw-gemini/src/google/atlas.json"]
terms = ["agy-tooling"]
reason = "measured audit snapshot of Google hosts: antigravity.google is one audited host and its counts are pinned to the source"

[[allow]]
paths = ["ay/docs/research/**", "ay/docs/features.md", "ay/docs/features.toml"]
terms = ["agy-tooling", "relay-hub"]
reason = "research on third-party products (Googlebook, Pixel, Cloudflare TURN and OHTTP relays, Stitch) and the feature catalog derived from it"

[[allow]]
paths = ["ay/naming.toml"]
terms = ["agy-tooling"]
reason = "list of crate names already published on crates.io, which never frees a name"

[[allow]]
paths = ["ay/locales/**", "ay/packages/org-mirror/test/fixtures/**", "ay/packages/wck/data/**", "packages/linux-types/**"]
terms = ["relay-hub"]
reason = "locale catalogs, mirrored GitHub text, a word list and generated Linux UAPI names (AMT_MODE_RELAY, 6rd relay_prefix) use the word for networking"

[[allow]]
paths = ["packages/linux-types/**"]
terms = ["relay-hub"]
reason = "generated Linux UAPI identifiers (struct fields such as relay_prefixlen)"
