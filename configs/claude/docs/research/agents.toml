# Craft Anything (aphrody-labs/craft-anything) studies a target, has a coding agent build a clean-room version, checks it
# against the original and refines. Each column maps onto that loop; nothing here is built yet.
[craft]
engine = "aphrody-labs/craft-anything"
loop = "study target -> build -> check against original -> refine"

[craft.openclaw]
target = "gateway protocol (packages/gateway-protocol), plugin manifest schema (extensions/*/openclaw.plugin.json), channel adapters"
build = "Bun/TypeScript MCP servers per channel, reusing packages/gateway-client where it runs unmodified"
check = "replay recorded gateway frames and pairing flows against the new server; diff tool lists with src/mcp/tools-stdio-server.ts"
update = "on each upstream release tag, re-run the study on the changed extensions/ and src/gateway/ paths"

[craft.hermes]
target = "gateway/session.py key scheme, cron/jobs.json format, agent/curator.py and background_review.py behavior, skill hub protocol"
build = "agent.toml jobs and Claude Code skills/hooks equivalents; skills copied as-is where the format matches"
check = "feed the same transcripts through curator logic and compare archive/consolidate decisions; cron schedule parity tests"
update = "diff plugins/platforms/* and skills/ on each release tag; import new skills through scripts/skills.ts audit"

[craft.claude]
target = "the repo itself as the output: packages/, scripts/, agent.toml, docs/graph/"
build = "regenerate from docs/research/agents.toml gaps: each missing/partial row becomes a craft job with the upstream proof path as the study target"
check = "bun test, bun scripts/check.ts, bun scripts/bench.ts compare, bun scripts/matrix.ts --check"
update = "scripts/graph.ts output diff between runs is the change set a craft job must explain"
