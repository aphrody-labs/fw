# Feature matrix: OpenClaw vs Hermes Agent vs the claude repo (~/.claude, aphrody-labs/claude).
# Proof paths of openclaw/hermes are repo-relative in the upstream checkouts (fr1 $WORK/agents/{openclaw,hermes-agent}).
# Proof paths of claude are relative to ~/.claude and are verified by `bun scripts/matrix.ts --check`.
# status: present | partial | missing. `was` records the claude status before the 2026-11-17 work when it changed.

[meta]
date = "2026-11-17"
openclaw = { repo = "aphrody-labs/openclaw", upstream = "openclaw/openclaw", release = "v2026.11.4", commit = "a2a0131d4", stack = "TypeScript, Node >=24, pnpm workspace (extensions/*, packages/*, apps/*), Swift/Kotlin apps, Rust crates", license = "MIT" }
hermes = { repo = "aphrody-labs/hermes-agent", upstream = "NousResearch/hermes-agent", release = "v0.23.2", commit = "e22269a1", stack = "Python >=3.11, uv, gateway/ + plugins/ + tools/, Ink TUI, Electron desktop", license = "MIT" }
claude = { repo = "aphrody-labs/claude", stack = "Bun/TypeScript hooks and scripts on top of the Claude Code harness; plugins aphrody and bun", license = "MIT" }

