# Repository root for include!/include_str! paths and build scripts (crates/ay-core/build.rs).
[env]
AY_ROOT = { value = ".", relative = true }

# reqwest gates its HTTP/3 client (the `http3` feature of ay-http) behind this cfg; it must reach reqwest itself.
[build]
rustflags = ["--cfg", "reqwest_unstable"]
