[package]
name = "ay-a2a"
version = "1.4.7"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository = "https://github.com/aphrody-dev/ay"
authors.workspace = true
publish = true
description = "A2A v1: protocol types, protobuf conversion (pb), async client (client), server framework (server), Aphrody coordination (coordinator) and the gRPC binding (grpc)"

[features]
# wasm32 consumers build with `default-features = false, features = ["client"]`.
default = ["pb", "client", "server", "coordinator", "grpc", "rustls-tls"]
pb = ["dep:pbjson", "dep:pbjson-types", "dep:prost", "dep:prost-types", "dep:tonic", "dep:tonic-prost", "dep:pbjson-build", "dep:protoc-bin-vendored", "dep:tonic-prost-build"]
client = ["pb", "dep:async-trait", "dep:auto_impl", "dep:bytes", "dep:futures", "dep:tracing", "dep:ay-http", "ay-http/client", "dep:tokio", "dep:getrandom"]
server = ["pb", "dep:async-trait", "dep:futures", "dep:tracing", "dep:axum", "dep:hyper", "dep:ay-http", "ay-http/client", "ay-http/server", "dep:tokio", "dep:tokio-stream", "dep:tower"]
coordinator = ["server", "dep:ay-proc", "dep:getrandom", "dep:which"]
grpc = ["pb", "client", "server", "dep:http", "dep:tokio-stream", "dep:tonic"]
# TLS: rustls is the default provider for the HTTP client; `rustls` adds the TLS listener of the server and the gRPC TLS transport.
rustls-tls = ["dep:rustls",]
rustls = ["rustls-tls", "dep:rcgen", "dep:tokio-rustls", "dep:tonic-tls"]

[lib]
name = "ay_a2a"
path = "src/lib.rs"

[dependencies]
ay-http = { path = "../ay-http", default-features = false, optional = true }
async-trait = { version = "0.1.92", optional = true }
auto_impl = { version = "1", optional = true }
base64 = { version = "0.23.1", features = ["alloc"] }
bytes = { version = "1.12.2", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
futures = { version = "0.3.34", optional = true }
pbjson = { version = "0.9", optional = true }
pbjson-types = { version = "0.9", optional = true }
prost = { version = "0.14.6", optional = true }
prost-types = { version = "0.14.6", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false }
tracing = { version = "0.1.44", optional = true }
uuid = { version = "1.29.3", default-features = false, features = ["v4", "v7", "serde", "std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"], optional = true }
ay-proc = { path = "../ay-proc", optional = true }
getrandom = { version = "0.4", optional = true }
http = { version = "1", optional = true }
hyper = { version = "1", optional = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
tokio-stream = { version = "0.1", features = ["net"], optional = true }
tonic = { version = "0.14.9", optional = true }
tonic-prost = { version = "0.14.9", optional = true }
tonic-tls = { version = "0.7", default-features = false, features = ["rustls"], optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
which = { version = "8", optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { version = "1.29.3", default-features = false, features = ["v4", "v7", "serde", "js", "std"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[target.'cfg(target_os = "wasi")'.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[build-dependencies]
pbjson-build = { version = "0.9", optional = true }
protoc-bin-vendored = { version = "3", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util"] }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
clap = { version = "4.6.6", features = ["derive", "env", "color"] }
hex = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }

[[test]]
name = "pb_protojson"
path = "tests/pb_protojson.rs"
required-features = ["pb"]

[[example]]
name = "client_a2a_duel_loop"
path = "examples/client_a2a_duel_loop.rs"
required-features = ["client"]

[[test]]
name = "client_transport_kind"
path = "tests/client_transport_kind.rs"
required-features = ["client"]

[[test]]
name = "coordinator_coord_proxy"
path = "tests/coordinator_coord_proxy.rs"
required-features = ["coordinator"]

[[test]]
name = "coordinator_http_e2e"
path = "tests/coordinator_http_e2e.rs"
required-features = ["coordinator"]

[[test]]
name = "grpc_e2e"
path = "tests/grpc_e2e.rs"
required-features = ["grpc"]

# The build script sets PROTOC with `set_var`; the workspace forbids unsafe code.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
