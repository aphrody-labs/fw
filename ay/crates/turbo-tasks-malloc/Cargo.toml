[package]
name = "turbo-tasks-malloc"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A wrapper around mimalloc or the system allocator that tracks allocations"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[lib]
bench = false

[features]
custom_allocator = ["dep:mimalloc"]
default = ["custom_allocator"]

[target."cfg(not(any(target_os = \"linux\", target_family = \"wasm\", miri)))".dependencies]
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.6.1", optional = true }

[target."cfg(all(target_os = \"linux\", not(target_family = \"wasm\"), not(miri)))".dependencies]
mimalloc = { git = "https://github.com/microsoft/mimalloc", tag = "v3.6.1", features = ["local_dynamic_tls"], optional = true }
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[lints]
workspace = true
