# Generated by `bun tools/rust-extract.ts` — crates.io-ready unified workspace member.
[package]
name = "turbopath"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "turbopath extracted from vercel/turborepo for the unified Rust + Bun Vercel workspace"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[features]
biome = ["dep:biome_deserialize", "dep:turborepo-unescape"]

[dependencies]
biome_deserialize = { optional = true, version = "0.6.0", features = ["serde"] }
turborepo-unescape = { optional = true, path = "../turborepo-unescape", version = "0.1.0" }
camino = { version = "1.1.4", features = ["serde1"] }
dunce = { version = "1.0.3" }
fs-err = "2.9.0"
miette = { version = "7.5.0", features = ["fancy"] }
path-clean = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = { version = "2.0.18" }
wax = { path = "../turborepo-wax", version = "0.6.0" }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
