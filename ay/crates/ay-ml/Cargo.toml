[package]
name = "ay-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
config = ["dep:anyhow", "dep:atomicwrites", "dep:dirs", "dep:serde", "dep:tokio", "dep:toml", "dep:tracing"]
runtime = ["dep:anyhow", "dep:dirs", "dep:serde", "dep:tokio", "dep:tracing", "dep:backon", "dep:dunce", "dep:fast-glob", "dep:flate2", "dep:fs4", "dep:futures", "dep:hf-hub", "dep:libc", "dep:libloading", "dep:petgraph", "dep:reqwest", "dep:reqwest-middleware", "dep:reqwest-retry", "dep:strum", "dep:tar", "dep:tempfile", "dep:walkdir", "dep:zip", "config"]
default = ["config", "runtime"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
atomicwrites = { version = "0.4.4", optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"], optional = true }
dirs = { version = "7.0.0", optional = true }
dunce = { version = "1.0.5", optional = true }
fast-glob = { version = "1.1.2", optional = true }
flate2 = { version = "1.1.11", optional = true }
fs4 = { version = "1.1.0", optional = true }
futures = { version = "0.3.34", optional = true }
hf-hub = { version = "1.0.0", optional = true }
libc = { version = "0.2.191", optional = true }
libloading = { version = "0.9.1", optional = true }
petgraph = { version = "0.8.3", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], optional = true }
reqwest-middleware = { version = "0.5.2", optional = true }
reqwest-retry = { version = "0.9.1", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"], optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { version = "3.27.0", optional = true }
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"], optional = true }
toml = { version = "1.2.1", optional = true }
tracing = { version = "0.1.44", optional = true }
walkdir = { version = "2.5.0", optional = true }
zip = { version = "9.7.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.5"

# Loads CUDA, HIP and Vulkan runtimes with libloading: documented `unsafe` blocks, so the workspace `unsafe_code = "forbid"` does not apply.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
