[package]
name = "ay-ml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["ay-ml"]

[features]
config = ["dep:anyhow", "dep:atomicwrites", "dep:dirs", "dep:toml", "dep:tracing"]
runtime = ["dep:anyhow", "dep:dirs", "dep:tracing", "dep:backon", "dep:dunce", "dep:fast-glob", "dep:flate2", "dep:fs4", "dep:futures", "dep:hf-hub", "dep:libc", "dep:libloading", "dep:petgraph", "dep:ay-http", "dep:strum", "dep:tar", "dep:tempfile", "dep:walkdir", "dep:zip", "config"]
full = ["config", "runtime", "jobs"]
jobs = ["dep:async-trait", "dep:chrono", "dep:rusqlite", "dep:serde_json", "dep:thiserror", "dep:uuid"]
default = []

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
atomicwrites = { version = "0.4.4", optional = true }
ay-http = { path = "../ay-http", default-features = false, features = ["client"], optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std", "tokio-sleep"], optional = true }
chrono = { workspace = true, features = ["clock", "serde"], optional = true }
dirs = { workspace = true, optional = true }
dunce = { version = "1.0.5", optional = true }
fast-glob = { version = "1.1.2", optional = true }
flate2 = { workspace = true, optional = true }
fs4 = { version = "1.1.0", optional = true }
futures = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
petgraph = { version = "0.8.3", optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
strum = { version = "0.28.0", features = ["derive"], optional = true }
tar = { version = "0.4.46", optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process", "full"] }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"], optional = true }
walkdir = { workspace = true, optional = true }
zip = { version = "9.7.0", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
ay-ml = { path = ".", features = ["full"] }
tempfile.workspace = true
toml.workspace = true

[[test]]
name = "jobs_crash_recovery"
path = "tests/jobs_crash_recovery.rs"
required-features = ["jobs"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
