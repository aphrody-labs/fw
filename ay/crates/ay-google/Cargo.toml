[package]
name = "ay-google"
description = "Aphrody OS Google facade: public search, language atlas and project contract with the Gemini, Antigravity and model-client integrations, the google CLI, routes, detection and translation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "ay_google"
path = "src/lib.rs"

[dependencies]
ay-gemini = { path = "../ay-gemini", default-features = false, features = ["web"] }
ay-http = { path = "../ay-http", default-features = false, features = ["client"] }
ay-model = { path = "../ay-model", default-features = false, features = ["antigravity"] }
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
ay-gemini = { path = "../ay-gemini", default-features = false, features = ["runtime"] }
ay-model = { path = "../ay-model", default-features = false, features = ["client"] }
bun_browser_dom = "1.4.8"
chrono = { version = "0.4.45", default-features = false }
clap = { workspace = true, version = "4.6.8", features = ["derive", "env"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
regex = { version = "1.13.2", default-features = false }
rusqlite = { workspace = true, version = "0.40", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false }
tokio = { workspace = true, version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
url = { workspace = true, version = "2.5.8" }

[lints]
workspace = true
