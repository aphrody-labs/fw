[package]
name = "ay-media-core"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[lib]
path = "src/ay_media_core.rs"

[build-dependencies]
cc = "1.2"

# FFI crate: the workspace forbids unsafe code, this crate calls its C and NASM kernels through documented `unsafe` blocks.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
