[package]
name = "next-bun"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Unified Next.js, Turbopack, Turborepo, and Vercel Runtime integration optimized for Rust and Bun"
repository = "https://github.com/aphrody-labs/ay-vercel"
keywords = ["nextjs", "turbopack", "turborepo", "vercel", "bun"]
categories = ["web-programming", "development-tools::build-utils"]

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
http = "1.3.1"
next-code-frame = { path = "../next-code-frame", version = "0.0.1" }
next-taskless = { path = "../next-taskless", version = "0.0.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.47.1", features = ["macros", "rt"] }
turbo-persistence = { path = "../turbo-persistence", version = "0.1.0" }
turbo-rcstr = { path = "../turbo-rcstr", version = "0.1.0" }
turbo-tasks = { path = "../turbo-tasks", version = "0.1.0" }
turbo-tasks-backend = { path = "../turbo-tasks-backend", version = "0.1.0" }
turbo-unix-path = { path = "../turbo-unix-path", version = "0.0.1" }
turbopath = { path = "../turborepo-paths", version = "0.1.0" }
turborepo-ai-agents = { path = "../turborepo-ai-agents", version = "0.1.0" }
turborepo-ci = { path = "../turborepo-ci", version = "0.1.0" }
turborepo-package-manager = { path = "../turborepo-package-manager", version = "0.1.0" }
turborepo-repository = { path = "../turborepo-repository", version = "0.1.0" }
turborepo-trace-lang-js = { path = "../turborepo-trace-lang-js", version = "0.1.0" }
turborepo-trace-lang-rust = { path = "../turborepo-trace-lang-rust", version = "0.1.0" }
vercel_runtime = { path = "../vercel_runtime", version = "2.4.1" }

[lints]
workspace = true
