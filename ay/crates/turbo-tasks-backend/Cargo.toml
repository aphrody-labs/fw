# Generated by `bun tools/rust-extract.ts` — crates.io-ready unified workspace member.
[package]
name = "turbo-tasks-backend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "turbo-tasks-backend extracted from vercel/next.js for the unified Rust + Bun Vercel workspace"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[lib]
bench = false

[features]
default = []
print_cache_item_size_with_compressed = ["print_cache_item_size", "dep:lz4_flex"]
print_cache_item_size = []
no_fast_stale = []
aggregation_update_no_batch = []
verify_serialization = []
verify_aggregation_graph = []
verify_immutable = []
verify_determinism = ["turbo-tasks/verify_determinism"]
hanging_detection = ["turbo-tasks/hanging_detection"]
task_dirty_cause = ["turbo-tasks/task_dirty_cause"]
trace_aggregation_update_stats = []
trace_aggregation_update_queue = []
trace_aggregation_update = ["trace_aggregation_update_queue"]
trace_leaf_distance_update = []
trace_find_and_schedule = ["trace_aggregation_update_queue"]
trace_task_completion = []
trace_task_modification = []
trace_task_dirty = ["trace_aggregation_update_queue", "task_dirty_cause"]
trace_task_output_dependencies = []
trace_task_details = []
trace_prepare_tasks = []

[dependencies]
anyhow = { version = "1.0.100" }
bincode = { version = "2.0.1", features = ["serde"] }
auto-hash-map = { path = "../turbo-tasks-auto-hash-map", version = "0.1.0" }
bitfield = { version = "0.19.4" }
crossbeam-utils = { version = "0.8" }
dashmap = { features = ["raw-api"], version = "7.0.0-rc2" }
fs-err = { version = "3.1.1" }
hashbrown = { version = "0.15.4" }
indexmap = { version = "2.14.0" }
jiff = "0.2.10"
lz4_flex = { optional = true, version = "0.14.0", default-features = false, features = ["std", "checked-decode"] }
parking_lot = { version = "0.12.1" }
ringmap = { features = ["serde"], version = "0.2.5" }
rustc-hash = { version = "2.1.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151" }
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
tokio = { version = "1.52.1" }
tracing = { version = "0.1.44" }
turbo-bincode = { path = "../turbo-bincode", version = "0.0.0" }
turbo-rcstr = { path = "../turbo-rcstr", version = "0.1.0" }
turbo-tasks = { path = "../turbo-tasks", version = "0.1.0" }
turbo-tasks-hash = { path = "../turbo-tasks-hash", version = "0.1.0" }
turbo-tasks-malloc = { default-features = false, path = "../turbo-tasks-malloc", version = "0.1.0" }
thread_local = { version = "1.1.8" }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
turbo-persistence = { path = "../turbo-persistence", version = "0.1.0" }

[target."cfg(target_family = \"wasm\")".dependencies]
turbo-persistence = { default-features = false, path = "../turbo-persistence", version = "0.1.0" }

[lints]
workspace = true
