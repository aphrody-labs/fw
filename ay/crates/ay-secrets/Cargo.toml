[package]
name = "ay-secrets"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors.workspace = true
repository.workspace = true
readme = "README.md"
publish = false
description = "Secret store abstraction (env + plaintext file + AES-256-GCM/Argon2id encrypted file) with redacted Display/Debug, constant-time equality, and Zeroize-on-drop SecretValue newtype. Legacy crates.io name: aphrody-secrets."

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
aes-gcm = { workspace = true, version = "0.11.1" }
argon2 = "0.6"
base64 = "0.23.1"
rand = "0.10.4"
tokio = { workspace = true, version = "1.54.1" }

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
