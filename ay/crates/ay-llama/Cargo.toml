[package]
name = "ay-llama"
version = "1.4.7"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-dev/ai-os"
authors.workspace = true
publish = true
description = "Safe Rust bindings for llama.cpp with runtime dynamic loading."

[features]
default = []
full = ["llguidance", "sampler", "in-process", "test-support", "server"]
llguidance = ["dep:llguidance", "dep:toktrie"]
sampler = []
in-process = ["server", "ay-model/onnx", "dep:ay-model", "dep:ay-toolcall", "dep:async-trait", "dep:base64", "dep:bytes", "dep:chrono", "dep:futures", "dep:ay-ml", "dep:libloading", "dep:minijinja", "dep:minijinja-contrib"]
test-support = []
server = ["dep:ay-gemini", "dep:ay-model", "dep:ay-proc", "dep:axum", "dep:ay-http", "dep:rustls", "dep:serde", "dep:serde_json", "dep:tokio"]

[lib]
name = "ay_llama"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true, optional = true }
axum = { workspace = true, features = ["http2"], optional = true }
ay-gemini = { path = "../ay-gemini", default-features = false, features = ["web"], optional = true }
ay-http = { path = "../ay-http", default-features = false, features = ["client", "server"], optional = true }
ay-llama-sys = { path = "../ay-llama-sys" }
ay-ml = { path = "../ay-ml", default-features = false, features = ["runtime"], optional = true }
ay-model = { path = "../ay-model", default-features = false, features = ["client", "store"], optional = true }
ay-proc = { path = "../ay-proc", features = [], optional = true }
ay-toolcall = { path = "../ay-toolcall", default-features = false, features = ["repair"], optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
chrono = { workspace = true, features = ["serde"], optional = true }
encoding_rs = "0.8.44"
enumflags2 = "0.7.12"
futures = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
llguidance = { version = "1.9.1", optional = true }
minijinja = { version = "3.1.0", features = ["json", "serde"], optional = true }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "full"], optional = true }
toktrie = { version = "1.9.1", optional = true }
tracing.workspace = true
tracing-core = "0.1.36"

[dev-dependencies]
# in-process needs a real libllama; the default test run covers the managed server only.
ay-llama = { path = ".", features = ["server"] }
futures.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "full"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json", "regex", "registry"] }

[[bin]]
name = "aphrody-fake-llama-server"
path = "tests/support/fake_llama_server.rs"
test = false
required-features = ["server"]

[[bin]]
name = "aphrody-llama-daemon"
path = "tests/support/llama_daemon.rs"
test = false
required-features = ["server"]

[[test]]
name = "server_in_process_real"
path = "tests/server_in_process_real.rs"
required-features = ["server"]

[[test]]
name = "server_managed"
path = "tests/server_managed.rs"
required-features = ["server"]

[[test]]
name = "server_real_server"
path = "tests/server_real_server.rs"
required-features = ["server"]

[[test]]
name = "server_supervisor"
path = "tests/server_supervisor.rs"
required-features = ["server"]

# Safe bindings over llama.cpp: documented `unsafe` FFI blocks, so the workspace `unsafe_code = "forbid"` does not apply.
[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
