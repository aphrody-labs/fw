[package]
name = "ay-llama"
version = "1.4.7"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-dev/ai-os"
authors.workspace = true
publish = true
description = "Safe Rust bindings for llama.cpp with runtime dynamic loading."

[features]
default = ["server"]
llguidance = ["dep:llguidance", "dep:toktrie"]
sampler = []
in-process = ["server", "dep:ay-infer", "dep:ay-model", "dep:ay-toolcall", "dep:async-trait", "dep:base64", "dep:bytes", "dep:chrono", "dep:futures", "dep:ay-ml", "dep:libloading", "dep:minijinja", "dep:minijinja-contrib"]
test-support = []
server = ["dep:ay-gemini", "dep:ay-model", "dep:ay-proc", "dep:axum", "dep:reqwest", "dep:rustls", "dep:serde", "dep:serde_json", "dep:tokio"]

[lib]
name = "ay_llama"
path = "src/lib.rs"

[dependencies]
async-trait = { version = "0.1.92", optional = true }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"], optional = true }
ay-gemini = { path = "../ay-gemini", default-features = false, features = ["web"], optional = true }
ay-infer = { path = "../ay-infer", features = ["onnx"], optional = true }
ay-llama-sys = { path = "../ay-llama-sys" }
ay-ml = { path = "../ay-ml", default-features = false, features = ["runtime"], optional = true }
ay-model = { path = "../ay-model", default-features = false, features = ["client", "store"], optional = true }
ay-proc = { path = "../ay-proc", features = [], optional = true }
ay-toolcall = { path = "../ay-toolcall", default-features = false, features = ["repair"], optional = true }
base64 = { version = "0.23.1", optional = true }
bytes = { version = "1.12.2", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
encoding_rs = "0.8.44"
enumflags2 = "0.7.12"
futures = { version = "0.3.34", optional = true }
libloading = { version = "0.9.1", optional = true }
llguidance = { version = "1.9.1", optional = true }
minijinja = { version = "3.1.0", features = ["json"], optional = true }
minijinja-contrib = { version = "3.1.0", features = ["pycompat"], optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "stream", "form", "query", "charset", "http2", "system-proxy", "blocking", "cookies", "gzip", "brotli", "deflate", "socks", "multipart"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.154", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt", "net"], optional = true }
toktrie = { version = "1.9.1", optional = true }
tracing = "0.1.44"
tracing-core = "0.1.36"

[dev-dependencies]
futures = "0.3.34"
pretty_assertions = { version = "1", features = [] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full", "rt"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json", "regex", "registry"] }

[[bin]]
name = "aphrody-fake-llama-server"
path = "tests/support/fake_llama_server.rs"
test = false
required-features = ["server"]

[[bin]]
name = "aphrody-llama-daemon"
path = "tests/support/llama_daemon.rs"
test = false
required-features = ["server"]

[[test]]
name = "server_in_process_real"
path = "tests/server_in_process_real.rs"
required-features = ["server"]

[[test]]
name = "server_managed"
path = "tests/server_managed.rs"
required-features = ["server"]

[[test]]
name = "server_real_server"
path = "tests/server_real_server.rs"
required-features = ["server"]

[[test]]
name = "server_supervisor"
path = "tests/server_supervisor.rs"
required-features = ["server"]

# Safe bindings over llama.cpp: documented `unsafe` FFI blocks, so the workspace `unsafe_code = "forbid"` does not apply.
[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
