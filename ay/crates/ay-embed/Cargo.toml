[package]
edition = "2024"
rust-version = "1.97"
name = "ay-embed"
version = "1.4.7"
authors = ["aphrody-code"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Local, offline text embeddings for aphrody — fastembed (ONNX Runtime) text vectorisation with no external API. Feeds semantic memory/search."
readme = false
license = "Apache-2.0"
repository = "https://github.com/aphrody-dev/ai-os"

[package.metadata.cargo-machete]
ignored = [
    "fastembed",
    "tracing",
    "candle-core",
    "candle-nn",
    "candle-transformers",
]

[features]
candle = [
    "native",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
]
default = []
embeddings = [
    "dep:fastembed",
    "dep:ort",
]
native = [
    "dep:tokenizers",
    "dep:ureq",
    "dep:sha2",
    "dep:serde",
    "dep:serde_json",
    "dep:rayon",
    "dep:gemm",
    "dep:safetensors",
    "dep:memmap2",
    "dep:base64",
]
server = [
    "native",
    "dep:axum",
    "dep:tokio",
    "dep:ay-http",
]

[lib]
name = "ay_embed"
