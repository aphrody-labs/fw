[package]
name = "ay-deps"
description = "gclient's DEPS files in Rust: parse, evaluate conditions and resolve the checkout set for a target OS and CPU."
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[lib]
path = "src/deps.rs"

[[bin]]
name = "ay-deps"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-python.workspace = true
