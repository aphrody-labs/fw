[package]
name = "ay-gemini"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
boq = ["dep:serde_json"]
web = ["dep:serde_json", "dep:regex", "dep:serde", "dep:sha2", "dep:thiserror", "dep:tracing", "dep:url", "dep:ay-http", "dep:tokio", "boq"]
runtime = ["dep:serde_json", "dep:serde", "dep:thiserror", "dep:url", "dep:ay-config", "dep:ay-mcp-client", "dep:ay-proc", "dep:async-trait", "dep:dirs", "dep:futures-util", "dep:ay-http", "dep:tokio", "dep:which"]
default = ["boq", "web", "runtime"]

[dependencies]
ay-http = { path = "../ay-http", default-features = false, features = ["client"], optional = true }
async-trait = { version = "0.1.92", default-features = false, optional = true }
ay-config = { path = "../ay-config", optional = true }
ay-mcp-client = { path = "../ay-mcp-client", optional = true }
ay-proc = { path = "../ay-proc", features = ["tokio"], optional = true }
dirs = { version = "7.0.0", default-features = false, optional = true }
futures-util = { version = "0.3", optional = true }
regex = { version = "1.13.2", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1.0.154", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.11.1", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false, optional = true }
tracing = { version = "0.1.44", default-features = false, optional = true }
url = { version = "2.5.8", default-features = false, optional = true }
which = { version = "8", optional = true }

[dev-dependencies]
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"] }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"], optional = true }

[target."cfg(target_os = \"wasi\")".dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[[example]]
name = "web_smoke"
path = "examples/web_smoke.rs"
required-features = ["web"]

[[test]]
name = "runtime_mcp_smoke"
path = "tests/runtime_mcp_smoke.rs"
required-features = ["runtime"]

# Tests and the runtime adapter use `set_var` (unsafe in edition 2024).
[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
