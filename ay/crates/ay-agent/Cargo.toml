[package]
name = "ay-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["ay-agent"]

[features]
git = ["dep:gix"]
home = ["dep:ay-config", "dep:ay-model", "dep:arc-swap", "dep:blake3", "dep:sha2", "dep:unicode-segmentation", "dep:clap", "dep:memmap2", "dep:notify"]
proto = ["dep:uuid"]
tools = ["jev-client", "patch", "guard", "dep:ay-toolcall", "dep:axum", "dep:anyhow", "dep:ay-gemini", "dep:ay-proc", "dep:aphrody-remote-desktop", "dep:aphrody-term", "dep:aphrody-web-service", "dep:aphrody-winclean", "dep:base64", "dep:obscura-net", "dep:ay-http", "dep:tokio", "dep:sysinfo"]
guard = []
patch = ["dep:similar"]
jev-client = ["jev", "dep:futures", "dep:ay-http", "dep:rustls", "dep:tokio", "dep:url"]
jev-server = ["jev-client", "ay-http/server", "dep:axum", "tokio/rt-multi-thread", "tokio/macros", "tokio/net"]
jev = ["dep:tokio"]
rollout = ["dep:tokio", "dep:uuid"]
subsystem = ["dep:tokio"]
full = ["git", "home", "proto", "tools", "guard", "patch", "jev", "jev-client", "jev-server", "rollout", "subsystem"]
default = []

[dependencies]
arc-swap = { version = "1.9.5", optional = true }
async-trait.workspace = true
axum = { workspace = true, optional = true }
ay-config = { path = "../ay-config", features = [], optional = true }
ay-http = { path = "../ay-http", default-features = false, features = ["client"], optional = true }
ay-model = { path = "../ay-model", default-features = false, features = ["store"], optional = true }
ay-toolcall = { path = "../ay-toolcall", default-features = false, features = [], optional = true }
blake3 = { version = "1.8.7", default-features = false, optional = true }
futures = { workspace = true, optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, optional = true }
similar = { version = "3.2.1", features = ["text"], optional = true }
thiserror.workspace = true
tracing.workspace = true
unicode-segmentation = { version = "1", features = [], optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
ay-agent = { path = ".", features = ["full"] }
axum.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "full"] }

[target."cfg(not(all(target_arch = \"wasm32\", target_os = \"unknown\")))".dependencies]
uuid = { workspace = true, features = ["v4", "v7", "serde"], optional = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
anyhow = { version = "1.0.104", optional = true }
aphrody-remote-desktop = { version = "1.4.7", features = ["vnc-client"], optional = true }
aphrody-term = { version = "1.4.7", features = [], optional = true }
aphrody-web-service = { version = "1.4.8", features = ["render"], optional = true, package = "bun_browser_service" }
aphrody-winclean = { version = "1.4.8", features = [], optional = true, package = "bun-windows-winclean" }
ay-gemini = { path = "../ay-gemini", default-features = false, features = ["web", "google"], optional = true }
ay-proc = { path = "../ay-proc", features = ["tokio"], optional = true }
base64 = { version = "0.23.1", optional = true }
clap = { version = "4.6.8", features = ["derive", "env", "color"], optional = true }
gix = { version = "0.90.0", default-features = false, features = ["sha1", "basic", "extras", "comfort", "max-performance", "revision", "index", "worktree-mutation"], optional = true }
memmap2 = { version = "0.9.12", optional = true }
notify = { version = "8", features = [], optional = true }
obscura-net = { version = "1.4.8", features = [], optional = true, package = "bun_browser_net" }
thiserror = { version = "2.0.21", optional = true }
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "time", "signal", "sync", "fs", "io-util", "full"], optional = true }
tracing = { version = "0.1.44", optional = true }

[target."cfg(unix)".dependencies]
libc.workspace = true

[target."cfg(windows)".dependencies]
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"], optional = true }

[[test]]
name = "jev_native"
path = "tests/jev_native.rs"
required-features = ["jev-client"]

[[test]]
name = "jev_protocol"
path = "tests/jev_protocol.rs"
required-features = ["jev"]

[[test]]
name = "jev_rag"
path = "tests/jev_rag.rs"
required-features = ["jev-client"]

[[test]]
name = "jev_router"
path = "tests/jev_router.rs"
required-features = ["jev-client"]

[[test]]
name = "jev_server"
path = "tests/jev_server.rs"
required-features = ["jev-server"]

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
