[package]
name = "ay-http-error"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "One JSON error envelope ({\"error\":{\"code\",\"message\",\"data\"}}) for HTTP services, as an axum response. Legacy published name: aphrody-http-error."

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[lints]
workspace = true
