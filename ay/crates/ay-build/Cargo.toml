[package]
name = "ay-build"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/ay"
authors = ["aphrody-dev"]
publish = false
# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["ay-build"]

# The DEPS reader and the build model are in fw (crates/fw-depot, `fw depot`); this crate keeps the `ay_build::deps` and `ay_build::siso` paths.
[features]
deps = ["dep:fw-depot", "fw-depot/deps"]
siso = ["dep:fw-depot", "fw-depot/siso"]
full = ["deps", "siso"]
default = []

[dependencies]
fw-depot = { workspace = true, optional = true }
[dev-dependencies]
ay-build = { path = ".", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"