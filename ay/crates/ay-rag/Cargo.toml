[package]
name = "ay-rag"
version = "1.4.7"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/aphrody-dev/ai-os"
authors.workspace = true
description = "Unified RAG storage, embedding, vector scan, hybrid search, and agent tools for aphrody (P8)."

[features]
rag = ["sql", "sqlite", "postgres", "localstore", "codegraph"]
embed-native = ["rag", "ay-model/embed-native"]
embed-ort = ["rag", "ay-model/embed-fastembed"]
postgres = ["dep:deadpool-postgres", "dep:tokio-postgres-rustls", "dep:pgvector", "dep:rustls-native-certs", "dep:webpki-roots"]
sqlite = []
vec = ["sqlite", "dep:sqlite-vec"]
sql = ["dep:sha2"]
localstore = ["dep:sha2", "dep:ay-agent", "sql", "sqlite"]
codegraph = ["dep:ay-proc", "dep:oxc_allocator", "dep:oxc_ast", "dep:oxc_ast_visit", "dep:oxc_parser", "dep:oxc_span", "dep:oxc_syntax", "dep:tree-sitter", "dep:tree-sitter-rust", "localstore"]
fsindex = ["dep:walkdir", "dep:windows"]
memory = ["dep:ay-agent", "dep:aphrody-web-index", "dep:chrono", "dep:uuid", "sql", "sqlite"]
ocr = []
ocr-sqlite = ["ocr", "sqlite", "dep:chrono", "dep:ay-agent"]
full = ["rag", "embed-native", "embed-ort", "postgres", "sqlite", "vec", "sql", "localstore", "codegraph", "fsindex", "memory", "ocr", "ocr-sqlite"]
default = []

[lib]
name = "ay_rag"
path = "src/lib.rs"

[dependencies]
aphrody-web-index = { version = "1.4.8", optional = true, package = "bun_browser_index" }
async-trait.workspace = true
ay-agent = { path = "../ay-agent", default-features = false, features = ["home"], optional = true }
ay-config = { path = "../ay-config", features = [] }
ay-http = { path = "../ay-http", default-features = false, features = ["client"] }
ay-model = { path = "../ay-model", default-features = false, features = ["store"] }
ay-proc = { path = "../ay-proc", optional = true }
ay-rag-core = { path = "../ay-rag-core", features = [] }
ay-toolcall = { path = "../ay-toolcall", default-features = false, features = [] }
blake3.workspace = true
chrono = { workspace = true, features = ["serde"], optional = true }
clap = { workspace = true, features = ["color"] }
deadpool-postgres = { version = "0.14.2", optional = true }
ignore.workspace = true
oxc_allocator = { workspace = true, optional = true }
oxc_ast = { workspace = true, optional = true }
oxc_ast_visit = { workspace = true, optional = true }
oxc_parser = { workspace = true, optional = true }
oxc_span = { workspace = true, optional = true }
oxc_syntax = { workspace = true, optional = true }
pgvector = { version = "0.4", features = ["postgres", "halfvec"], optional = true }
rusqlite = { workspace = true, features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "ring"] }
rustls-native-certs = { version = "0.8.5", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
sqlite-vec = { version = "0.1.9", optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "full"] }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring", "native-certs"], optional = true }
tracing.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "v7", "serde"], optional = true }
walkdir = { workspace = true, optional = true }
webpki-roots = { version = "1.0.12", optional = true }

[dev-dependencies]
# The ONNX and native embedders need model files and runtimes; they stay out of the default test run.
ay-rag = { path = ".", features = ["rag", "sqlite", "postgres", "vec", "sql", "localstore", "codegraph", "fsindex", "memory", "ocr", "ocr-sqlite"] }
axum = { workspace = true, features = ["http2"] }
criterion = { workspace = true, features = ["html_reports"] }
pretty_assertions.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "full"] }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader"], optional = true }

[[test]]
name = "rag_store_tests"
path = "tests/rag_store_tests.rs"
required-features = ["rag"]

[[test]]
name = "trained_onnx_smoke"
path = "tests/trained_onnx_smoke.rs"
required-features = ["embed-ort"]

[[bin]]
name = "ay-store"
path = "src/bin/ai-os-store.rs"
required-features = ["localstore"]

[[bin]]
name = "ai-os-graph"
path = "src/bin/ai-os-graph.rs"
required-features = ["codegraph"]

[[test]]
name = "codegraph_oracle_rust"
path = "tests/codegraph_oracle_rust.rs"
required-features = ["codegraph"]

[[test]]
name = "codegraph_oracle_typescript"
path = "tests/codegraph_oracle_typescript.rs"
required-features = ["codegraph"]

[[bench]]
name = "memory_recall"
path = "benches/memory_recall.rs"
required-features = ["memory"]

[[test]]
name = "memory_memory_smoke"
path = "tests/memory_memory_smoke.rs"
required-features = ["memory"]

[[test]]
name = "memory_v3_smoke"
path = "tests/memory_v3_smoke.rs"
required-features = ["memory"]

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[lints.clippy.correctness]
level = "warn"
priority = -1

[lints.clippy.perf]
level = "warn"
priority = -1

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
