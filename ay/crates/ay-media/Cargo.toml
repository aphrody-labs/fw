[package]
name = "ay-media"
description = "Media primitives: C and NASM luma kernels (luma) and the HLS playlist parser (hls)"
version = "0.4.0"
edition.workspace = true
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aphrody-labs/ay"
authors = ["aphrody-dev"]
publish = false
# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["ay-media"]

[features]
default = []
full = ["luma", "hls"]
luma = []
hls = []

[build-dependencies]
cc.workspace = true

[dev-dependencies]
ay-media = { path = ".", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
