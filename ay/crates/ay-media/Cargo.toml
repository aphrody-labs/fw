[package]
name = "ay-media"
description = "Media primitives: C and NASM luma kernels (luma) and the HLS playlist parser (hls)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
full = ["luma", "hls"]
luma = []
hls = []

[build-dependencies]
cc.workspace = true

[dev-dependencies]
ay-media = { path = ".", features = ["full"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
