# Generated by `bun tools/rust-extract.ts` — crates.io-ready unified workspace member.
[package]
name = "turbo-tasks"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "turbo-tasks extracted from vercel/next.js for the unified Rust + Bun Vercel workspace"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[lib]
bench = false

[features]
default = []
tokio_tracing = ["tokio/tracing"]
hanging_detection = []
task_id_details = []
task_dirty_cause = []
verify_determinism = []
inline_execution_stats = []
non_operation_vc_strongly_consistent = []

[dependencies]
anyhow = { version = "1.0.100" }
async-trait = { version = "0.1.64" }
auto-hash-map = { path = "../turbo-tasks-auto-hash-map", version = "0.1.0" }
bincode = { version = "2.0.1", features = ["serde"] }
concurrent-queue = { version = "2.5.0" }
crossbeam-utils = { version = "0.8" }
dashmap = { version = "7.0.0-rc2" }
either = { version = "1.15.0" }
event-listener = "5.4.0"
fixedbitset = { version = "0.5.7" }
futures = { version = "0.3.31" }
indexmap = { features = ["serde"], version = "2.14.0" }
parking_lot = { features = ["serde"], version = "0.12.1" }
pin-project-lite = { version = "0.2.17" }
rustc-hash = { version = "2.1.1" }
scattered-collect = { version = "0.10.0" }
serde = { features = ["derive", "rc"], version = "1.0.228" }
serde_json = { features = ["preserve_order"], version = "1.0.151" }
shrink-to-fit = { features = ["indexmap", "serde_json", "smallvec", "nightly"], version = "0.2.10" }
smallvec = { features = ["const_generics", "union", "const_new", "serde", "impl_bincode"], version = "1.15.1" }
thiserror = { version = "1.0.48" }
tokio = { features = ["full"], version = "1.52.1" }
tracing = { version = "0.1.44" }
triomphe = { features = ["unsize", "unstable"], git = "https://github.com/sokra/triomphe", branch = "sokra/unstable" }
turbo-bincode = { path = "../turbo-bincode", version = "0.0.0" }
turbo-bitset = { path = "../turbo-bitset", version = "0.1.0" }
turbo-dyn-eq-hash = { path = "../turbo-dyn-eq-hash", version = "0.0.1" }
turbo-frozenmap = { path = "../turbo-frozenmap", version = "0.1.0" }
turbo-rcstr = { path = "../turbo-rcstr", version = "0.1.0" }
turbo-tasks-hash = { path = "../turbo-tasks-hash", version = "0.1.0" }
turbo-tasks-macros = { path = "../turbo-tasks-macros", version = "0.1.0" }
turbo-tasks-malloc = { default-features = false, path = "../turbo-tasks-malloc", version = "0.1.0" }
unsize = { version = "1.1.0" }

[target."cfg(target_family = \"wasm\")".dependencies]
parking_lot = { features = ["nightly"], version = "0.12.1" }

[lints]
workspace = true
