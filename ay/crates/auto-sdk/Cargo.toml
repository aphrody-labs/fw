[package]
name = "aphrody-auto"
version = "2026.11.5"
edition.workspace = true
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Unified Aphrody Auto SDK library + single LTO/AOT executable: modern Rust Better Auth, billing/Factur-X/DOCX/XLSX/PPTX/PDF engines, HLC sync client, MCP router, and real-time L7 load balancer"

# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["aphrody-auto"]

[features]
runtime = ["dep:axum", "dep:fw-http", "dep:tokio", "dep:toml", "native", "auth", "client", "facturx", "docs", "knowledge", "files", "sheets"]
native = ["dep:axum", "dep:getrandom", "dep:rusqlite", "dep:tokio"]
auth = ["dep:argon2", "dep:chacha20poly1305", "dep:ed25519-dalek", "dep:hmac", "dep:p256", "dep:scrypt", "dep:sha1", "dep:subtle"]
client = ["dep:ed25519-dalek", "model"]
docs = ["dep:craft-pdf", "dep:flate2", "dep:skrifa", "i18n", "model", "theme"]
facturx = ["dep:craft-pdf", "dep:flate2", "dep:chrono", "i18n", "model", "docs"]
files = ["dep:craft-pdf", "dep:craft-docx", "dep:craft-pkcs7", "dep:craft-pptx", "dep:craft-wordmodel", "docs"]
i18n = ["dep:craft-i18n"]
knowledge = ["dep:fw-rag-core"]
model = ["i18n"]
sheets = ["dep:craft-csv", "dep:craft-ods", "dep:craft-opc", "dep:craft-sheet", "dep:craft-xls", "dep:craft-xlsx", "dep:craft-xml"]
theme = []
default = []
full = ["runtime", "native", "auth", "client", "docs", "facturx", "files", "i18n", "knowledge", "model", "sheets", "theme"]

[lib]
name = "aphrody_auto"
path = "src/lib.rs"

[dependencies]
argon2 = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305 = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
craft-csv = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-ods = { workspace = true, optional = true }
craft-opc = { workspace = true, optional = true }
craft-pdf = { workspace = true, optional = true }
craft-pkcs7 = { workspace = true, optional = true }
craft-pptx = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-sheet = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-xls = { workspace = true, optional = true }
craft-xlsx = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
craft-xml = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", optional = true }
ed25519-dalek = { version = "3.0.0", optional = true }
flate2 = { workspace = true, optional = true }
fw-http = { workspace = true, features = ["client", "server"], optional = true }
fw-rag-core = { workspace = true, optional = true }
getrandom = { version = "0.4.3", optional = true }
hmac = { version = "0.13", optional = true }
p256 = { workspace = true, optional = true }
rusqlite = { workspace = true, features = ["bundled"], optional = true }
scrypt = { workspace = true, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json.workspace = true
sha1 = { version = "0.11.0", optional = true }
sha2.workspace = true
skrifa = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "parking_lot", "rt", "rt-multi-thread", "signal", "sync", "time"], optional = true }
toml = { version = "1.2.1", optional = true }
[[bin]]
name = "auto"
path = "src/bin/auto.rs"
required-features = ["runtime"]

[[example]]
name = "docs_preview"
path = "examples/docs_preview.rs"
required-features = ["docs"]

[[test]]
name = "docs_render"
path = "tests/docs_render.rs"
required-features = ["docs"]

[[example]]
name = "facturx_samples"
path = "examples/facturx_samples.rs"
required-features = ["facturx"]

[[test]]
name = "facturx_facturx"
path = "tests/facturx_facturx.rs"
required-features = ["facturx"]

[[test]]
name = "files_files_test"
path = "tests/files_files_test.rs"
required-features = ["files"]

[[example]]
name = "sheets_example"
path = "examples/sheets_example.rs"
required-features = ["sheets"]

[[test]]
name = "sheets_spreadsheets"
path = "tests/sheets_spreadsheets.rs"
required-features = ["sheets"]

[dev-dependencies]
aphrody-auto = { workspace = true, features = ["full"], default-features = true }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"