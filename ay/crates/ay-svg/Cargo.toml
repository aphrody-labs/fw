[package]
name = "ay-svg"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "SVG toolkit: parse, sanitize, optimize, normalize viewBox, M3 theming, sprite sheets, glyph outlines to SVG paths, rasterize to PNG/ICO and pixel diff. Legacy published name: aphrody-svg."

[features]
default = ["raster", "glyph"]
# usvg/resvg/tiny-skia: normalize, optimize, rasterize (PNG, ICO, embedded PNG/JPEG/GIF/WebP images) and pixel diff.
raster = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]
# skrifa: font glyph outlines (TTF/OTF, variable axes) to SVG path data.
glyph = ["dep:skrifa"]
# Material Symbols: GSUB ligature lookup by icon name, 960-grid paths, gstatic layout, WOFF2 decoding.
symbols = ["glyph", "dep:woff2"]

[dependencies]
roxmltree = "0.21.2"
svgtypes = "0.16.2"
thiserror.workspace = true
resvg = { version = "0.50.0", default-features = false, features = ["text", "raster-images"], optional = true }
usvg = { version = "0.50.0", optional = true }
tiny-skia = { version = "0.12.0", optional = true }
skrifa = { version = "0.50.0", optional = true }
woff2 = { package = "woff2-patched", version = "0.4.0", optional = true }

[lints]
workspace = true

[[test]]
name = "glyph_font"
required-features = ["glyph", "raster"]
