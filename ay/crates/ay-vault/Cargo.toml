# ay-vault: Rust side of @aphrody/ay-vault. Same on-disk formats as the TS
# package: DPAPI blobs (entropy v1) / systemd-creds credentials, AYV1 envelopes, age X25519.
# Member of the root workspace (explicit entry in the root Cargo.toml), built in CI or on <build-host>.
[package]
name = "ay-vault"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
aes-gcm.workspace = true
age.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["process"] }
zeroize.workspace = true

[dev-dependencies]
tokio.workspace = true

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Security_Cryptography"] }

[lints.rust]
unused_must_use = "deny"
