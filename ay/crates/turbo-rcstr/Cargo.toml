# Generated by `bun tools/rust-extract.ts` — crates.io-ready unified workspace member.
[package]
name = "turbo-rcstr"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "turbo-rcstr extracted from vercel/next.js for the unified Rust + Bun Vercel workspace"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[features]
atom_size_128 = ["turbo-rcstr-macros/atom_size_128"]
napi = ["dep:napi"]

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
triomphe = { git = "https://github.com/sokra/triomphe", branch = "sokra/unstable" }
turbo-tasks-hash = { path = "../turbo-tasks-hash", version = "0.1.0" }
serde = { version = "1.0.228", features = ["derive"] }
new_debug_unreachable = "1.0.6"
shrink-to-fit = { version = "0.2.10" }
rustc-hash = { version = "2.1.1" }
bytes-str = { version = "0.2.7" }
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
turbo-bincode = { path = "../turbo-bincode", version = "0.0.0" }
turbo-rcstr-macros = { path = "../turbo-rcstr-macros", version = "0.1.0" }
unty = { version = "0.0.4" }
napi = { optional = true, version = "3.10.0", default-features = false, features = ["napi3", "serde-json", "tokio_rt", "error_anyhow", "napi4", "napi5"] }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
scattered-collect = { version = "0.10.0" }

[lints]
workspace = true
