[package]
repository.workspace = true
name = "ay-ring3-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "Ring-3 Sovereign Local AI Agent, Boot HTTP + Tri-Backend Inference & Windows GPU-Diet Daemon"

[[bin]]
name = "r3d"
path = "src/main.rs"

[lib]
name = "ring3_agent"
path = "src/lib.rs"

[dependencies]
argh.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zerocopy.workspace = true

[target."cfg(windows)".dependencies]
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
unused_must_use = "deny"
