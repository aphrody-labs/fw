[package]
name = "ay-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# The dev-dependency on the crate itself only switches its features on for the tests.
[package.metadata.cargo-shear]
ignored = ["ay-model"]

[features]
store = ["dep:hex", "dep:sha2", "dep:ay-secrets", "dep:chrono", "dep:dirs", "dep:futures-util", "dep:hf-hub", "dep:nvml-wrapper", "dep:rustls"]
client = ["dep:ay-toolcall", "dep:tokio"]
grpc = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build", "dep:protoc-bin-vendored"]
local-ls = ["grpc", "dep:ay-proc", "dep:regex", "dep:rustls", "dep:hyper-rustls", "dep:x509-parser", "tokio/process", "tokio/rt-multi-thread"]
antigravity = ["dep:sha2", "dep:base64", "dep:data-encoding", "dep:rand", "dep:webbrowser", "dep:getrandom", "dep:tokio", "dep:rusqlite", "dep:windows-sys"]
antigravity_model = ["dep:ay-toolcall", "dep:tokio", "antigravity", "client"]
infer = ["store"]
onnx = ["infer", "dep:ort"]
embed = ["store"]
embed-fastembed = ["embed", "dep:fastembed", "dep:ort"]
embed-native = ["embed", "dep:tokenizers", "ay-http/blocking", "dep:sha2", "dep:rayon", "dep:gemm", "dep:safetensors", "dep:memmap2", "dep:base64"]
embed-candle = ["embed-native", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
embed-server = ["embed-native", "dep:axum", "dep:tokio", "ay-http/server"]
gateway = ["client", "ay-http/server", "dep:axum", "dep:tokio", "dep:ay-config", "dep:dirs", "dep:url", "dep:which"]
full = ["store", "client", "grpc", "local-ls", "antigravity", "antigravity_model", "infer", "onnx", "embed", "embed-fastembed", "embed-native", "embed-candle", "embed-server", "gateway"]
default = []

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["http2"], optional = true }
ay-config = { path = "../ay-config", features = [], optional = true }
ay-http = { path = "../ay-http", default-features = false, features = ["client"] }
ay-proc = { path = "../ay-proc", features = ["tokio"], optional = true }
ay-toolcall = { path = "../ay-toolcall", default-features = false, features = [], optional = true }
base64 = { workspace = true, optional = true }
bytes.workspace = true
candle-core = { version = "0.11", default-features = false, optional = true }
candle-nn = { version = "0.11", default-features = false, optional = true }
candle-transformers = { version = "0.11", default-features = false, optional = true }
data-encoding = { version = "2.11.1", optional = true }
dirs = { workspace = true, optional = true }
futures = { workspace = true, features = ["std", "async-await"] }
gemm = { version = "0.19", default-features = false, features = ["std", "rayon", "x86-v4"], optional = true }
hex = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
rand = { version = "0.10.4", default-features = false, features = ["thread_rng"], optional = true }
rayon = { workspace = true, optional = true }
safetensors = { version = "0.8.0", optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex", "onig"], optional = true }
tracing.workspace = true
url = { workspace = true, optional = true }
webbrowser = { version = "1.2", optional = true }
which = { workspace = true, optional = true }

[dev-dependencies]
# Native runtimes (ONNX Runtime, candle, fastembed) and the gRPC local language server stay out of the default test run.
ay-model = { path = ".", features = ["store", "client", "antigravity", "antigravity_model", "infer", "embed", "gateway"] }
axum = { workspace = true, features = ["http2"] }
pretty_assertions.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde_json.workspace = true
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["process", "full"] }

[build-dependencies]
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true }

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dependencies]
getrandom = { version = "0.4.3", default-features = false, features = ["wasm_js"], optional = true }
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[target."cfg(not(target_arch = \"wasm32\"))".dependencies]
ay-secrets = { path = "../ay-secrets", features = [], optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
dirs = { version = "7.0.0", optional = true }
fastembed = { version = "5.13.4", default-features = false, features = ["ort-load-dynamic", "ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"], optional = true }
futures-util = { version = "0.3", features = [], optional = true }
hf-hub = { version = "1.0.0", optional = true }
nvml-wrapper = { version = "0.13.0", optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "api-24", "ndarray", "tracing", "load-dynamic", "cuda", "directml"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }

[target."cfg(not(target_family = \"wasm\"))".dependencies]
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "aws-lc-rs", "tls12"], optional = true }
prost = { version = "0.14.6", optional = true }
regex = { version = "1.13.2", default-features = false, optional = true }
rusqlite = { version = "0.40", optional = true }
rustls = { version = "0.23.46", default-features = false, optional = true }
tokio = { version = "1.54.1", features = ["full"], optional = true }
tonic = { version = "0.14.9", optional = true }
tonic-prost = { version = "0.14.9", optional = true }
x509-parser = { version = "0.18", optional = true }

[target."cfg(target_os = \"wasi\")".dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros", "rt", "time"], optional = true }

[target."cfg(target_os = \"windows\")".dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Credentials"], optional = true }

[[example]]
name = "embed_embed_smoke"
path = "examples/embed_embed_smoke.rs"
required-features = ["embed"]

[[example]]
name = "embed_gemm_probe"
path = "examples/embed_gemm_probe.rs"
required-features = ["embed-native"]

[[example]]
name = "embed_native_bench"
path = "examples/embed_native_bench.rs"
required-features = ["embed-native"]

[[test]]
name = "embed_embed_smoke"
path = "tests/embed_embed_smoke.rs"
required-features = ["embed"]

[[test]]
name = "embed_native_parity"
path = "tests/embed_native_parity.rs"
required-features = ["embed-candle"]

[[test]]
name = "embed_native_rerank"
path = "tests/embed_native_rerank.rs"
required-features = ["embed-native"]

[[test]]
name = "embed_native_semantics"
path = "tests/embed_native_semantics.rs"
required-features = ["embed-native"]

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
