[package]
name = "vercel-config"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Vercel control-plane configuration, vercel.json Fluid Compute guards, and Pro FinOps estimator"
repository = "https://github.com/aphrody-labs/ay-vercel"
keywords = ["vercel", "fluid-compute", "config", "nextjs", "finops"]
categories = ["config", "web-programming"]

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
toml = "0.9.5"
url = { version = "2.5.4", features = ["serde"] }

[lints]
workspace = true
