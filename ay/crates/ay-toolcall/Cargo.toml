[package]
name = "ay-toolcall"
version.workspace = true
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true
publish = false
description = "Tool catalogue model for the aphrody agent engine: ToolDefinition (name / description / JSON-schema input & output), the async ToolExecutor trait, ToolExposure (Direct / Deferred / DirectModelOnly / Hidden), and a JsonSchema type with prompt-budget compaction passes. Inspired by OpenAI Codex tools (Apache-2.0). Legacy crates.io name: aphrody-toolcall."

[features]
repair = ["dep:regex"]
default = ["repair"]

[dependencies]
async-trait = { version = "0.1.92", default-features = false }
regex = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
proptest = "1.12.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
