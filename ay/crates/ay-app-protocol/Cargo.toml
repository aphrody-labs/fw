[package]
name = "ay-app-protocol"
version = "0.4.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
authors = ["aphrody-dev"]
repository = "https://github.com/aphrody-labs/ay"
readme = "README.md"
publish = false
description = "Pure, wasm32-safe Codex app-server v2 protocol types: JSON-RPC wire types, Tier-1 request/response pairs, server notifications, approvals, and aphrody/* protocol extensions. Legacy crates.io name: aphrody-app-protocol."

[dependencies]
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
