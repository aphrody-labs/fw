# Generated by `bun tools/rust-extract.ts` — crates.io-ready unified workspace member.
[package]
name = "turbo-persistence"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "turbo-persistence extracted from vercel/next.js for the unified Rust + Bun Vercel workspace"
repository = "https://github.com/aphrody-labs/ay-vercel"
autobenches = false
autotests = false

[[bin]]
name = "sst_inspect"
path = "src/bin/sst_inspect.rs"
required-features = ["mmap"]
bench = false

[features]
default = ["mmap"]
mmap = ["dep:memmap2"]
verify_sst_content = []
strict_checks = []
stats = ["quick_cache/stats"]
print_stats = ["stats"]
verbose_log = []

[dependencies]
anyhow = { version = "1.0.100" }
auto-hash-map = { path = "../turbo-tasks-auto-hash-map", version = "0.1.0" }
bitfield = { version = "0.19.4" }
byteorder = { version = "1.5.0" }
crc32fast = { version = "1.5.0" }
dashmap = { version = "7.0.0-rc2" }
either = { version = "1.15.0" }
fs-err = { version = "3.1.1" }
jiff = { version = "0.2.10", features = ["serde"] }
memmap2 = { version = "0.9.5", optional = true }
nohash-hasher = { version = "0.2.0" }
parking_lot = { version = "0.12.1" }
qfilter = { version = "=0.3.0-alpha.4", features = ["serde", "legacy_x86_64_support"] }
postcard = { features = ["alloc", "use-std"], version = "1.0.4" }
zerocopy = { version = "0.8", features = ["derive"] }
quick_cache = { version = "0.6.14" }
rustc-hash = { version = "2.1.1" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151" }
smallvec = { version = "1.15.1", features = ["const_generics", "union", "const_new"] }
thread_local = { version = "1.1.8" }
tracing = { version = "0.1.44" }
turbo-bitset = { path = "../turbo-bitset", version = "0.1.0" }
xxhash-rust = { version = "0.8.12", features = ["xxh3"] }

[target."cfg(not(miri))".dependencies]
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "checked-decode"] }
zstd = { version = "0.13.2" }

[target."cfg(unix)".dependencies]
libc = "0.2"

[lints]
workspace = true
