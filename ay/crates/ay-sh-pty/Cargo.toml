[package]
name = "ay-sh-pty"
description = "A program running in a pseudo-terminal, with its screen: teletypewriter (ConPTY and Unix PTY) and the rio-vt core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Built from the fork: its 0.5 line carries the exit-status fix the released crate lacks. The `pty` feature
# (default) brings teletypewriter and the reader thread; no renderer, no windowing.
rio-vt = { path = "../../third_party/rio/rio-vt" }

[lints]
workspace = true
