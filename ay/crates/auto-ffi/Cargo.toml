[package]
name = "auto-ffi"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
auto-auth = { path = "../auto-auth", default-features = false }
auto-docs = { path = "../auto-docs" }
auto-facturx = { path = "../auto-facturx" }
auto-files = { path = "../auto-files" }
auto-knowledge = { path = "../auto-knowledge" }
auto-model = { path = "../auto-model" }
auto-sheets = { path = "../auto-sheets" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
