[package]
name = "ay-patch"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "LLM-native file-edit patch format (*** Begin Patch / Add|Update|Delete File / @@ context): parser, Unicode-tolerant fuzzy line seeking, streaming parser and application over a pluggable filesystem trait. Legacy published name: aphrody-patch."

[dependencies]
similar = { version = "3.2.1", features = ["text"] }
thiserror.workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"
