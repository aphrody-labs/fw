name: kotlin

# The Kotlin workspace (kotlin/): the Aphrody Compose theme generated from brand/tokens. The gate is tools/compose-check.ts (Gradle test,
# assembleRelease and publishToMavenLocal against androidx material3). Publishing to the GitHub Packages Maven registry of this repository
# happens on a published release or a manual run with publish=true; a version of GitHub Packages is immutable, so bump the workspace
# version of Cargo.toml before publishing a changed theme.
on:
  push:
    branches: [main]
    paths:
      - "kotlin/**"
      - "brand/tokens/**"
      - "tools/compose-check.ts"
      - "tools/tokens-compose.ts"
      - ".github/workflows/kotlin.yml"
  pull_request:
    paths:
      - "kotlin/**"
      - "brand/tokens/**"
      - "tools/compose-check.ts"
      - "tools/tokens-compose.ts"
      - ".github/workflows/kotlin.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the artifacts to GitHub Packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          build-root-directory: kotlin
      - name: Android SDK platform of compileSdk
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.1" > /dev/null
      - run: bun tools/tokens-compose.ts --check
      - run: bun tools/compose-check.ts test assembleRelease publishToMavenLocal
      - name: Publish to GitHub Packages
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        working-directory: kotlin
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./gradlew --no-daemon --console=plain publish
