name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun run check

  rust:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # ay_chromium downloads CEF (333 MB) in its build script, so clippy builds it here; its tests start Chromium and run on the
      # test host (docs/chromium.md).
      - run: cargo test --workspace --locked --exclude ay_chromium

  # SDK corelib conformance: one freestanding C23 code base, run as a native process (clang, and clang-cl on Windows locally),
  # as WebAssembly (Bun, wasmtime component) and as a bare-metal x86_64 image (QEMU), plus the guide's generated listings.
  corelib:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: pins
        run: |
          pins=docs/guides/assembly-and-wasm/listings.toml
          echo "clang=$(sed -n 's/^clang = "\(.*\)"/\1/p' $pins)" >> "$GITHUB_OUTPUT"
          echo "wasm_tools=$(sed -n 's/^wasm_tools = "\(.*\)"/\1/p' $pins)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: llvm
        with:
          path: ~/llvm
          key: llvm-${{ steps.pins.outputs.clang }}-linux-x64
      - name: LLVM (clang, lld, wasm-ld), the pinned official release
        if: steps.llvm.outputs.cache-hit != 'true'
        run: |
          v=${{ steps.pins.outputs.clang }}
          curl -fsSL -o "$RUNNER_TEMP/llvm.tar.zst" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-Linux-X64.tar.zst"
          mkdir -p ~/llvm && zstd -d --long=30 -c "$RUNNER_TEMP/llvm.tar.zst" | tar -xf - -C ~/llvm --strip-components=1
      - run: |
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools@${{ steps.pins.outputs.wasm_tools }}
      - uses: oven-sh/setup-bun@v2
      - run: bun test ./corelib/host
      - run: bun tools/corelib-qemu.ts --log "$RUNNER_TEMP/qemu-boot.log"
      - run: bun tools/corelib-component.ts --log "$RUNNER_TEMP/wasmtime-boot.log"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: diagnose listings
        if: always()
        run: |
          which -a clang clang-23 clang-22 clang-21 || true
          clang --version | head -1; wasm-tools --version
          bun -e 'import { buildWasm } from "./tools/corelib.ts"; console.log(buildWasm("base"))'
          env | grep -iE "clang|cflags|ccc_|llvm|^CI|CPATH|LIBRARY" || true
          ls corelib/src
          git status --short | head
          clang --target=wasm32 -mcpu=mvp -std=c23 -O2 -ffreestanding -fvisibility=hidden -Icorelib/include -Icorelib/src -nostdlib -Wl,--no-entry -Wl,--export-dynamic -v -o /tmp/d.wasm corelib/src/abi.c corelib/src/apps.c corelib/src/cap.c corelib/src/demo.c corelib/src/engine.c corelib/src/ipc.c corelib/src/libc.c corelib/src/mem.c corelib/src/out.c corelib/src/sync.c corelib/src/wasm.c 2>&1 | grep -E "cc1|wasm-ld|clang version|Configuration" | cut -c1-600
          wasm-tools objdump /tmp/d.wasm | tail -4
      - run: bun tools/listings.ts --check
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corelib-wasm-debug
          path: |
            /tmp/d.wasm
            target/corelib/wasm-base/corelib.wasm
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corelib-boot-logs
          path: |
            ${{ runner.temp }}/qemu-boot.log
            ${{ runner.temp }}/wasmtime-boot.log
