# CI packages/ai-os (merged from aphrody-labs/agent): bun tests of the package (Windows and Linux) and NativeAOT publication
# of the ai-os's Windows service (ai-os-service artifact, installed by packages/ai-os/native/ai-os-windows/install.ps1).
name: ai-os
on:
  push:
    branches: [main, dev]
    paths:
      [
        "packages/ai-os/**",
        "crates/ay-agent-context/**",
        ".github/workflows/ai-os.yml",
      ]
  pull_request:
    paths:
      [
        "packages/ai-os/**",
        "crates/ay-agent-context/**",
        ".github/workflows/ai-os.yml",
      ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          submodules: false
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qE '^(packages/ai-os/native/|\.github/workflows/ai-os\.yml)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run: { working-directory: packages/ai-os }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun fmt --check .
      - run: bun check src/cli.ts src/server/cli.ts bench/retrieval.ts test
      - run: bun test ./test

  ai-os-service:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 11.0.x }
      - run: dotnet publish packages/ai-os/native/ai-os-windows/AiOs.Service.csproj -c Release -o out/ai-os-service
      - uses: actions/upload-artifact@v5
        with:
          name: ai-os-service
          retention-days: 14
          path: out/ai-os-service/aphrody-ai-os-svc.exe
          if-no-files-found: error
