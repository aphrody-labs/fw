# CI packages/ai-os (merged from aphrody-labs/agent): bun tests of the package (Windows and Linux) and NativeAOT publication
# of the ai-os's Windows service (ai-os-service artifact, installed by packages/ai-os/native/ai-os-windows/install.ps1).
# Action versions: those of nt.yml (surveyed on 2026-11-12).
name: ai-os
on:
  push:
    branches: [main, dev]
    paths:
      [
        "packages/ai-os/**",
        "crates/ay-agent-context/**",
        ".github/workflows/ai-os.yml",
      ]
  pull_request:
    paths:
      [
        "packages/ai-os/**",
        "crates/ay-agent-context/**",
        ".github/workflows/ai-os.yml",
      ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run: { working-directory: packages/ai-os }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: package.json }
      # Type definitions (@types/bun) and workspace packages come from the root install.
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun fmt --check .
      - run: bun check src/cli.ts src/server/cli.ts bench/retrieval.ts test
      - run: bun test ./test
  ai-os-service:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: 11.0.x }
      - run: dotnet publish packages/ai-os/native/ai-os-windows/AiOs.Service.csproj -c Release -o out/ai-os-service
      - uses: actions/upload-artifact@v5
        with:
          name: ai-os-service
          path: out/ai-os-service/aphrody-ai-os-svc.exe
          if-no-files-found: error
