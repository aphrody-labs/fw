# The only identity and configuration source of the repository. Code, CI and docs read names from here.

[product]
name = "aphrody"
display = "Aphrody"
repo = "ay"
owner = "aphrody-labs"       # GitHub organization that owns this repository
cli = "ay"

[orgs]
labs = "aphrody-labs"        # every live repository (first-party and forks) and its CI
dev = "aphrody-dev"          # personal account: archived pre-2026-11-17 repositories and the crates.io publisher

[legacy]
# The old monorepo, renamed (not archived) on 2026-11-16; tools/legacy.ts inventories it so nothing regresses.
repo = "aphrody-labs/legacy"

[recovery]
# Archived repositories whose sources are crates.io tarballs; tools/recover.ts clones them to find where a lost crate survives.
archives = ["aphrody-labs/bun-os", "aphrody-labs/bun-distribution"]

[domains]
# Owned by the aphrody monorepo (aphrody-labs/aphrody); read-only here. Never change their DNS, zones or routes from
# this repository: per-domain roles are decided once, at the end, by the owner of that repository.
root = "aphrody.com"
app = "aphrody.app"
owner = "aphrody"            # key of [repos]

[products]
# One entry per product; the feature matrix (docs/features.toml) refers to these keys.
os = { owner = "aphrody", title = "Aphrody OS", reference = "https://googlebook.google/", keywords = ["os", "kernel", "linux", "boot", "installer", "device", "hardware", "driver", "wayland", "desktop", "shell", "waydroid", "android", "aosp", "gpu", "vulkan", "audio", "fleet"] }
browser = { owner = "browser", title = "Aphrody Browser", reference = "https://chromium.googlesource.com/", keywords = ["browser", "chromium", "chrome", "cef", "webkit", "servo", "blink", "v8", "playwright", "puppeteer", "cdp", "webview", "tauri"] }
search = { owner = "aphrody", title = "Aphrody Search", reference = "https://www.google.com/?hl=fr", keywords = ["search", "crawl", "index", "rag", "embed", "rank", "google", "gemini", "llm", "llama", "infer", "ai", "agent", "a2a", "mcp", "memory"] }
cloud = { owner = "aphrody", title = "Aphrody Cloud", reference = "https://developers.cloudflare.com/workers/", keywords = ["cloud", "edge", "deploy", "gateway", "worker", "cloudflare", "r2", "dns", "tls", "http", "api", "server", "sql", "db", "vault", "mail", "apify", "ai-os"] }
craft = { owner = "craft-anything", title = "Craft Anything", reference = "https://github.com/storytold/craft-anything", keywords = ["craft", "artcraft", "canvas", "video", "image", "game", "render", "3d", "media"] }
brand = { owner = "ay", title = "Aphrody brand", reference = "https://design.google/", keywords = ["brand", "identity", "design", "m3", "theme", "token", "font", "icon", "assets", "i18n"] }

# The ecosystem (2026-11-17). aphrody-labs/aphrody is the complete OS in pure Rust and the source of truth; this
# repository is its SDK, in any best-fit language: C ABI, OpenAPI, docs, spec, standards,
# corelib, libc and the design system. One checkout per repo locally and one repo per unit on GitHub.
[registries]
npm = "@aphrody"             # npm org scope for published Bun/TS packages
crates_owner = "aphrody-dev"  # crates.io user that owns the published crates (tools/recover.ts, tools/org-inventory.ts)
crates = "aphrody-"          # prefix of the crates the organization already published on crates.io (legacy pipeline); read by tools/bun-native.ts
own_crates = "ay-"           # prefix of this repository's own crates and the npm unit prefix (naming.toml scheme: {id}-{unit})

[repos]
# The live repositories, in stack order: 1 fw, 2 aphrody, 3 ay, 4 nie, 5 shenron, then satellites and runtime forks.
# Every slug is checked live (gh api repos/<slug>: exists, not archived). A local `checkout` hint lives in the git-ignored
# ay.local.toml; without one, tools use the sibling directory ../<key> of the shared workspace root.
# kind: toolchain | os | sdk | game | site | library | browser | nt | runtime | craft | standard.
# Only the os repository defines the system; the rest build on it. A row of the feature matrix names its owner by key.
# Ownership: each upstream fork is checked out by exactly one repository (relative-URL submodule or pinned git dependency).
fw = { slug = "aphrody-labs/fw", kind = "toolchain" }              # toolchain and agent runtime: Rust CLI, MCP/ACP/A2A, inference, the agent plugin
aphrody = { slug = "aphrody-labs/aphrody", kind = "os" }           # OS and desktop: Zed fork, GPUI, compositor, installer; owns the UI/GPU forks
ay = { slug = "aphrody-labs/ay", kind = "sdk" }                    # SDK: C ABI, corelib, OpenAPI, design tokens, cloud/edge (ay-edge), workspace orchestration
nie = { slug = "aphrody-labs/nie", kind = "game" }                 # game engine and recompiler (Inazuma Eleven: Victory Road first)
shenron = { slug = "aphrody-labs/shenron", kind = "site" }         # dragonballfr.com, Bun only; owns data/ and the @aphrody/shenron-* packages
wiki = { slug = "aphrody-labs/wiki", kind = "library" }            # Rust workspace of shenron (koharu, dragon-pixel, shenron-* crates); reads ../shenron/data
browser = { slug = "aphrody-labs/browser", kind = "browser" }      # one browser workspace: Blink headless, Servo/Obscura lite engine, agent-browser
fw-nt = { slug = "aphrody-labs/fw-nt", kind = "nt" }               # NT operating system around fw; owns the Windows/NT forks (forks.toml)
bun = { slug = "aphrody-labs/bun", kind = "runtime" }              # Bun fork (oven-sh/bun)
craft-anything = { slug = "aphrody-labs/craft-anything", kind = "craft" }  # replication engine fork (storytold/craft-anything)
standard = { slug = "aphrody-labs/.github", kind = "standard" }    # org standard, defaults, reusable CI, profile

# Repositories that left the live stack (archived on GitHub, stopped or superseded). Inventories and recovery tools still
# recognise them; nothing builds from them and the workspace orchestrator skips them.
[retired]
anu = { slug = "aphrody-dev/anu", reason = "archived; the Unix layer lives in fw (fw-uutils, fw-nix)" }
ai-os = { slug = "aphrody-dev/ai-os", reason = "archived; the agent kernel lives in fw" }
aydroid = { slug = "aphrody-dev/aydroid", reason = "archived; Android and AOSP rows belong to aphrody" }
open = { slug = "aphrody-labs/open", reason = "archived; replica rows belong to craft-anything" }
aphrody-m3 = { slug = "aphrody-labs/aphrody-m3", reason = "archived; Material 3 packages live in shenron and aphrody" }
claude = { slug = "aphrody-labs/claude", reason = "archived; the agent plugin lives in fw" }
aynt = { slug = "aphrody-labs/aynt", reason = "ReactOS fork superseded by fw-nt (LiberNT)" }
rosegriffon = { slug = "rose-griffon/rosegriffon", reason = "project stopped on 2026-11-19 (rose-griffon organization)" }

# SDK toolchain (ADR-0008): LLVM-first and cross-target, any language that fits the unit.
[sdk]
languages = ["c", "cpp", "objc", "asm", "wat", "rust", "zig", "wgsl", "python", "dotnet", "bun"]
toolchain = ["llvm", "tree-sitter"]
modes = ["ffi", "lto", "aot", "c-abi", "msvc-abi"]
arch = ["x86_64", "aarch64", "riscv64", "wasm32", "wasm64"]
os = ["linux", "windows", "macos", "android", "freestanding", "wasi", "browser"]
gpu = ["webgpu", "vulkan", "d3d12", "metal"]

[matrix]
# Owner of the feature-matrix rows of a product that has no owner of its own (the platform standards rows).
platform_owner = "ay"

[audit.bun-native]
# tools/bun-native.ts: the registry crate (after [registries].crates), directories never scanned (vendored, generated,
# archived or legacy trees), and org originals that are detached upstream mirrors, not first-party code.
registry = "n2b-registry"
exclude = ["node_modules", "third_party", "vendor", "target", "dist", "generated", "coverage", "fixtures", "testdata", "legacy", "archive", "archived", "forks", "Externals", "external", "extern", ".git"]
mirrors = ["depot_tools", "wayland-c", "steam-runtime-tools", "steamos-manager", "zig", "binutils-gdb", "dash", "readline", "make", "gnu-findutils", "gnu-sed", "gawk", "bash", "tao", "scap", "tauri-action"]

# The ordered stack of the ecosystem, keys of [repos]: 1 fw, 2 aphrody, 3 ay, 4 nie, 5 shenron.
[ecosystem]
stack = ["fw", "aphrody", "ay", "nie", "shenron"]

# Host hygiene (tools/host-hygiene.ts): limits enforced by size and idleness on every host. Paths to protect, scan roots and the
# systemd units to keep are host data: they go in ay.local.toml [hygiene] (shape in ay.local.example.toml).
[hygiene]
target_cap_gb = 40            # all cargo target dirs of a host together; oldest evicted first
target_idle_days = 2
node_modules_idle_days = 7    # bun restores them from its hard-linked cache
sccache_cap_gb = 20
docker_keep_hours = 48
journal_max = "500M"
log_max_mb = 50

