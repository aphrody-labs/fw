# The only identity and configuration source of the repository. Code, CI and docs read names from here.

[product]
name = "aphrody"
display = "Aphrody"
repo = "ay"
owner = "aphrody-dev"        # GitHub account that owns this repository
cli = "ay"

[orgs]
dev = "aphrody-dev"          # this repository and its CI
labs = "aphrody-labs"        # forks of upstreams (bun with craft, git stack, ...) and the archive of the old monorepo

[domains]
root = "aphrody.com"
app = "aphrody.app"

# Hosts by role; values are ssh Host aliases resolved by `ssh -G <alias>`.
[hosts]
build = "fr1"                # builds, CI runners, heavy agents
test = "fr2"                 # tests, benchmarks, research
prod = "prd"                 # production only

[products]
# One entry per product; the feature matrix (docs/features.toml) refers to these keys.
os = { title = "Aphrody OS", reference = "https://googlebook.google/" }
browser = { title = "Aphrody Browser", reference = "https://chromium.googlesource.com/" }
search = { title = "Aphrody Search", reference = "https://www.google.com/?hl=fr" }
cloud = { title = "Aphrody Cloud", reference = "https://developers.cloudflare.com/workers/" }
craft = { title = "Craft Anything", reference = "https://github.com/storytold/craft-anything" }
brand = { title = "Aphrody brand", reference = "https://design.google/" }
