# The Aphrody SDK ABI, version 1: the one source of truth. tools/abi.ts generates from it the C header, the Rust
# declarations, the Bun FFI module, the Python ctypes module, a JSON form and the human spec (docs/abi.md), and checks
# with tree-sitter that every generated file and the corelib implementation still say what this file says.
#   types: u32 i32 u64 usize void, pointers as "*const T" or "*mut T"; usize is a pointer-width unsigned integer.
version = 1
name = "ay"
title = "Aphrody SDK: syscall and capability ABI, version 1."
intro = [
  "One ABI for every target. All values are 32-bit words: a single i32 signature on WebAssembly,",
  "one register width on x86_64, AArch64 and RISC-V. Reference implementation: the freestanding",
  "C23 corelib in corelib/src. This header is generated from abi/ay.abi.toml: edit the spec, not the header.",
]

[[group]]
id = "syscall"
comment = "Syscall numbers. Capability handles are per-task indices; a task starts with its boot capabilities."
type = "u32"
  [[group.const]]
  name = "AY_SYS_VERSION"
  value = 0
  nargs = 0
  doc = "() -> abi version"
  [[group.const]]
  name = "AY_SYS_YIELD"
  value = 1
  nargs = 0
  doc = "() -> 0"
  [[group.const]]
  name = "AY_SYS_LOG"
  value = 2
  nargs = 3
  doc = "(console cap, packed bytes, len 1..4) -> len; bytes little-endian"
  [[group.const]]
  name = "AY_SYS_MSG_SET"
  value = 3
  nargs = 2
  doc = "(register 0..3, value) -> 0"
  [[group.const]]
  name = "AY_SYS_MSG_GET"
  value = 4
  nargs = 1
  doc = "(register 0..3) -> value"
  [[group.const]]
  name = "AY_SYS_SEND"
  value = 5
  nargs = 1
  doc = "(endpoint cap) -> 0; sends the four message registers"
  [[group.const]]
  name = "AY_SYS_RECV"
  value = 6
  nargs = 1
  doc = "(endpoint cap) -> 0; fills the four message registers"
  [[group.const]]
  name = "AY_SYS_CAP_DERIVE"
  value = 7
  nargs = 2
  doc = "(cap, rights mask) -> new handle with rights & mask; needs AY_RIGHT_DERIVE"
  [[group.const]]
  name = "AY_SYS_CAP_DROP"
  value = 8
  nargs = 1
  doc = "(cap) -> 0"
  [[group.const]]
  name = "AY_SYS_FRAME_ALLOC"
  value = 9
  nargs = 0
  doc = "() -> frame number"
  [[group.const]]
  name = "AY_SYS_FRAME_FREE"
  value = 10
  nargs = 1
  doc = "(frame) -> 0; only the owner may free"

[[group]]
id = "error"
comment = "Negative results."
type = "i32"
  [[group.const]]
  name = "AY_EPERM"
  value = -1
  doc = "capability lacks the right, or the object is not yours"
  [[group.const]]
  name = "AY_EBADCAP"
  value = -2
  doc = "no such handle, or the wrong kind of object"
  [[group.const]]
  name = "AY_EINVAL"
  value = -3
  doc = "argument out of range"
  [[group.const]]
  name = "AY_EAGAIN"
  value = -4
  doc = "queue full or empty"
  [[group.const]]
  name = "AY_ENOMEM"
  value = -5
  doc = "table or frame pool exhausted"
  [[group.const]]
  name = "AY_ENOSYS"
  value = -6
  doc = "unknown syscall number"

[[group]]
id = "right"
comment = "Capability rights."
type = "u32"
  [[group.const]]
  name = "AY_RIGHT_SEND"
  value = 1
  [[group.const]]
  name = "AY_RIGHT_RECV"
  value = 2
  [[group.const]]
  name = "AY_RIGHT_DERIVE"
  value = 4

[[group]]
id = "misc"
comment = "Sizes and version."
type = "u32"
  [[group.const]]
  name = "AY_ABI_VERSION"
  value = 1
  [[group.const]]
  name = "AY_MSG_WORDS"
  value = 4

# The one entry point. On WebAssembly it is the import ("ay", "syscall"); elsewhere the platform provides it.
# The corelib defines it itself, so its own sources set AY_CORELIB_IMPL and skip the declaration.
[[function]]
name = "ay_syscall"
returns = "i32"
params = [["nr", "u32"], ["a0", "u32"], ["a1", "u32"], ["a2", "u32"]]
import = { module = "ay", name = "syscall" }
doc = "The one entry point."

# Pure functions the corelib exports for hosts and tools (no capability needed).
[[function]]
name = "ay_abi_version"
returns = "u32"
params = []
doc = "The ABI version the library implements."

[[function]]
name = "ay_rights_allow"
returns = "u32"
params = [["have", "u32"], ["need", "u32"]]
doc = "1 when a capability holding `have` may do an operation that needs `need`, else 0."

[[function]]
name = "ay_arg_count"
returns = "u32"
params = [["nr", "u32"]]
doc = "Number of arguments syscall `nr` reads; 0 for an unknown number."

[[function]]
name = "ay_first_free"
returns = "i32"
params = [["bits", "u64"]]
doc = "Index of the lowest clear bit, or -1 when all 64 are set: the first free frame."

[[function]]
name = "ay_checksum"
returns = "u32"
params = [["words", "*const u32"], ["len", "usize"]]
doc = "Rotate-and-add checksum of a message of `len` words."

[[function]]
name = "ay_sum"
returns = "u32"
params = [["words", "*const u32"], ["len", "usize"]]
doc = "Wrapping sum of `len` words."

[[function]]
name = "ay_try_acquire"
returns = "u32"
params = [["flag", "*mut u32"]]
doc = "Take the lock word 0 -> 1: 1 when this caller now holds it, else 0."
