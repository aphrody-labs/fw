[workspace]
members = [".", "bench"]
resolver = "2"

[package]
name = "auto-desktop"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Native GPUI desktop workspace and library for Auto, built on gpui-kit and gpui-fast"

[lib]
name = "auto_desktop"
path = "src/lib.rs"

[[bin]]
name = "auto-desktop"
path = "src/main.rs"

[features]
default = []
bench-support = []

[dependencies]
aphrody-auto = { path = "../../crates/auto-sdk", default-features = false, features = ["auth", "native", "facturx", "i18n", "model", "theme"] }
gpui-kit = { version = "0.10.0", features = ["component", "assets", "gpui-fast"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
gpui-kit = { version = "0.10.0", features = ["component", "assets", "gpui-fast", "test-support"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
