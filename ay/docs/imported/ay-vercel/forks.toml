# Authoritative Vercel & Vercel-Labs fork catalog for aphrody-labs/ay-vercel.
# Every fork lives under org = "aphrody-labs" and uses relative submodule paths (`../<name>.git`).

[meta]
org = "aphrody-labs"
consumer = "aphrody-labs"

[groups]
frameworks = "Next.js, SWR, Microfrontends, Styled-JSX, Turborepo Next.js starters, and React compilers"
sdk = "Vercel CLI, AI SDK, Turborepo, Workflow SDK, Flags SDK, Chat SDK, Eve, Sandbox, Storage, and Edge Runtime"
skill-repos = "Vercel Plugin, Agent Skills, Skills CLI, Next Maintainer Skills, KB Skills, Migration Skills, and Design Skills"
mcp = "Next DevTools MCP, MCP Handler, ACP Handler, add-mcp, MCP-to-AI-SDK, and MCP starters"
docs = "Next.js docs RAG corpus, auxiliary docs, OpenWiki, SWR site, Next Learn, and MDXG specs"
agents = "Browser/Desktop CLI agents, dev3000, Emulate, DeepSec, OpenReview, Tersa, Sandcastle, and Eve agent templates"
ui = "AI Elements, Streamdown, Geist fonts, JSON Render, Vercel UI SDK, Satori/OG, WTerm, and FX0"
runtime = "Micro, Serve, NCC, NFT, Portless, ZeroLang, QuickJS-WASI, Screen-Relay, Go/Terraform/CI actions, and utilities"
python = "Vercel Python runtime integrations, Seal, Tau-Agent, Hatchery, FastAPI starters, and SQL/PG builders"
templates = "Official Vercel & Vercel-Labs reference applications, demos, and marketplace integration examples"

