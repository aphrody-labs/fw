# Authoritative Cloudflare fork catalog for aphrody-labs/ay-cf.
# Every fork lives under org = "aphrody-labs" and is consumed as a sibling submodule in aphrody-labs/ay-cf.

[meta]
org = "aphrody-labs"
consumer = "aphrody-labs"

[groups]
runtime = "Cloudflare Workers C++23 V8/KJ runtime, CapnWeb RPC, and WASI toolchain"
sdk = "Wrangler, cf-cli, TypeScript SDK, React/Vite UI kits, templates, and sandboxes"
agents = "Agents SDK, Cloudflare OS, MCP servers, Skills, Security Audit, and browser automation"
rust = "Rust edge proxies, QUIC/HTTP3, Workers-RS, WireGuard, BoringSSL, Foundations, and SVG sanitization"
python = "Python Workers (Pyodide), official Cloudflare Python SDK, LangChain, and eBPF tooling"
net = "Cloudflared Tunnel, PKI/CFSSL, Privacy Pass, eBPF/XDP, and zero-trust network daemons"

# ---- runtime ----
[[fork]]
path = "runtime/workerd"
upstream = "cloudflare/workerd"
branch = "main"
role = "runtime"

[[fork]]
path = "runtime/workerd-cxx"
upstream = "cloudflare/workerd-cxx"
branch = "master"
role = "runtime"

[[fork]]
