# Declarative upstream + aphrody-labs fork manifest for ay-media.
# Managed by `bun tools/forks.ts` and `bun tools/sync.ts`.

[meta]
org = "aphrody-labs"
consumer = "aphrody-labs"
monorepo = "aphrody-labs/ay-media"

[groups]
vendor = "Upstream media forks (FFmpeg, yt-dlp, hyperframe, hls.js, dav1d, rav1e, SVT-AV1)"

[[fork]]
path = "vendor/ffmpeg"
upstream = "FFmpeg/FFmpeg"
branch = "master"
role = "runtime"

[[fork]]
path = "vendor/yt-dlp"
upstream = "yt-dlp/yt-dlp"
branch = "master"
role = "python"

[[fork]]
path = "vendor/hyperframe"
upstream = "python-hyper/hyperframe"
branch = "master"
role = "python"

[[fork]]
path = "vendor/hls.js"
upstream = "video-dev/hls.js"
branch = "master"
role = "sdk"

[[fork]]
path = "vendor/dav1d"
upstream = "videolan/dav1d"
branch = "master"
role = "runtime"

[[fork]]
path = "vendor/rav1e"
upstream = "xiph/rav1e"
branch = "master"
role = "rust"

[[fork]]
path = "vendor/svt-av1"
upstream = "AOMediaCodec/SVT-AV1"
branch = "main"
role = "runtime"
