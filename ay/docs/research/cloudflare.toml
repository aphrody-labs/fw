# Cloudflare product catalog for Aphrody Cloud scoping. Retrieved 2026-11-16.
version = 1
sources = [
  "https://developers.cloudflare.com/products/ (retrieved 2026-11-16): product directory, names, groups, one-line functions, docs paths",
  "https://developers.cloudflare.com/<product>/llms.txt and /index.md (retrieved 2026-11-16): per-product page indexes, API and binding sections, plan statements",
  "https://developers.cloudflare.com/<product>/platform/pricing/, /platform/limits/, /plans/ and similar pages (retrieved 2026-11-16): free-plan evidence where such a page exists",
  "https://raw.githubusercontent.com/cloudflare/api-schemas/main/openapi.json (retrieved 2026-11-16): Cloudflare REST API schema v4.0.0 with 2352 paths, used for rest_paths counts",
  "https://www.cloudflare.com/sitemap.xml and https://www.cloudflare.com/plans/ (retrieved 2026-11-16): marketing sitemap and plan comparison, consulted for cross-checking only",
]
retrieved = "2026-11-16"
product_count = 138

# Field notes
#   category      primary directory group; groups lists every directory group
#   rest_paths    OpenAPI path count matched by an Aphrody-side mapping of the product to path prefixes; -1 means no mapping, API surface unknown from the schema
#   api_docs      section headings of the product llms.txt that expose an API, binding, SDK, GraphQL or CLI surface, plus the REST reference link when listed
#   free_plan     yes | limited | no | add-on | enterprise-add-on | enterprise-only | beta | n/a | unknown
#   replicate     Aphrody Cloud decision (design decision, not an upstream fact), with replicate_reason

