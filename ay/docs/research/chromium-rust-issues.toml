version = 1
retrieved = "2026-11-16"
subject = "Inherited CI failures and open bugs of the four forks behind ay_chromium (CEF in Rust and Bun), and whether each affects the features screenshot and evaluate"
method = "Workflow runs on each default branch read with gh api repos/<repo>/actions/runs, failing jobs from .../runs/<id>/jobs, first error lines from .../jobs/<id>/logs; open issues from the search API sorted by reactions. affects_us is true only for what changes the behaviour of the crate or its build."
forks = [
  "aphrody-labs/cef (master)",
  "aphrody-labs/cef-rs (dev)",
  "aphrody-labs/rusty_v8 (main)",
  "aphrody-labs/deno (main)",
]
sources = [
  "https://api.github.com/repos/chromiumembedded/cef/actions/runs",
  "https://api.github.com/repos/tauri-apps/cef-rs/actions/runs",
  "https://api.github.com/repos/denoland/rusty_v8/actions/runs",
  "https://api.github.com/repos/denoland/deno/actions/runs",
  "https://api.github.com/search/issues?q=repo:tauri-apps/cef-rs+is:issue+is:open&sort=reactions",
  "https://api.github.com/search/issues?q=repo:chromiumembedded/cef+is:issue+is:open&sort=reactions",
  "https://api.github.com/search/issues?q=repo:denoland/rusty_v8+is:issue+is:open&sort=reactions",
  "https://api.github.com/search/issues?q=repo:denoland/deno+is:issue+is:open+label:bug&sort=reactions",
  "https://crates.io/api/v1/crates/cef/versions",
]

# ---- chromiumembedded/cef ----

[[issue]]
repo = "chromiumembedded/cef"
kind = "ci"
title = "No build or test workflow on master: the only runs are 'pages build and deployment' (60 of 60 green)"
url = "https://github.com/chromiumembedded/cef/actions"
status = "green; CEF builds and tests run on the project's own infrastructure and publish to cef-builds.spotifycdn.com"
affects_us = false
reason = "Nothing fails. The prebuilt binary distribution the crate downloads is the artifact, not this repository's CI."

[[issue]]
repo = "chromiumembedded/cef"
kind = "bug"
title = "Implement off-screen rendering using the Ozone layer"
url = "https://github.com/chromiumembedded/cef/issues/3263"
status = "open since 2022-02, label proposal; 4 reactions"
affects_us = true
reason = "Linux off-screen rendering still goes through the X11 path; a host with no display needs Ozone's headless platform. ay_chromium starts CEF with --ozone-platform=headless and falls back to Xvfb if CEF rejects it (measured, see docs/chromium.md). Recorded, not fixable in the fork: it is Chromium-side work."

[[issue]]
repo = "chromiumembedded/cef"
kind = "bug"
title = "Linux: Add support for embedded Ozone/Wayland windows"
url = "https://github.com/chromiumembedded/cef/issues/2804"
status = "open since 2019-11, 529 reactions, the most-reacted open issue"
affects_us = false
reason = "Windowed embedding (the GPUI shell of ADR-3), not off-screen screenshot or evaluate. Recorded for the browser product."

[[issue]]
repo = "chromiumembedded/cef"
kind = "bug"
title = "Not all file handles are closed after Cef.Shutdown"
url = "https://github.com/chromiumembedded/cef/issues/3726"
status = "open, label bug, windows; 20 comments"
affects_us = false
reason = "Windows only and CEF is shut down once at process exit in ay_chromium."

# ---- tauri-apps/cef-rs ----

[[issue]]
repo = "tauri-apps/cef-rs"
kind = "ci"
title = "update-bindings: download failed, the response body is larger than request limit: 10485760 (the CEF index outgrew ureq's 10 MiB JSON limit)"
url = "https://github.com/tauri-apps/cef-rs/actions/runs/43229473471"
status = "fixed upstream in download-cef 3.0.1 (2026-11-15), which caps the index at 32 MiB and streams archives separately; later runs of Rust validation, Release, Bindings changed and Get latest CEF version are green"
affects_us = true
reason = "ay_chromium downloads the same index through download-cef. The crate pins download-cef 3.0.1, so it is not hit. The index keeps growing: when it nears 32 MiB the same failure returns, in the build of every cef-dll-sys user."

