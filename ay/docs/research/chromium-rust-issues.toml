[[issue]]
repo = "tauri-apps/cef-rs"
kind = "bug"
title = "Empty CefString passed as an out-parameter becomes a null pointer, so the call fails"
url = "https://github.com/tauri-apps/cef-rs/issues/507"
status = "open (2026-11-10), no fix upstream"
affects_us = false
reason = "ay_chromium passes no CefString out-parameter: Runtime.evaluate returns its result through DevToolsMessageObserver bytes, not a string_byref."

[[issue]]
repo = "tauri-apps/cef-rs"
kind = "bug"
title = "CefStringList / CefStringMap / CefStringMultimap: a clone is empty"
url = "https://github.com/tauri-apps/cef-rs/issues/517"
status = "open (2026-11-16), no fix upstream"
affects_us = false
reason = "ay_chromium builds no string collections and never clones one; only wrapper/stream_resource_handler.rs inside cef-rs does."

[[issue]]
repo = "tauri-apps/cef-rs"
kind = "bug"
title = "OSR example potential VRAM leak on AMD GPU"
url = "https://github.com/tauri-apps/cef-rs/issues/417"
status = "open since 2026-06; cef 148, Wayland, Vulkan"
affects_us = false
reason = "Concerns the GPU-accelerated osr example with a resizing window. ay_chromium renders in software (--disable-gpu) at a fixed size and reads the BGRA buffer from OnPaint."

[[issue]]
repo = "tauri-apps/cef-rs"
kind = "bug"
title = "wrap_* macros do not allow member variables that are references; wrap_* macros are not good DX"
url = "https://github.com/tauri-apps/cef-rs/issues/450"
status = "open (#450 since 2026-08, #297 since 2025-12)"
affects_us = true
reason = "Handler state must be owned and Clone: ay_chromium keeps it in Rc<RefCell<..>> on CEF's UI thread. A limit that shaped the design, not a defect."

