[context]
common_protocol = "CDP is spoken or consumed by every project except Playwright's Firefox and WebKit drivers: obscura serves it, lightpanda serves it, agent-browser drives chrome, lightpanda and obscura through it (docs/content/docs/engines/*.mdx), puppeteer, playwright (Chromium), chromiumoxide, headless_chrome and DevTools MCP consume it, CfT and CEF (remote_debugging_port) expose it."
webdriver_bidi = "Served by lightpanda (--protocol webdriver); consumed by puppeteer (Chrome and Firefox, README) and present in playwright (packages/playwright-core/src/server/bidi, biditest script). Not found in obscura, agent-browser (CDP plus a webdriver module for Safari and iOS through Appium), chromiumoxide or headless_chrome."
webmcp = "WebMCP appears in agent-browser (cli/src/native/webmcp.rs, tools agent_browser_webmcp_*, enabled by default for locally managed Chrome), playwright (src/server/webmcp.ts, CLI webmcp-list and webmcp-call), chrome-devtools-mcp (list_webmcp_tools, execute_webmcp_tool) and puppeteer (experimental API, needs Chrome 151+ and --enable-features=WebMCP, docs/guides/webmcp.md). This answers part of the gap recorded in chromium-stack.md (whether anything ships WebMCP): Chrome 151+ behind a flag, per puppeteer's guide. Whether CEF 156 exposes it is still unknown."
mcp_tool_counts = "playwright-mcp 72 (README, 9 groups, 7 opt-in); chrome-devtools-mcp 63 (docs/tool-reference.md, 13 categories); agent-browser 160 (packages/@agent-browser/sandbox/mcp-tools.json); lightpanda 35 browser tools plus 5 MCP-only (src/browser/tools.zig enum, src/mcp/tools.zig); obscura 14 (README table)."
aphrody_browser_repo = "aphrody-labs/browser is an Aphrody-owned monorepo (not a fork). Its README says: Bun, Servo, Obscura and agent-browser crates in one flat Cargo workspace; Blink (headless Chromium, native CDP) renders, a lite engine (Obscura on Servo parsing and style crates) serves agents. ARCHITECTURE.md decision (measured 2026-11-16 on fr1): one CDP front, two engines, router picks lite first and escalates to Blink. It imports upstreams with tools/import.py and tools/flatten.py (copies with history), which conflicts with the no-copy third-party policy proposed in ADR-7. Its src/agent-browser, src/obscura-* crates are copies of the upstreams."
independent_measurement = "aphrody-labs/browser ARCHITECTURE.md, one page (en.wikipedia.org/wiki/Servo_(software)), median of 5, fr1, 2026-11-16: Chrome 160.0.8164.0 headless-shell 0.49 s dump-dom, 578 MiB process-tree peak RSS; Obscura 0.2.7 no-render 0.66 s, 69 MiB; Obscura 0.2.7 render 1.71 s, 116 MiB; Servo 0.8.0-rc1 0.89 s, 556 MiB. It contradicts the vendor claim of Obscura 85 ms page load against Chrome 500 ms on that page; the two measure different things (one real page versus fixtures) and neither was re-run here."

[[project]]
name = "obscura"
