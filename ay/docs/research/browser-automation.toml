engine = "Own engine, no Chromium: V8 through deno_core 0.412, html5ever 0.39 DOM, taffy layout, tiny-skia and cosmic-text paint (render feature, optional), reqwest/rustls network or wreq/BoringSSL with the stealth feature"
protocols = "CDP server (domains Target, Page, Runtime, DOM, Network, Fetch, IO, Storage, Input, plus a custom LP.getMarkdown); MCP over stdio or HTTP. WebDriver BiDi: not found in README or docs list"
cli_commands = "obscura serve (--port --proxy --stealth --workers --worker-max-connections --worker-max-rss --worker-max-age --font-dir --obey-robots), obscura fetch <URL> (--dump html|text|links|markdown|assets|original, --eval, --wait-until, --selector, --screenshot), obscura scrape <URL...> (--concurrency --eval --format), obscura mcp (stdio, or --http --port); second binary obscura-worker; global --proxy --stealth --v8-flags --allow-private-network"
mcp_tools = "14: browser_navigate, browser_snapshot, browser_screenshot, browser_pdf, browser_click, browser_fill, browser_type, browser_press_key, browser_select_option, browser_evaluate, browser_wait_for, browser_network_requests, browser_console_messages, browser_close"
skills_docs = "skills/obscura/SKILL.md (one skill), AGENTS.md, docs/ with 21 pages (CLI-reference, Use-the-MCP-server, Use-with-Puppeteer, Use-with-Playwright, Use-as-a-Rust-library, Intercept-and-modify-requests, Configure-stealth-and-proxies, Run-in-production-at-scale, Watch-agent-sessions-live and others)"
key_features = [
  "snapshot with element references (browser_snapshot), click and fill by ref or CSS selector",
  "viewport and full-page screenshots, raster PDF, activity-driven CDP screencast (render build)",
  "live network interception through CDP Fetch (continue, fulfill, fail, response body streaming) and Rust interception API",
  "cookies through CookieStore and CDP Network and Storage, file persistence",
  "stealth: per-session fingerprint randomisation (GPU, screen, canvas, audio, battery), navigator.webdriver false, isTrusted events, native-function masking, 3,520-domain tracker blocklist (stealth build)",
  "browser contexts (Target.createBrowserContext), parallel worker processes with graceful recycling",
  "SSRF guard (private IP blocking by default, crate obscura-ssrf), robots.txt option",
  "DOM-to-markdown dump",
  "in-process Rust API: obscura::Browser, Page, Element, CookieStore; git dependency, not on crates.io (the crates.io name obscura is an unrelated 2019 crate, v0.0.2)",
  "no recording or tracing, no codegen, no test runner found",
]
dependencies = "Cargo.lock present. Notable: deno_core 0.412, html5ever 0.39, markup5ever 0.39, selectors 0.26, cssparser 0.34, servo_arc 0.4, tokio 1, tokio-tungstenite 0.26, reqwest 0.12 (rustls), clap 4, tiny-skia 0.12, ab_glyph 0.2, resvg 0.47, image 0.25, psl 2, RustCrypto set for crypto.subtle; stealth adds wreq/BoringSSL (needs CMake, Clang, libclang). First build compiles V8 from source (about 5 minutes per README)."
vendored = "vendor/taffy 0.12.1 (MIT), vendor/cosmic-text 0.14.2 (MIT OR Apache-2.0), vendor/wreq-util 3.0.0-rc.12 (Apache-2.0); all three excluded from the workspace and referenced by path. assets/ and render fonts embedded."
performance = "vendor, README: memory 30 MB vs Chrome 200+ MB, binary about 70 MiB vs 300+ MB, page load 85 ms vs about 500 ms (static HTML 51 ms, JS+XHR+fetch 84 ms, dynamic scripts 78 ms vs Chrome about 500, 800, 700 ms). Docker image about 57 MB compressed. Benchmark suite lives in https://github.com/h4ckf0r0day/obscura-benchmark (not read). Measured by Aphrody: see [context].independent_measurement."
take = "The lite engine of the ecosystem and the only stealth implementation: use the obscura crate in-process (feature stealth, render) where the page needs no full Blink, and obscura serve over CDP otherwise. Take its SSRF guard, its MCP snapshot-ref model and its worker-recycling design. Pin a commit (git dependency, builds V8)."
unknown = ["whether obscura-benchmark numbers reproduce on fr1", "WebDriver BiDi support", "WPT pass rate (the README names a WPT suite in obscura-benchmark but gives no number)"]

