[techempower]
latest_round = "R23"
r23_release_published = "2025-03-03"
run_name = "Continuous Benchmarking Run 2025-01-30 18:47:41"
run_window_utc = "2025-01-30T18:47:41Z to 2025-02-06T06:39:09Z"
environment = "Citrine (physical hardware, new hardware first used in R23)"
repo_archived = true
repo_last_push = "2026-03-24"
method = "peak requests/second over the concurrency levels, computed as totalRequests/(endTime-startTime) from raw data; rank among all frameworks that reported the test"
note = "No round newer than R23 found: results/round24/ph.json returns 404 and the GitHub releases list tops at R23. TFB tests frameworks, not stock Apache httpd, stock Caddy, or nginx as an app server (only nginx and nginx-njs entries exist)."
