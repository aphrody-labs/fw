# Rules of tools/recover.ts: the first matching rule gives a unit its state, home and note.
# A unit that matches no rule and is not live stays `lost` with home `review`.
# Match keys: origin (crate|npm|repo|legacy|vps), kind, name, repository, description (regular expressions, case-insensitive).
# home: key of [repos] in ay.toml.
# state `live` here means "exists under another name or as an upstream", the note says where.

# ---- dead: upstream copies, regenerable output, duplicates --------------------------------------------------------
[[rule]]
origin = "crate"
name = "^aphrody-(tauri|taffy|egui-winit|hayro|pdfcraft-forms)"
state = "dead"
note = "renamed copy of an upstream crate (tauri, taffy, egui-winit, hayro, pdfcraft); the fork repository is the home"

[[rule]]
origin = "crate"
name = "^(yolo-zig-ffi|yolo-core|yolo-runtime|aphrody-rust)$"
state = "dead"
note = "yolo-rs is a separate organization; its crates are tracked there"

[[rule]]
origin = "crate"
name = "^bun_browser_layout$"
state = "dead"
note = "renamed Taffy fork"

[[rule]]
origin = "npm"
name = "^@aphrody/bun-windows-"
state = "dead"
note = "generated Win32 bindings (bun winmd); regenerated from Windows metadata, never restored"

[[rule]]
origin = "npm"
repository = "tauri-apps|discordx-ts|material-web|hls.js|/base-ui$|aphrody-code/(bxc-test|next-playwright)"
state = "dead"
note = "renamed upstream package"

[[rule]]
origin = "npm"
name = "^@yohan971/"
state = "dead"
note = "personal-scope republish of discordx"

[[rule]]
origin = "npm"
name = "^@aphrody/(plugin-|api$|bun-plugin-(svelte|yaml|tailwind|supabase|neon)|bun-(types|inspector-protocol|debug-adapter-protocol)$)"
state = "dead"
note = "renamed upstream or generated package of the Bun fork"

[[rule]]
origin = "repo"
name = "/(next\\.js-1|base-ui-1|tailwindcss-1|agent-desktop|longbridge-nsh|dioxus-monorepo|carbon|yolo-hub)$"
state = "dead"
note = "archived duplicate of a fork, an empty repository or a consolidated yolo-rs repository"

[[rule]]
origin = "legacy"
name = "^aphrody-tauri|^aphrody-tao|^taffy$"
state = "dead"
note = "renamed upstream (tauri, tao, taffy); forks are the home"

[[rule]]
origin = "vps"
name = "^fr[12]:/opt/aphrody$"
state = "live"
where = "ai-os:tools/ai/fabric"
note = "inference fabric node (llama.cpp rpc server) deployed from ai-os"

[[rule]]
origin = "vps"
name = ":/srv/kpatch$"
state = "dead"
note = "partial clone of the upstream Linux and Android common kernels, no commits of ours"

# Unpushed work on hosts comes first: it exists nowhere else.
[[rule]]
origin = "vps"
name = "^fr2:/srv/aphrody$"
state = "lost"
home = "anu"
note = "uncommitted rewrite of winux date and factor (legacy checkout); patch copied to the build host salvage directory"

[[rule]]
origin = "vps"
name = "^prd:/srv/src$"
state = "dead"
note = "legacy main checkout with mechanical CLI shebang edits only"

[[rule]]
origin = "vps"
name = ":/srv/xbuild/(ai-os-ci|ai-os-purge|auto-ci|open-ci|ay-clone|nie|ai-os|open|aysh|legacy-rev|salvage)$"
state = "live"
where = "checkout of a tracked repository or a salvage archive"
note = "work-volume checkout: CI workdir or archive of repositories listed in ay.toml"

[[rule]]
origin = "vps"
name = ":/srv/xbuild$"
state = "dead"
note = "work volume root"

[[rule]]
origin = "vps"
name = ":/opt/(android-|containerd|devkitpro|dotnet|dxvk|ffmpeg|google|Heroic|linux-sysroot|vkd3d|vulkan-sdk|winsysroot|wonderful|zig-|steamcmd|umu|bun$)"
state = "dead"
note = "toolchain or prebuilt download; reinstalled by the host setup"

[[rule]]
origin = "vps"
name = ":/srv/(.*cargo-home.*|.*-target|target|tgt-win|zig-|.*\\.(log|lock|err|sh|done)$|.*-logs$|lock-(before|after)|Cargo\\.lock\\.|deploy\\.lock|offload-bench|bench|xbench|xc|gt|gb|gbfull|tsc|uw|mk|p2b.*|corp-out|ch-pipe|aot|build|artifacts|br-test|scratch|tmp|cache|cold|clones|cas|ci|rescue|runners|tc160|wasmtime|shared|mirror|ftp|http|dbfr|aphrody-src)$"
state = "dead"
note = "build output, cache, benchmark or log; regenerable"

[[rule]]
origin = "vps"
name = ":/srv/xbuild/(llvm.*|absorb|backup|agents|work|target|scratch|cache|cold|ci|cloud|rescue|runners|tc160|wasmtime|shared|tmp|tools|clones|cas|linux|i18n.*|ay-(list|linux|corelib|os)|rust-fix.*|shenron-fix.*|script-tests.*|asm-guide)$"
state = "dead"
note = "work volume: scratch, caches, clones of tracked repositories, fix runs already pushed"

[[rule]]
origin = "vps"
kind = "link"
state = "dead"
note = "symbolic link"

[[rule]]
origin = "vps"
name = ":/srv/(chromium|craft|depot_tools|ghidra-scripts|kpatch|research|repos|open-src|upabs|shenron.*|rosegriffon|steam|wii-os|www|cdn-shenron|native-ui|koharu-preview|py2bun.*|pipe-src)$"
state = "live"
where = "tracked repositories or deployments"
note = "checkout, deployment or upstream tree whose content is pushed (git tree with a remote) or redeployable; see the dirty-tree rows for unpushed work"

