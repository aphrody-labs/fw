platforms = "Ozone platforms in tree: cast, drm, flatland, headless, wayland, x11 (ui/ozone/platform); Wayland is selected at runtime with --ozone-platform"
build_requirements = "full Chromium build; UI-only build time unknown"
rust_story = "C++ only. Views is a C++ toolkit with layout managers and a metadata system; Rust could provide services reached over Mojo or cxx, not View subclasses (docs/rust/README.md names Mojo as the way to avoid direct interop)"
serves_aphrody = "Where our UI, agent panel and default search would live in option (a); in (b) and (c) none of it is used"
sources = ["https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/ui/index.md?format=TEXT", "https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/ui/views/overview.md?format=TEXT", "https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/ozone_overview.md?format=TEXT", "https://chromium.googlesource.com/chromium/src/+/refs/heads/main/ui/ozone/platform?format=JSON", "https://chromium.googlesource.com/chromium/src/+/refs/heads/main/chrome/browser/ui/views?format=JSON"]

[[component]]
id = "content-shell"
name = "content_shell"
what = "Minimal shell over the content layer (content/shell) used to run web tests; not a product browser"
version = "part of Chromium main 160.0.8167.0"
version_date = "2026-11-16"
licence = "Chromium licence"
repository = "inside chromium/src (content/shell: app, browser, common, gpu, renderer, utility, android, fuchsia)"
fetch = "gclient Chromium checkout; target blink_tests builds it with the other web-test binaries"
platforms = "directories exist for android and fuchsia; desktop platforms assumed, not read"
build_requirements = "full Chromium checkout and toolchain (same 100 GB floor); incremental build time and content_shell binary size unknown"
rust_story = "C++; Rust only via the Chromium build templates"
serves_aphrody = "Engine-only baseline for web-platform-tests and size measurement; no tabs, omnibox, profiles or extensions"
sources = ["https://chromium.googlesource.com/chromium/src/+/refs/heads/main/content/shell?format=JSON", "https://chromium.googlesource.com/chromium/src/+/refs/heads/main/docs/testing/web_tests_in_content_shell.md?format=TEXT"]

[[option]]
id = "a-fork-views"
name = "Chromium fork with our UI in Views"
effort = "highest: C++ UI in Views and chrome/browser/ui, own branding and update channel, full Chromium build and CI; no Rust UI"
control = "total: omnibox, tabs, default search, agent panel, WebMCP wiring, flags"
update_cost = "highest: a milestone every 14 to 21 days in the 156 to 159 schedule, each rebase touches chrome/browser/ui; security fixes must be tracked by us"
binary_size = "unknown until built; CfT chrome-linux64.zip is 203266906 bytes as an upper-bound hint (it has the full Chrome UI)"
rust_fit = "weak: Rust only as libraries, Mojo services or cxx; the GPUI shell from aphrody-dev/aphrody is unused"
blocker = "<build-host> has 47 GB available (df 2026-11-16); at least 100 GB required"

[[option]]
id = "b-cef-cef-rs"
name = "CEF with cef-rs and our native GPUI UI"
effort = "medium: no Chromium build; write the shell (tabs, omnibox, agent panel) in Rust and embed CEF; the GPUI-to-CEF embedding path is unproven (ui-frameworks.toml lists GPUI as pre-1.0)"
control = "CEF API surface: network, cookies, requests, DevTools port, off-screen frames; Chromium-internal UI features (extensions UI, internal pages, any WebMCP support) are only available if CEF exposes them, unknown"
update_cost = "low: bump the cef crate and the CEF distribution; CEF stable trails Chrome stable by about one milestone (156 vs 157 on 2026-11-16)"
binary_size = "CEF linux64 minimal archive 333332290 bytes, standard 697434558 bytes (archives; installed size unknown); windows64 minimal 175176258"
rust_fit = "strong: cef-rs 156.6.0 on crates.io, Apache-2.0 OR MIT, osr example on winit plus wgpu"
blocker = "none for prebuilt; <build-host> disk only matters for source builds of CEF"

[[option]]
id = "c-content-shell"
name = "content_shell based"
effort = "high for little product value: full Chromium build, and we would write tabs, profiles, history, sync and extensions ourselves on the content API"
control = "high at the content layer, none of the browser features"
update_cost = "high: content API churn with every milestone; no stability guarantee found in the docs read"
binary_size = "unknown until built"
rust_fit = "weak (same as option a)"
blocker = "same 100 GB disk requirement as option a"

[recommendation]
choice = "b-cef-cef-rs"
reason = "Same engine as Chrome, no Chromium build, lowest update cost, and the only option with a maintained Rust crate; the 100 GB build volume is not needed to start"
fallback = "Move to a fork (a) only if the measurements below show CEF cannot expose a required feature or misses the latency or memory target"
measurements_needed = [
  "Prototype: cef-rs osr or native-window embedding inside GPUI on Linux (Wayland and X11) and Windows; record input latency, frame time and memory per tab",
  "Installed size of CEF minimal and standard on disk, and total shipped size with the shell, against CfT chrome-linux64 (203266906 byte zip)",
  "Feature probe on CEF 156 and 158: DevTools protocol attach by chrome-devtools-mcp and Puppeteer, extensions, WebGPU, and any WebMCP support (unknown today)",
  "web-platform-tests pass rate on CfT 157 as the upper bound, then on the CEF build via wptrunner and CDP",
  "CEF update lag in days between Chrome stable and the matching CEF stable build, measured over several milestones",
  "For option (a) only: create a build volume of at least 100 GB on <build-host> and record fetch time, autoninja release time with ThinLTO, peak RAM, final disk use and chrome binary size; measure content_shell alongside for option (c)",
]
