# Generated by tools/bun-native.ts rules; rerun it, do not edit. Rules and their proofs only: no repository, host or account data.

[meta]
command = "bun tools/bun-native.ts rules"
bun_version = "1.4.5"
bun_revision = "6db95208"
registry_crate = "aphrody-n2b-registry"
registry_version = "0.7.1"
builtins = ["assert", "async_hooks", "buffer", "child_process", "cluster", "console", "crypto", "dgram", "diagnostics_channel", "dns", "domain", "events", "fs", "http", "http2", "https", "inspector", "module", "net", "os", "path", "perf_hooks", "process", "punycode", "querystring", "readline", "repl", "stream", "string_decoder", "sys", "test", "timers", "tls", "trace_events", "tty", "url", "util", "v8", "vm", "wasi", "worker_threads", "zlib", "assert/strict", "dns/promises", "fs/promises", "inspector/promises", "path/posix", "path/win32", "readline/promises", "stream/consumers", "stream/promises", "stream/web", "timers/promises", "sqlite", "quic", "sea"]
rules = 258
proven = 248
unproven = 10
skill_rules = 40
scan = "imports by Bun.Transpiler.scan; call sites matched on lexer-masked source gated by the import graph; configs parsed (JSONC, YAML, Dockerfile, shell lines)"
severity_meaning = "safe-rewrite = swap with identical behaviour per the registry; behaviour-change = Bun owner exists, edge cases differ; no-equivalent = no proven Bun owner"

[meta.dropped]
info = 14
generic = 0
badRegex = 0
rustAlt = 21

