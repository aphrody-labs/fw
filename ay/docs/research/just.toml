[recommendation]
decision = "Adopt just as the single task entry for ay-next, with the recipes calling tools/*.ts and cargo; keep all logic in Bun typed scripts."
alternatives_rejected = [
  "Bun scripts only: package.json scripts cannot list or document tasks across Bun, cargo, Nix and depot_tools, have no dependencies between tasks, and the four sibling repos already converged on a justfile front end.",
  "mise tasks: duplicates the Nix flake and depot_tools as the tool pin source; adopt only if tool version pinning is wanted later.",
  "go-task, cargo-make, nx, moon: add a second language runtime or a heavier model without a gap just leaves open; cargo-make has no release since 2025-01-18.",
  "cargo xtask: compiles Rust to run a task, which the policy keeps off the PC.",
]
reasons = [
  "Evidence of fit: five Aphrody repos already use just (ay 157 recipes, shenron 62, nie 41, rosegriffon 41, ay/apps/nt 21), all list and dump cleanly with just 1.59.0 and 0 warnings.",
  "Shenron's rule matches the policy: recipes call existing scripts and never duplicate their logic.",
  "Language fit: one flat command surface over Bun, cargo, Nix and depot_tools; --list groups, --usage and --dump --dump-format json (or --json) give agents a machine-readable task catalogue without reading shell code.",
  "Cost: a single static binary (10 prebuilt targets, CC0-1.0), 20 releases in the last 12 months, installed locally at 1.59.0; no runtime or compile step.",
  "Release stability: the breaking change in 1.59.0 is UTF-8-only paths; 1.58.0 changed --fmt output; the unstable set is only [cache], lists and user-defined functions, which should not be used.",
]
adoption_rules = [
  "Put set minimum-version := \"1.59.0\" (supported since 1.55.0) and set shell := [\"bun\", \"exec\"] or sh -cu with windows-shell niu -cu, one choice per repo, documented in the justfile header.",
  "Keep recipes to one line: bun tools/<name>.ts {{args}} or cargo <cmd>; no logic in the justfile; tools/*.ts keep their own tests (bun test ./tools/).",
  "Use [group], doc comments and the import pattern of ay (root justfile = settings and imports only) once there are more than about 20 recipes; mod gives namespaced recipes (just foo bar) if collisions appear.",
  "Never read the repo root from a user environment variable without a fallback: use justfile_directory(); delete or fix the stale SRC_ROOT on this PC.",
  "Add just --fmt --check to the check recipe and re-format once (1.58.0 spacing), so the 95-line diff seen in ay, nie, rosegriffon and shenron does not recur.",
  "Install through the existing channels (winget Casey.Just on Windows, nixpkgs just in the flake, taiki-e/install-action@just in CI); no fork needed.",
  "Optional: just-lsp 0.11.2 for editors and the in-repo skill (npx skills add casey/just --global) for agents instead of just-mcp, which is 67 percent complete and unreleased since 2025-11-15.",
]
fork_decision = "Do not fork casey/just or tree-sitter-just: nothing needs patching, the upstream release binaries cover every Aphrody host, and the tree-sitter grammar is consumed through editors. If a patch becomes necessary, fork with the gh-fork skill into aphrody-labs and register it in third_party/forks.txt."
