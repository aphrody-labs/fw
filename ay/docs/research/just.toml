# ------------------------------------------------------------- Aphrody check

[aphrody]
local_just = "1.59.0 as a winget Casey.Just link under the user WinGet Links directory: installed and equal to the latest release"
fork = "none: aphrody-labs/just, aphrody-labs/tree-sitter-just and aphrody-dev/just all return HTTP 404; the only match for 'just' in aphrody-labs is just-bash, a fork of vercel-labs/just-bash (unrelated shell sandbox, nie uses it for sandbox-sh)"
shell_on_windows = "niubash (niu.exe) and winuxcmd sh.exe are installed; the legacy ay justfile sets windows-shell to niu -cu"
stale_env = "The user environment variable SRC_ROOT points to a directory that no longer exists (the checkout is $WORKSPACE_ROOT/ay). The legacy justfile reads root := env(\"SRC_ROOT\", justfile_directory()), so recipes that use {{root}} fail until SRC_ROOT is removed; verified: just agents status fails with Module not found <stale SRC_ROOT>/tools/agents/runner.ts, and env -u SRC_ROOT just doctor runs."

