# ---------------------------------------------------------------- casey/just

[just]
repo = "https://github.com/casey/just"
homepage = "https://just.systems"
manual = "https://just.systems/man/en/"
description = "Just a command runner (README: runs on any system with a reasonable sh; Windows needs sh from Git for Windows, Cygwin or similar, or set shell := [...] to PowerShell or cmd.exe)"
default_branch = "master"
created = "2016-06-17"
last_push = "2026-11-15"
stars = 36720
forks = 943
open_issues = 172
open_pull_requests = 0
contributors = 213
licence = "CC0-1.0 (public domain dedication)"
language = "Rust, edition 2024"
msrv = "1.89.0 (Cargo.toml rust-version); README says the policy is current stable Rust"
latest_release = "1.59.0"
latest_release_date = "2026-10-15"
releases_last_12_months = 20
cadence = "README: new releases are made frequently; 1.44.0 (2025-12-07) to 1.59.0 (2026-10-15) is 20 releases in under 11 months"
crate_all_time_downloads = 2972593
crate_recent_downloads_90d = 566525
crate_downloads_1_59_0 = 112018
sources = [
  "https://api.github.com/repos/casey/just",
  "https://api.github.com/search/issues?q=repo:casey/just+is:pr+is:open",
  "https://crates.io/api/v1/crates/just",
  "https://api.github.com/repos/casey/just/contributors?per_page=1",
]
note = "crates.io counts only cargo installs; most users take prebuilt binaries or distro packages, so the figure understates real usage. PyPI rust-just shows 2568594 downloads in the last month (pypistats) and npm rust-just 290364 (npm downloads API, 2026-10-17 to 2026-11-15)."

[just.build]
workspace_members = ["just", "crates/action-versions", "crates/generate-book"]
lockfile_packages = 155
features = "none: the [features] table is absent and crates.io reports features = {}"
profile_release = "lto = true, codegen-units = 1"
runtime_deps_direct = 32
unix_only_deps = ["nix 0.31.0 (signal, user, fs)"]
windows_only_deps = ["ctrlc 3.1.1 (termination)"]
dev_deps = ["pretty_assertions 1.0.0", "which 8.0.0"]
source = "https://raw.githubusercontent.com/casey/just/1.59.0/Cargo.toml"

# Direct dependencies at tag 1.59.0 (version requirement as written in Cargo.toml).
[[just.dependency]]
name = "blake3"
req = "1.5.0"
features = ["mmap", "rayon", "serde"]
use = "recipe cache keys, blake3() and blake3_file()"

[[just.dependency]]
name = "camino"
req = "1.0.4"
features = ["serde1"]
use = "UTF-8 paths (1.59.0 now requires Unicode paths)"

[[just.dependency]]
name = "chrono"
req = "0.4.38"
use = "datetime(), datetime_utc(), timestamps"

[[just.dependency]]
name = "clap"
req = "4.0.0"
features = ["derive", "env", "string", "wrap_help"]
use = "command line"

[[just.dependency]]
name = "clap_complete"
req = "=4.6.11"
features = ["unstable-dynamic"]
use = "dynamic shell completions (since 1.48.0)"

[[just.dependency]]
name = "clap_mangen"
req = "0.3.0"
use = "--man"

[[just.dependency]]
name = "digest-io"
req = "0.1.0"
use = "hashing files"

[[just.dependency]]
name = "dirs"
req = "7.0.0"
use = "config_directory(), data_directory(), home_directory(), cache_directory()"

[[just.dependency]]
name = "dotenvy"
req = "0.15.0"
use = ".env loading"

[[just.dependency]]
name = "heck"
req = "0.5.0"
use = "case-conversion functions"

[[just.dependency]]
name = "hex"
req = "0.4.3"

[[just.dependency]]
name = "is_executable"
req = "1.0.4"
use = "which(), require()"

[[just.dependency]]
name = "libc"
req = "0.2.0"

[[just.dependency]]
name = "nu-ansi-term"
req = "0.50.3"
use = "colour output, style()"

[[just.dependency]]
name = "num_cpus"
req = "1.15.0"
use = "num_cpus()"

[[just.dependency]]
name = "percent-encoding"
req = "2.3.1"
use = "encode_uri_component()"

[[just.dependency]]
name = "pulldown-cmark"
req = "0.13.4"
features = []
use = "markdown justfiles (1.53.0)"

[[just.dependency]]
name = "rand"
req = "0.10.0"
use = "choose(), uuid()"

[[just.dependency]]
name = "regex"
req = "1.10.4"
use = "replace_regex(), [arg(pattern)]"

[[just.dependency]]
name = "semver"
req = "1.0.20"
use = "semver_matches(), set minimum-version"

[[just.dependency]]
name = "serde"
req = "1.0.130"
features = ["derive", "rc"]

[[just.dependency]]
name = "serde_json"
req = "1.0.68"
use = "--dump --dump-format json"

[[just.dependency]]
name = "sha2"
req = "0.11.0"
use = "sha256(), sha256_file()"

[[just.dependency]]
name = "shellexpand"
req = "3.1.0"
use = "shell-expanded strings x'...'"

[[just.dependency]]
name = "similar"
req = "3.0.0"
features = ["unicode"]
use = "--fmt --check diff"

[[just.dependency]]
name = "snafu"
req = "0.9.0"
use = "error types"

[[just.dependency]]
name = "strsim"
req = "0.11.1"
use = "did-you-mean suggestions"

[[just.dependency]]
name = "strum"
req = "0.28.0"
features = ["derive"]

[[just.dependency]]
name = "tempfile"
req = "3.0.0"
use = "script and shebang recipe temporary files"

[[just.dependency]]
name = "typed-arena"
req = "2.0.1"

[[just.dependency]]
name = "unicode-width"
req = "0.2.0"
use = "--list column alignment"

[[just.dependency]]
name = "uuid"
req = "1.0.0"
features = ["v4"]
use = "uuid()"

# ----------------------------------------------------------- install channels

[just.install]
prebuilt_targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-musl",
  "arm-unknown-linux-musleabihf",
  "armv7-unknown-linux-musleabihf",
  "loongarch64-unknown-linux-musl",
  "riscv64gc-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
]
release_assets_note = "Each release carries 10 archives (tar.gz, zip on Windows), SHA256SUMS and CHANGELOG.md; source: gh api repos/casey/just/releases/latest"
install_script = "curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to DEST (pass --tag on shared CI IPs to avoid GitHub API rate limits; 1.59.0 fixed minified-JSON handling and 1.56.0 empty GITHUB_TOKEN)"
container = "ghcr.io/casey/just (COPY --from=ghcr.io/casey/just:latest /just /usr/local/bin/); docker images are built since 1.48.0"
nix = "flake.nix in the repo (added 1.49.0) and nixpkgs pkgs/by-name/ju/just"
cargo = "cargo install just; cargo binstall just"
windows = "winget install --id Casey.Just --exact; scoop install just; choco install just"
macos = "brew install just; port install just"
linux = "apk add just; pacman -S just; apt install just (Debian trixie); dnf install just; zypper in just; xbps-install -S just; emerge dev-build/just; eopkg install just; snap install --edge --classic just; nix-env -iA nixos.just"
bsd = "pkg install just (FreeBSD); pkg_add just (OpenBSD)"
version_managers = "asdf (olofvndrhr/asdf-just), arkade, conda-forge, spack, mise (documented as a related tool)"
source = "https://raw.githubusercontent.com/casey/just/1.59.0/README.md"

[[just.install_wrapper]]
channel = "npm"
package = "rust-just"
version = "1.59.0"
licence = "CC0-1.0"
maintainer_repo = "https://github.com/gnpaone/rust-just"
note = "Third-party repackaging of the Rust binary, not published by casey; README lists `npm install -g rust-just`. 290364 downloads in the 30 days to 2026-11-15; depends on execa and yargs."
source = "https://registry.npmjs.org/rust-just/latest"

[[just.install_wrapper]]
channel = "npm"
package = "just-install"
version = "2.0.2"
licence = "MIT"
maintainer_repo = "https://github.com/brombal/just-install"
note = "postinstall downloads the platform binary (node-fetch, extract-zip). Last published 2024-07-31, so it can lag the current just; 9349 downloads in the 30 days to 2026-11-15."
source = "https://registry.npmjs.org/just-install/latest"

[[just.install_wrapper]]
channel = "PyPI"
package = "rust-just"
version = "1.59.0"
maintainer_repo = "https://github.com/gnpaone/rust-just"
note = "Platform wheels (manylinux x86_64/aarch64/armv7/i686/ppc64le/s390x, macOS, Windows) of the Rust binary; README lists pipx install rust-just and uv tool install rust-just. 2568594 downloads in the last month (pypistats), published 2026-10-16."
source = "https://pypi.org/pypi/rust-just/json"

# --------------------------------------------------------- language features

[language]
file_names = "justfile, Justfile, any case, and .justfile; --justfile-name (1.49.0, comma-separated list 1.58.0) overrides; search runs upward from the current directory"
default_recipe = "first recipe, or [default] (1.43.0), or set default-list / --default-list (1.52.0)"
recipes = "name, parameters (positional, default values, variadic * and +, exported with $), prefixes @ (quiet), - (ignore error), ? guard sigil (1.47.0, set guards)"
dependencies = "prior and subsequent dependencies (a: b && c), dependencies with arguments, dependencies on module recipes (foo::bar); [parallel] (1.42.0) runs dependencies in parallel, capped by --jobs (1.56.0)"
options_on_recipes = "recipes take --long, -s short options and flags via [arg(name, long=, short=, value=, pattern=, help=, multiple, min=, max=)] (1.46.0 to 1.56.0); --usage prints generated usage"
shell_recipes = "each line is run by the shell (set shell := [...]); lines are not a single script unless shebang or [script]"
shebang_recipes = "recipe body beginning #!interpreter is written to a temporary file and executed"
script_recipes = "[script] and [script(COMMAND)] (stabilized 1.44.0, set default-script 1.52.0, [shell] overrides)"
variables = "assignments with :=, strings ('..', \"..\", triple-quoted, f'{format}' strings 1.44.0, shell-expanded x'...'), backtick commands, + concatenation, / path join, conditional if/else (else if documented 1.57.0), lazy evaluation (stabilized 1.48.0), eager keyword (1.47.1), export, unexport"
user_defined_functions = "1.49.0, unstable"
lists = "set lists (1.53.0), unstable"
modules = "mod foo (1.19.0, stabilized 1.31.0), mod? optional, module aliases (1.55.0), [group] and [doc] on modules, recipes run as just foo::bar or just foo bar, --list-submodules"
imports = "import 'path' and import? 'path': all recipes land in one global namespace (the ay legacy justfile uses this); same file imported twice is not an error (1.37.0)"
settings = "allow-duplicate-recipes, allow-duplicate-variables, default-list, default-script, dotenv-command (1.54.0), dotenv-filename, dotenv-load, dotenv-override, dotenv-path, dotenv-required, export, fallback, guards, ignore-comments, indentation (1.56.0), lazy, lists (unstable), minimum-version (1.55.0), no-cd (1.51.0), no-exit-message, positional-arguments, quiet, script-interpreter, shell, tempdir, unstable, windows-powershell and windows-shell (deprecated, use [windows] on set shell), working-directory (1.33.0)"
dotenv = "set dotenv-load, dotenv-filename, dotenv-path, dotenv-required, dotenv-override, dotenv-command; --dotenv-filename -F, --dotenv-path -E, --no-dotenv"
unstable_features_in_1_59_0 = ["[cache] cached recipes (1.54.0)", "set lists (1.53.0)", "user-defined functions (1.49.0)"]
unstable_switch = "--unstable, set unstable, or JUST_UNSTABLE=1; source: src/unstable_feature.rs at 1.59.0 lists exactly CachedRecipes, ListsSetting, UserDefinedFunctions"
stable_after_unstable = "fmt stabilized 1.50.0; lazy evaluation 1.48.0; [script] 1.44.0; modules 1.31.0"
function_count_note = "README documents roughly 90 built-in functions and constants; grouped below, not individually counted"

[language.attributes]
# From the README attribute table at 1.59.0 (version in which each appeared).
recipe_behaviour = [
  "[arg(...)] 1.46.0", "[cache] 1.54.0 (unstable)", "[confirm] 1.17.0", "[confirm(PROMPT)] 1.23.0 (expression 1.49.0)",
  "[continue(SIGNALS)] 1.54.0", "[default] 1.43.0", "[doc(DOC)] 1.27.0", "[env(NAME, VALUE)] 1.47.0",
  "[extension(EXT)] 1.32.0", "[exit-message] 1.39.0", "[group(NAME)] 1.27.0", "[metadata(...)] 1.42.0",
  "[no-cd] 1.9.0", "[no-exit-message] 1.7.0", "[no-quiet] 1.23.0", "[parallel] 1.42.0",
  "[positional-arguments] 1.29.0", "[private] 1.10.0", "[script] 1.33.0", "[script(COMMAND)] 1.32.0",
  "[shell] 1.52.0", "[timestamp] and [timestamp(FORMAT)] 1.58.0", "[working-directory(PATH)] 1.38.0",
]
platform_gates = [
  "[linux] 1.8.0", "[macos] 1.8.0", "[windows] 1.8.0", "[unix] 1.8.0", "[openbsd] 1.38.0",
  "[freebsd] 1.47.0", "[netbsd] 1.47.0", "[dragonfly] 1.47.0", "[android] 1.50.0",
]
platform_gate_scope = "any item (recipe, alias, mod, set, assignment) since 1.56.0 (conditional attributes on all items)"

[language.functions]
system = ["arch()", "os()", "os_family()", "num_cpus() 1.15.0"]
external_commands = ["shell(command, args...) 1.27.0"]
environment = ["env(key) 1.15.0", "env(key, default) 1.15.0", "env_var() and env_var_or_default() deprecated"]
executables = ["require(name) 1.39.0", "which(name) 1.39.0"]
invocation = ["is_dependency()", "num_jobs() 1.56.0", "recipe_name() 1.53.0", "invocation_directory()", "invocation_directory_native()", "justfile()", "justfile_directory()", "source_file() 1.27.0", "source_directory() 1.27.0", "module_file()", "module_directory()", "module_path() 1.50.0", "just_executable()", "just_pid()", "just_version() 1.55.0"]
strings = ["append", "prepend", "encode_uri_component", "quote", "replace", "replace_regex", "trim", "trim_end", "trim_end_match", "trim_end_matches", "trim_start", "trim_start_match", "trim_start_matches", "len() 1.57.0", "split (split('') splits into characters since 1.57.0)"]
case_conversion = ["capitalize", "kebabcase", "lowercamelcase", "lowercase", "shoutykebabcase", "shoutysnakecase", "snakecase", "titlecase", "uppercamelcase", "uppercase"]
paths = ["absolute_path", "canonicalize 1.24.0", "extension", "file_name", "file_stem", "parent_directory", "without_extension", "clean", "join", "path_exists", "read 1.39.0"]
assertions = ["assert(CONDITION, MESSAGE) 1.27.0 (message optional since 1.53.0)", "error(message)"]
hashing_and_random = ["blake3 1.25.0", "blake3_file 1.25.0", "sha256", "sha256_file", "uuid", "choose(n, alphabet) 1.27.0"]
datetime = ["datetime(format) 1.30.0", "datetime_utc(format) 1.30.0"]
semver = ["semver_matches(version, requirement) 1.16.0"]
style = ["style(styles) 1.37.0", "style(styles, text) 1.55.0 (RGB and fixed colours 1.55.0)"]
user_directories = ["cache_directory", "config_directory", "config_local_directory", "data_directory", "data_local_directory", "executable_directory", "home_directory", "runtime_directory (1.49.0)"]
constants = ["HEX, HEXLOWER, HEXUPPER", "PATH_SEP, PATH_VAR_SEP 1.41.0", "terminal escapes: CLEAR, NORMAL, BOLD, ITALIC, UNDERLINE, INVERT, HIDE, STRIKETHROUGH, and the colour names (1.37.0)"]

[language.cli]
# Read from `just --help` (local binary 1.59.0); each long option also has a JUST_* environment variable.
commands = [
  "--list [MODULE...] (-l), --groups, --summary, --usage [PATH...] (1.46.0), --show RECIPE_PATH (-s), --variables",
  "--evaluate [VAR] with --evaluate-format just|shell (1.49.0)",
  "--dump with --dump-format just|json, and --json as a synonym (1.48.0)",
  "--fmt (stabilized 1.50.0), --fmt --check prints a diff and exits 1 if unformatted",
  "--choose with --chooser (default fzf; the justfile path is passed in an environment variable since 1.59.0)",
  "--command (-c): run an arbitrary command with the justfile's working directory, .env, overrides and exports",
  "--completions bash|elvish|fish|nushell|powershell|zsh (dynamic completion engine since 1.48.0)",
  "--init, --edit (-e), --man, --changelog, --clean [RECIPE_PATH...] (clears the .justcache directory)",
]
flags = [
  "--dry-run (-n), --yes (auto-confirm [confirm]), --one, --no-deps, --time (1.49.0), --timestamp and --timestamp-format, --jobs N (1.56.0)",
  "--justfile (-f, '-' reads stdin since 1.51.0), --working-directory (-d, allowed without --justfile since 1.59.0), --global-justfile (-g), --ceiling, --allow-missing",
  "--set VAR VALUE, --shell, --shell-arg, --shell-command, --clear-shell-args, --tempdir, --unstable, --verbose, --quiet",
  "--list-heading, --list-prefix, --list-submodules, --alias-style, --group, --unsorted, --no-aliases, --complete-aliases",
  "--color, --highlight, --no-highlight, --command-color, --explain, --indentation, --cygpath",
]

[[just.changes]]
version = "1.59.0"
date = "2026-10-14"
kind = "breaking"
summary = "Requires Unicode (UTF-8) paths. Added [cache(environment)], --usage over a module path, --working-directory without --justfile; the default chooser receives the justfile through an environment variable."

[[just.changes]]
version = "1.58.0"
date = "2026-08-03"
summary = "Added [timestamp] and [timestamp(FORMAT)]. just --fmt now surrounds interpolations with spaces ({{root}} becomes {{ root }}), so previously formatted justfiles fail --fmt --check. --justfile-name takes comma-separated values."

[[just.changes]]
version = "1.57.0"
date = "2026-07-18"
summary = "Added len(). Many hard-error tightenings: duplicate groups, option names starting with '-', [arg(flag)] with [arg(pattern)], empty alphabet in choose(). cmd.exe arguments pass unescaped. Markdown justfiles are found by name. [env] variables are visible to shell()."

[[just.changes]]
version = "1.56.0"
date = "2026-07-09"
summary = "Added --jobs and num_jobs(), set indentation, [arg(min)] and [arg(max)], platform attributes on any item, [doc] and [env] as expressions. Assignments are evaluated in dependency order; shell() is not run in a dry run; set ignore-comments applies only to shell recipes."

[[just.changes]]
version = "1.55.0"
date = "2026-06-29"
summary = "Added module aliases, set minimum-version, just_version(), [arg(multiple)], variadic parameters as options, combined short options, style() with RGB and fixed colours."

[[just.changes]]
version = "1.54.0"
date = "2026-06-22"
summary = "Added unstable [cache] cached recipes (BLAKE3 keys under .justcache), [continue], set dotenv-command and --dotenv-command."

[[just.changes]]
version = "1.53.0"
date = "2026-06-16"
summary = "Added markdown justfiles, recipe_name(), unstable set lists; assert() message optional."

[[just.changes]]
version = "1.52.0"
date = "2026-06-08"
summary = "Added set default-script and [shell], set default-list and --default-list; recipes that depend on absent optional modules are disabled."

[[just.changes]]
version = "1.51.0"
date = "2026-05-09"
summary = "Added set no-cd; --justfile - reads standard input; [env] and [working-directory] accept expressions."

[[just.changes]]
version = "1.50.0"
date = "2026-04-19"
summary = "--fmt stabilized (no longer needs --unstable). Added [android], module_path(), --choose filtered by --group; JSON dump gains module_path."

[[just.changes]]
version = "1.49.0"
date = "2026-04-04"
summary = "Added user-defined functions (unstable), a just skill for agents (skills/just, npx skills add casey/just --global), --time, --evaluate-format, --justfile-name, --indentation, runtime_directory(), a Nix flake."

[[just.changes]]
version = "1.48.0"
date = "2026-03-23"
summary = "Lazy evaluation stabilized; dynamic shell completion engine; --json; docker images; which() and require() respect PATHEXT on Windows; variables overridable in submodules."

[[just.changes]]
version = "1.47.0"
date = "2026-03-14"
summary = "Added lazy setting, ? guard sigil, --group, [env(NAME, VALUE)], BSD attributes; [private] modules hidden from --list."

[[just.changes]]
version = "1.46.0"
date = "2026-01-01"
summary = "Recipes accept --long and -s options and flags; --usage with argument help strings; const expressions in settings and working-directory."

[[just.changes]]
version = "1.45.0"
date = "2025-12-10"
summary = "[arg(pattern=...)] requires recipe arguments to match a regular expression."

[[just.changes]]
version = "1.44.0"
date = "2025-12-06"
summary = "[script] stabilized; f'{format}' strings with double braces; newlines allowed in interpolations."

