# --- hand-written below: kept by `export` ---
[run]
host = "fr2 (ay.toml [hosts].test): sqlite on local disk, git mirrors on $WORK/shared"
scope = "full sync of the 12 most recently pushed non-fork repos; metadata and language tags for all 86"
not_returned_by_the_api = "opencode: 3 issues and 19 pull requests that GitHub counts but its list query does not return (skipped, not retried forever)"

[[site]]
url = "https://opencode.ai/"
sitemap_pages = 2101
mirrored = 2101
mirror = "$AY_DATA_DIR/recon/anomalyco/anomalyco/mirror"
sections = { "/data" = 1617, "/changelog" = 204, "/docs" = 69, "/console" = 27 }

[[site]]
url = "https://sst.dev/"
sitemap_pages = 336
mirror = "$AY_DATA_DIR/recon/anomalyco/anomalyco-sites/mirror/sst.dev"
sections = { "/docs" = 292, "/blog" = 40 }

[[site]]
url = "https://openauth.js.org/"
sitemap_pages = 32
mirror = "$AY_DATA_DIR/recon/anomalyco/anomalyco-sites/mirror/openauth.js.org"

[[site]]
url = "https://models.dev/"
sitemap_pages = 0
note = "no sitemap pages; the data behind it is the models.dev repo, replicated here"

[[api]]
name = "opencode server OpenAPI"
spec_path_in_repo = "packages/protocol/openapi.json"
served_at = "/openapi.json of `opencode serve` (packages/server/src/routes.ts, HttpApiBuilder openapiPath)"
openapi = "3.1.0"
title = "opencode HttpApi 0.0.1"
paths = 139
read_from = "anomalyco/opencode default branch dev, git mirror on fr2"

[[api]]
name = "GitHub GraphQL and REST"
used_for = "repos, pull requests, issues, comments, reviews, labels, milestones, timeline, releases"
[[api]]
name = "npm registry and downloads API"
used_for = "packuments (versions, publish dates), last-month downloads, @scope search"
[[api]]
name = "crates.io API"
used_for = "crate and version metadata, total and 90 day downloads; User-Agent names the project, no email"
[[api]]
name = "PyPI JSON API and pypistats"
used_for = "none of the 12 deep-synced repos publishes to PyPI; the client is tested on fixtures"
