# Claims the estate relies on, each with a live probe (tools/claims.ts). Add a row when a statement matters enough to be
# wrong about; a failed row means the claim is false now and the documents that rely on it need an update.
# probe: json (url, path) | gh (url = API path, path) | regex (url, pattern) | status (url) | git-refs (url)
# op: eq | matches | any-matches | none-matches | gte | lte | exists

[[claim]]
id = "linux-mainline-rc"
text = "Linux mainline is at a 7.4 release candidate"
probe = "json"
url = "https://www.kernel.org/releases.json"
path = "releases.0.version"
op = "matches"
value = "^7\\.4-rc"

[[claim]]
id = "linux-7-5-unreleased"
text = "Linux 7.5 is not released (no v7.5 tag)"
probe = "gh"
url = "repos/torvalds/linux/tags?per_page=30"
path = "*.name"
op = "none-matches"
value = "^v7\\.5(\\.|$)"

[[claim]]
id = "linux-stable-73"
text = "The newest stable kernel is 7.3.x"
probe = "json"
url = "https://www.kernel.org/releases.json"
path = "latest_stable.version"
op = "matches"
value = "^7\\.3\\."

[[claim]]
id = "aosp-android-17"
text = "AOSP publishes the tag android-17.0.0_r1"
probe = "git-refs"
url = "https://android.googlesource.com/platform/manifest"
op = "any-matches"
value = "^android-17\\.0\\.0_r1$"

[[claim]]
id = "aosp-no-android-18-manifest"
text = "AOSP has no android-18 manifest branch or tag yet"
probe = "git-refs"
url = "https://android.googlesource.com/platform/manifest"
op = "none-matches"
value = "^android-18"

[[claim]]
id = "gki-android18-73"
text = "The Android common kernel has the branch android18-7.3"
probe = "git-refs"
url = "https://android.googlesource.com/kernel/common"
op = "any-matches"
value = "^android18-7\\.3$"

[[claim]]
id = "redroid-no-android-17"
text = "Docker Hub redroid has no 17.x image"
probe = "json"
url = "https://hub.docker.com/v2/repositories/redroid/redroid/tags?page_size=25&name=17."
path = "count"
op = "eq"
value = 0

[[claim]]
id = "wsl-kernel-618"
text = "Microsoft's newest WSL2 kernel release is on the 6.18 line"
probe = "gh"
url = "repos/microsoft/WSL2-Linux-Kernel/releases/latest"
path = "tag_name"
op = "matches"
value = "^linux-msft-wsl-6\\.18"

[[claim]]
id = "cachyos-rc-pkgver"
text = "CachyOS builds a release-candidate kernel (linux-cachyos-rc)"
probe = "regex"
url = "https://raw.githubusercontent.com/CachyOS/linux-cachyos/master/linux-cachyos-rc/.SRCINFO"
pattern = "pkgver = (\\S+)"
op = "matches"
value = "^7\\.\\d+\\.rc\\d+$"

[[claim]]
id = "arch-linux-pkg"
text = "Arch's linux package is on the 7.3 line"
probe = "json"
url = "https://archlinux.org/packages/core/x86_64/linux/json/"
path = "pkgver"
op = "matches"
value = "^7\\.3\\."

[[claim]]
id = "tree-sitter-release"
text = "tree-sitter's newest release is 0.27 or later"
probe = "gh"
url = "repos/tree-sitter/tree-sitter/releases/latest"
path = "tag_name"
op = "matches"
value = "^v0\\.(2[7-9]|[3-9]\\d)"

[[claim]]
id = "stack-graphs-archived"
text = "github/stack-graphs is archived"
probe = "gh"
url = "repos/github/stack-graphs"
path = "archived"
op = "eq"
value = true

[[claim]]
id = "cf-connect-handler-doc"
text = "Cloudflare documents an inbound TCP connect() handler for Workers"
probe = "status"
url = "https://developers.cloudflare.com/workers/runtime-apis/handlers/connect/"
op = "eq"
value = 200

[[claim]]
id = "cf-hyperdrive-databases-doc"
text = "Cloudflare documents the databases Hyperdrive supports"
probe = "status"
url = "https://developers.cloudflare.com/hyperdrive/reference/supported-databases-and-features/"
op = "eq"
value = 200

[[claim]]
id = "crates-owner-count"
text = "The aphrody-dev account has published at least 300 crates"
probe = "json"
url = "https://crates.io/api/v1/crates?user_id=440521&per_page=1"
path = "meta.total"
op = "gte"
value = 300

[[claim]]
id = "npm-scope-count"
text = "At least 600 packages are published under the @aphrody scope"
probe = "json"
url = "https://registry.npmjs.org/-/v1/search?text=%40aphrody&size=1"
path = "total"
op = "gte"
value = 600

[[claim]]
id = "org-repo-count"
text = "aphrody-labs holds at least 900 public repositories"
probe = "gh"
url = "orgs/aphrody-labs"
path = "public_repos"
op = "gte"
value = 900

[[claim]]
id = "bun-fork-sync"
text = "The Bun fork is at most 100 commits behind oven-sh/bun"
probe = "gh"
url = "repos/aphrody-labs/bun/compare/oven-sh:main...aphrody-labs:main"
path = "behind_by"
op = "lte"
value = 100

[[claim]]
id = "ci-ay"
text = "The latest completed ay workflow run on main succeeded"
probe = "gh"
url = "repos/aphrody-dev/ay/actions/runs?branch=main&status=completed&per_page=1"
path = "workflow_runs.0.conclusion"
op = "eq"
value = "success"

[[claim]]
id = "ci-aphrody"
text = "The latest completed aphrody CI run on main succeeded"
probe = "gh"
url = "repos/aphrody-dev/aphrody/actions/workflows/aphrody-ci.yml/runs?branch=main&status=completed&per_page=1"
path = "workflow_runs.0.conclusion"
op = "eq"
value = "success"

[[claim]]
id = "ci-kernel-watch"
text = "The latest completed kernel-watch workflow run succeeded"
probe = "gh"
url = "repos/aphrody-dev/aphrody/actions/workflows/aphrody-kernel-watch.yml/runs?status=completed&per_page=1"
path = "workflow_runs.0.conclusion"
op = "eq"
value = "success"

[[claim]]
id = "ci-standard"
text = "The latest completed standard workflow run in aphrody-labs/.github succeeded"
probe = "gh"
url = "repos/aphrody-labs/.github/actions/workflows/standard.yml/runs?branch=main&status=completed&per_page=1"
path = "workflow_runs.0.conclusion"
