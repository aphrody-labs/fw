# Extraction-source manifest for aphrody-dev/ay (generated 2026-11-18).
#
# Each [[source]] is an upstream repository used ONLY as an extraction source for
# skills, docs, MCP server definitions and the code graph. Builds never use these
# checkouts: they build against the artifacts listed in `published` (registry,
# name, latest version) from crates.io, npm and PyPI. An empty `published` means
# the repository publishes nothing and is consumed as source only.
#
# Fields: upstream, fork (aphrody-labs, git submodule with relative URL),
# fork_parent (only when the fork's GitHub parent differs from upstream), branch
# (upstream default branch), language (GitHub primary language), role (GitHub
# description), extract (subset of skills, docs, mcp, graph, decided from the git
# tree), skills_paths / docs_paths / mcp_paths (concrete paths in the tree),
# published (artifacts to build against, max 8, only names whose registry
# metadata points back at the upstream repository), note.
#
# Refresh: re-run the generator (gh api repos/<upstream>, repos/<upstream>/git/trees/<branch>?recursive=1,
# https://crates.io/api/v1/crates/<name>, https://registry.npmjs.org/<name>/latest,
# https://pypi.org/pypi/<name>/json), then validate with:
#   bun -e 'Bun.TOML.parse(await Bun.file("docs/upstream/sources.toml").text())'

