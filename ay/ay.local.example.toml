# Local overrides of ay.toml: this machine's layout and the fleet. Git-ignored; copy ay.local.example.toml.

[legacy]
checkout = "../legacy"

[recovery]
scan = ["<directory of a host to inventory>"]

# Hosts by role; values are ssh Host aliases resolved by `ssh -G <alias>`.
[hosts]
build = "<ssh alias of the build host>"                # builds, CI runners, heavy agents
test = "<ssh alias of the test host>"                 # tests, benchmarks, research
prod = "<ssh alias of the production host>"                 # production only

# Per-role layouts on those hosts (tools/hosts.ts reads them; nothing else writes a host path).
# work = the large volume for builds, caches and mirrors; the test host mounts the build host's volume over NFS.
[paths.build]
work = "<work volume on the build host>"
android_sdk = "<Android SDK on the build host>"          # optional; tools/compose-check.ts
gradle_home = "<Gradle user home on the build host>"      # optional; defaults to <work>/gradle-home
[paths.test]
work = "<work volume on the test host>"

[repos.aphrody]
checkout = "../aphrody"
[repos.bun]
checkout = "../bun"
[repos.nie]
checkout = "../nie"
[repos.shenron]
checkout = "../shenron"
[repos.browser]
checkout = "../browser"
[repos.anu]
checkout = "../anu"
[repos.ai-os]
checkout = "../ai-os"
[repos.open]
checkout = "../open"
[repos.rosegriffon]
checkout = "../rosegriffon"
[repos.standard]
checkout = "../aphrody-labs-github"


# Web search and page reading for agents (packages/ai-os/src/server/searxng-mcp.ts, hub server "searxng").
# [search]
# url = "http://127.0.0.1:8888"      # the SearXNG instance, as seen from the host that runs mcp-searxng (or SEARXNG_URL)
# via = "test"                       # optional host role: run mcp-searxng there over ssh
# [search.env]                       # any SEARXNG_* setting of mcp-searxng (cache, timeouts, proxies, limits)
# SEARXNG_MAX_RESULTS = "20"

# [hygiene]                                  # tools/host-hygiene.ts: what the policy of ay.toml [hygiene] must never touch
# roots = ["/home", "/root", "/srv"]         # where targets and node_modules are looked for
# protect = ["/srv/<site>", "/var/lib/containerd"]   # deployed apps and container storage: never purged
# keep_toolchains = []                       # extra rustup toolchains to keep besides rust-toolchain.toml
# [hygiene.systemd]
# keep = ["fleet-*", "nginx"]                # custom units declared on purpose; others are reported (--disable-undeclared disables them)

