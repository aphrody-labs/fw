[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
material-colors = "0.5.0"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
