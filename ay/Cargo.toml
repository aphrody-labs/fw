[workspace]
resolver = "3"
members = ["crates/*", "crates/ay-core/capi", "crates/ay-core/jni"]
exclude = ["third_party", "crates/ay-core/capi/py", "packages"]

[workspace.package]
edition = "2024"
publish = false
version = "0.4.0"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["aphrody-dev"]
repository = "https://github.com/aphrody-dev/ay"

[workspace.dependencies]
aes-gcm = "0.11.1"
age = { version = "0.12.1", default-features = false }
anyhow = "1.0.104"
argh = "0.1.19"
ay-agent-context = { path = "crates/ay-agent-context" }
ay-boq = { path = "crates/ay-boq" }
ay-brand = { path = "crates/ay-brand" }
ay-core = { path = "crates/ay-core" }
ay-re = { path = "crates/ay-re" }
ay-sh-pty = { path = "crates/ay-sh-pty" }
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
browser-browse = { path = "third_party/browser/components/browser-browse" }
browser-detect = { path = "third_party/browser/components/browser-detect", default-features = false }
browser-engine = { path = "third_party/browser/components/browser-engine" }
browser-views = { path = "third_party/browser/components/browser-views" }
browser-vpn = { path = "third_party/browser/components/browser-vpn" }
cc = "1.11.2"
clap = { version = "4.6.8", features = [
  "derive",
  "env",
  "cargo",
  "string",
  "unicode",
] }
crc32fast = "1.5.5"
dioxus = { version = "0.7.10", default-features = false, features = ["signals", "macro", "html"] }
dioxus-core = "0.7.10"
dioxus-signals = "0.7.10"
dioxus-ssr = "0.7.10"
flate2 = "1.1.11"
getrandom = "0.4.3"
goblin = "0.10.7"
iced-x86 = "1.22.0"
ignore = "0.4.34"
material-colors = "0.5.0"
memmap2 = "0.9.12"
oxc_allocator = "0.159.0"
oxc_ast = "0.159.0"
oxc_ast_visit = "0.159.0"
oxc_parser = "0.159.0"
oxc_span = "0.159.0"
oxc_syntax = "0.159.0"
pyo3 = "0.30.1"
rayon = "1.12.0"
regex = "1.13.2"
ropey = { version = "2.0.0-beta.1", features = ["metric_chars"] }
rusqlite = "0.40"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
streaming-iterator = "0.1.9"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "parking_lot",
  "rt",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
toml = "1.2.1"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.5.2", features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
wasm-bindgen = "0.2.130"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_DirectComposition",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Networking_WinSock",
  "System",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
  "Win32_System_Performance",
  "Win32_Security",
] }
zerocopy = { version = "0.8.63", features = ["derive", "alloc", "simd"] }
zeroize = "1.9.2"
zstd = "0.14.4"

[patch."https://github.com/unixwin/rubash.git"]
rubash = { path = "third_party/rubash" }

[patch."https://github.com/unixwin/ruline"]
readline-abi = { path = "third_party/ruline/readline-abi" }

[patch.crates-io]
reedline = { path = "third_party/ruline" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"
