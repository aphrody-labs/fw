tracing = "0.1.44"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
ureq = { version = "3.5.2", features = ["json"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = "1.29.3"
walkdir = "2.5.0"
wasm-bindgen = "0.2.130"
which = "8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_DirectComposition", "Win32_System_Threading", "Win32_Security", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinSock", "System"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_Security"] }
zerocopy = { version = "0.8.63", features = ["derive", "alloc", "simd"] }
zeroize = "1.9.2"
zstd = "0.14.4"

[patch."https://github.com/unixwin/rubash.git"]
rubash = { path = "third_party/rubash" }

[patch."https://github.com/unixwin/ruline"]
readline-abi = { path = "third_party/ruline/readline-abi" }

[patch.crates-io]
reedline = { path = "third_party/ruline" }
# hyperium/h3 master (2026-09-20) carries fixes the 0.0.8 release lacks (send_data flushed before finish, stop_sending, request tracking);
# reqwest's http3 client and ay-http's server both use it. Fork of hyperium/h3; drop the patch once the next release ships.
h3 = { git = "https://github.com/aphrody-labs/h3-1", rev = "43745ad87e95b0c035ac9c547aad467303213425" }
h3-quinn = { git = "https://github.com/aphrody-labs/h3-1", rev = "43745ad87e95b0c035ac9c547aad467303213425" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bare-metal]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
