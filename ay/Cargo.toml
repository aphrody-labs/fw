[workspace]
resolver = "3"
members = ["crates/*", "crates/ay-core/capi", "crates/ay-core/jni"]
exclude = ["third_party", "crates/ay-core/capi/py", "packages"]

[workspace.package]
edition = "2024"
publish = false
version = "0.4.0"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["aphrody-dev"]
repository = "https://github.com/aphrody-dev/ay"

[workspace.dependencies]
aes-gcm = "0.11.1"
age = { version = "0.12.1", default-features = false }
anyhow = "1.0.104"
argh = "0.1.19"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
ay-agent-context = { path = "crates/ay-agent-context" }
ay-brand = { path = "crates/ay-brand" }
ay-core = { path = "crates/ay-core" }
ay-re = { path = "crates/ay-re" }
base64 = "0.23.1"
blake3 = { version = "1.8.7", features = ["mmap", "rayon"] }
browser-browse = { path = "third_party/browser/components/browser-browse" }
browser-detect = { path = "third_party/browser/components/browser-detect", default-features = false }
browser-engine = { path = "third_party/browser/components/browser-engine" }
browser-views = { path = "third_party/browser/components/browser-views" }
browser-vpn = { path = "third_party/browser/components/browser-vpn" }
bytes = "1.12.2"
cc = "1.11.2"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.8", features = ["derive", "env", "cargo", "string", "unicode"] }
craft-csv = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-docx = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-ods = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-opc = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-pdf = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2", default-features = false, features = ["cos"] }
craft-pkcs7 = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-pptx = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-sheet = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
craft-wordmodel = { git = "https://github.com/storytold/craft-libs", rev = "ccbc4b756c168b31358bfa98e71225e9dacb74a2" }
