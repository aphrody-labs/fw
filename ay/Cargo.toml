prost = "0.14.6"
protoc-bin-vendored = "3.2.0"
pyo3 = "0.30.1"
rayon = "1.12.0"
rcgen = "0.14"
regex = "1.13.2"
ropey = { version = "2.0.0-beta.1", features = ["metric_chars"] }
rusqlite = "0.40"
rustc-hash = "2.1.3"
rustls = "0.23.46"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
skrifa = { version = "0.50.0", default-features = false, features = ["std"] }
spdx = "0.13.6"
streaming-iterator = "0.1.9"
subtle = "2.6"
taffy = { version = "0.15.1", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "block_layout"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
