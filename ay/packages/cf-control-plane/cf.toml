# Worker routes and custom domains below belong to the unified edge Worker (script = "ay-edge", exactly the routes of apps/edge/edge.toml) or to one of these
# scripts, which live in other repositories and stay where they are. `bun tools/edge-config.ts --check` fails on any route that is neither, or both.
[edge]
external_scripts = ["aphrody", "aphrody-app", "aphrody-deploy", "aphrody-mcp-gateway", "aphrody-sites", "aphrody-webos", "api-aphrody-com", "bun-video-showcase", "aphrody-web", "rosegriffon-discord", "rosegriffon-edge"]

# Zone settings of every zone below (tools/cf-reconcile.ts diffs them, `--apply-zones` writes them; a `[zones."<zone>".settings]` table overrides one key).
# http3 serves QUIC on UDP 443 and Cloudflare advertises it in Alt-Svc; 0rtt and tls_1_3 = "zrt" allow TLS 1.3 early data; early_hints sends 103 for cached Link headers.
[zone_settings]
http3 = "on"
zero_rtt = "on"
tls_1_3 = "zrt"
early_hints = "on"
min_tls_version = "1.2"

# Declarative Multi-Zone Cartography (191 DNS records, Worker routes, Worker Custom Domains, R2 CDNs, Tunnels & Mail)
# Zero literal Account IDs, Zone IDs, Tunnel UUIDs, or VPS IPs: resolved dynamically via `cf.local.toml`.

[zones."aphrody.com"]
worker_aaaa = ["www", "api", "bun", "cdn", "creator", "downloads", "mcp", "releases", "assets", "wasm", "learn", "auto", "video", "web"]

