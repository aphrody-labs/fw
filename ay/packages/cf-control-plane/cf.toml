# Declarative public-safe control plane of the Cloudflare units (packages/cf-control-plane).
# Literal Account IDs, Zone IDs, Tunnel UUIDs, VPS IPs, and emails live ONLY in the git-ignored `cf.local.toml`.

[product]
name = "cf"
repo = "aphrody-labs/ay"
fork_org = "aphrody-labs"
description = "Unified Cloudflare monorepo, upstream fork sync, FinOps, tunnels, Mullvad VPN, proxy VPS, and polyglot edge toolchain"

[plans]
workers_paid = true
workers_paid_base_usd = 5.0
r2_paid = true
observability_paid = true
images_stream_basic = true

[finops]
# Workers Paid included monthly quota + overage rates
workers_included_requests = 10_000_000
workers_overage_per_million_usd = 0.30
workers_included_cpu_ms = 30_000_000
workers_cpu_per_million_ms_usd = 0.02
# Observability monthly free tier + overage
observability_included_events = 20_000_000
observability_overage_per_million_usd = 0.60
# R2 Paid monthly free tier + overage
r2_included_gb = 10.0
r2_storage_per_gb_usd = 0.015
r2_included_class_a = 1_000_000
r2_class_a_per_million_usd = 4.50
r2_included_class_b = 10_000_000
r2_class_b_per_million_usd = 0.36
# Target FinOps policies
default_cdn_cpu_ms = 50
default_api_cpu_ms = 500
cdn_log_sampling_rate = 0.1
api_log_sampling_rate = 1.0
default_trace_sampling_rate = 0.05
r2_multipart_abort_seconds = 86_400

[domains]
# Core domains + maintained sites (1 OS + 4 web estates)
primary = ["aphrody.com", "aphrody.app"]
sites = ["dragonballfr.com", "rosegriffon.fr"]

[[site]]
id = "aphrody-os"
zone = "aphrody.com"
kind = "os-and-portal"
tunnel = "aphrody"
origin_role = "edge-proxy"

[[site]]
id = "aphrody-webos"
zone = "aphrody.app"
kind = "webos-apps-and-r2-cdn"
tunnel = "aphrody"
origin_role = "edge-proxy"

[[site]]
id = "shenron"
zone = "dragonballfr.com"
kind = "community-portal-and-cdn"
tunnel = "shenron"
origin_role = "origin"

[[site]]
id = "rosegriffon"
zone = "rosegriffon.fr"
kind = "community-portal-and-api"
tunnel = "rosegriffon"
origin_role = "origin"

[tunnels.aphrody]
transport = "quic"
connectors = 2
ingress = ["dbfr.aphrody.com", "mcp-origin.aphrody.com", "ssh-prd.aphrody.com"]

[tunnels.nie]
transport = "quic"
connectors = 2
ingress = ["nie.aphrody.app"]

[tunnels.rosegriffon]
transport = "quic"
connectors = 2
ingress = [
  "rosegriffon.fr",
  "www.rosegriffon.fr",
  "achillea.rosegriffon.fr",
  "azalee.rosegriffon.fr",
  "admin.rosegriffon.fr",
  "shop.rosegriffon.fr",
  "api.rosegriffon.fr",
  "api-achillea.rosegriffon.fr",
  "api-azalee.rosegriffon.fr",
  "ranked.rosegriffon.fr",
  "bot.rosegriffon.fr",
  "mcp.rosegriffon.fr",
  "cdn.rosegriffon.fr",
]

[tunnels.shenron]
transport = "quic"
connectors = 4
ingress = [
  "dragonballfr.com",
  "www.dragonballfr.com",
  "bot.dragonballfr.com",
  "mcp.dragonballfr.com",
  "origin-cdn.dragonballfr.com",
]

# Active R2 buckets (tier: hot-reusable | dist | site-cdn | cold-offload)
[buckets]
aphrody-assets = { tier = "hot-reusable", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-video = { tier = "hot-reusable", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-releases = { tier = "dist", custom_domains = ["releases.aphrody.com"], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-dist = { tier = "dist", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
bun-lib = { tier = "dist", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
rosegriffon-cdn = { tier = "site-cdn", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
shenron-cdn = { tier = "site-cdn", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-backups = { tier = "cold-offload", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-chromium = { tier = "cold-offload", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-gnu = { tier = "cold-offload", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }
aphrody-lore = { tier = "cold-offload", custom_domains = [], abort_multipart_seconds = 86_400, public_r2_dev = false }

