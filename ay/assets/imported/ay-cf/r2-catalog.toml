# Verified Permissive R2 Reusable Media & 3D Asset Catalog + Pure-Rust Crate Stack
# Targets: `aphrody-assets` (`https://assets.aphrody.app`) and `aphrody-video` (`https://video.aphrody.app`)
# Key format: `v1/<kind>/<blake3>.<ext>` | Edge Cache Ceiling: 512 MiB (536870912 bytes) | Origin Content-Encoding: identity

[meta]
schema_version = 1
assets_bucket = "aphrody-assets"
assets_origin = "https://assets.aphrody.app"
video_bucket = "aphrody-video"
video_origin = "https://video.aphrody.app"
edge_cache_max_bytes = 536_870_912
immutable_cache_control = "public, max-age=31536000, immutable"
index_cache_control = "public, max-age=60, must-revalidate"

[policy]
allowed_spdx_tier_a = ["CC0-1.0", "MIT", "ISC", "Apache-2.0", "OFL-1.1", "Zlib", "BSD-2-Clause", "BSD-3-Clause", "Unlicense"]
allowed_spdx_tier_b = ["CC-BY-4.0", "CC-BY-3.0"]
blocked_spdx_substrings = ["-NC", "-SA", "GPL", "AGPL", "LGPL", "EULA", "SCEA", "Proprietary"]
quarantined_sources = [
  "Remix-Design/RemixIcon>=4.9.0",
  "Unsplash",
  "Pexels",
  "Pixabay",
  "Mixkit",
  "Coverr",
  "Lordicon",
  "ShareTextures",
  "SVGRepo-Default-License",
  "rav1d-safe",
]

# Verified Pure-Rust Crate Stack (wgpu v30 + wasm32 compatible notes)
[[rust_crate]]
domain = "icons"
crate = "usvg"
version = "0.50.0"
spdx = "Apache-2.0 OR MIT"
wasm32 = true
features = ["text"]
note = "Forbid unsafe_code; disable default system-fonts/memmap-fonts on wasm32"

[[rust_crate]]
domain = "icons"
crate = "resvg"
version = "0.50.0"
spdx = "Apache-2.0 OR MIT"
wasm32 = true
features = ["raster-images", "text"]
note = "Spec-compliant pure-Rust CPU SVG rasterizer"

[[rust_crate]]
domain = "icons"
crate = "vello"
version = "0.12.0"
spdx = "Apache-2.0 OR MIT"
wasm32 = true
features = ["wgpu"]
note = "Matches vendor/wgpu 30; requires WebGPU compute in browsers"

[[rust_crate]]
domain = "icons"
crate = "vello_gpu"
version = "0.4.0"
spdx = "Apache-2.0 OR MIT"
wasm32 = true
features = ["wgpu", "text"]
note = "Sparse-strips GPU renderer on wgpu 30 with WebGL2 fallback and ExternalTexture video support"

[[rust_crate]]
domain = "icons"
crate = "lucide-icons"
