# Declarative Pop!_OS / COSMIC-style fork submodule manifest for `ay` (`aphrody-dev/ay`).
# Rendered into `.gitmodules` and git index (`160000` gitlinks) by `bun tools/submodules.ts`.
# Every fork lives under `aphrody-labs` and uses a relative URL (`../../aphrody-labs/<repo>.git`)
# resolved against `aphrody-dev/ay.git` so HTTPS, SSH, and local mirrors resolve identically.

