# Tier and gate of each top-level directory (MAP.tsv is rendered by aphrody-labs/.github tools/map.ts: bun run map).
[default]
tier = "misc"
gate = "bun run check"

["(root)"]
tier = "manifest"
gate = "bun run check"

[abi]
tier = "c-abi"
gate = "bun tools/abi.ts --check"

[apps]
tier = "program"
gate = "bun test ./apps/ay"

[brand]
tier = "brand"
gate = "bun tools/tokens-compose.ts --check"

[config]
tier = "shell-config"
gate = "bun tools/shells.ts --check"

[corelib]
tier = "c-asm"
gate = "bun tools/corelib.ts"

[cpp]
tier = "cpp"
gate = "bazelisk test //cpp/..."

[crates]
tier = "rust"
gate = "cargo check --workspace"

[docs]
tier = "docs"
gate = "bun tools/features.ts --check"

[kotlin]
tier = "kotlin"
gate = "bun tools/compose-check.ts"

[locales]
tier = "i18n-catalog"
gate = "bun test ./packages/auto-i18n"

[packages]
tier = "bun-package"
gate = "bun test ./packages"

[python]
tier = "python"
gate = "uv run pytest"

[third_party]
tier = "submodule"
gate = "bun tools/submodules.ts --check"

[tools]
tier = "typed-bun"
gate = "bun test ./tools/"
