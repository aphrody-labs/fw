[[cargo.patch]]
source = "crates-io"
crate = "h3"
git = "https://github.com/aphrody-labs/h3"
rev = "43745ad87e95b0c035ac9c547aad467303213425"
why = """
hyperium/h3 master (2026-09-20) carries fixes the 0.0.8 release lacks (send_data flushed before finish, stop_sending, request tracking);
reqwest's http3 client and fw-http's server both use it. Fork of hyperium/h3; drop the patch once the next release ships.
"""

[[cargo.patch]]
source = "crates-io"
crate = "h3-quinn"
git = "https://github.com/aphrody-labs/h3"
rev = "43745ad87e95b0c035ac9c547aad467303213425"


[bun]
workspaces = ["packages/*", "packages/env-kit/*", "apps/*"]
# test fixture, installed by its own test
exclude = ["packages/org-mirror/test/fixtures"]

[uv]
members = ["python/ay_*_py"]
# python sides of polyglot packages (each has its own pyproject and lock scope) and a test fixture; they stay beside the code they serve
exclude = ["packages/env-kit/loaders/python", "packages/ghidra/scripts/parity", "packages/org-mirror/test/fixtures", "packages/py2bun"]

[gradle]
root = "kotlin"
include = ["aphrody-theme"]
catalog = "kotlin/gradle/libs.versions.toml"

[cmake]
projects = ["packages/env-kit/loaders/cpp"]
