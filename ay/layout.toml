[[cargo.patch]]
source = "crates-io"
crate = "h3"
git = "https://github.com/aphrody-labs/h3"
rev = "43745ad87e95b0c035ac9c547aad467303213425"
why = """
hyperium/h3 master (2026-09-20) carries fixes the 0.0.8 release lacks (send_data flushed before finish, stop_sending, request tracking);
reqwest's http3 client and fw-http's server both use it. Fork of hyperium/h3; drop the patch once the next release ships.
"""

