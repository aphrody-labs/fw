[project]
name = "ay-cf-py"
version = "0.1.0"
description = "Cloudflare SDK, Pydantic FinOps control-plane models, and Workers-Py validator"
requires-python = ">=3.12"
dependencies = [
  "cloudflare>=4.0",
  "httpx>=0.28",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ay_cf_py"]
