# Single source of the shell environment (bash family, pwsh). tools/shells.ts generates env.sh and env.ps1 from it into
# the cache directory at install time; never edit the generated files, never track them.
#
# Values: `all`, `windows`, `linux` (darwin follows linux); `{home}` = USERPROFILE / HOME, `{NAME}` = a variable
# declared above, `{programfiles}` = the Program Files directory, read when the files are generated.
# Windows paths are written with `\`. No secret here: tokens stay in the secret store.
#
# Derived by the generator, not listed here: SRC_ROOT (the workspace root: the parent of the aysh checkout).

[var.AY_SHELL_CACHE]
# Init scripts (zoxide, starship, atuin, fzf, completions) and the generated env files; regenerated by the installer.
windows = '{home}\.cache\shell'
linux = '{home}/.cache/shell'

# XDG: Linux only. On Windows, XDG_CONFIG_HOME would move the configuration of nushell and git.
[var.XDG_CONFIG_HOME]
linux = '{home}/.config'
[var.XDG_CACHE_HOME]
linux = '{home}/.cache'
[var.XDG_DATA_HOME]
linux = '{home}/.local/share'
[var.XDG_STATE_HOME]
linux = '{home}/.local/state'

[var.LANG]
all = 'C.UTF-8'
[var.PYTHONUTF8]
all = '1'

# Pinned: no `command -v` at startup (about 7 ms per PATH scan under Git Bash).
[var.EDITOR]
windows = 'hx'
[var.VISUAL]
windows = 'hx'
[var.PAGER]
all = 'less'

[var.CARGO_HOME]
windows = '{home}\.cargo'
linux = '{home}/.cargo'
[var.RUSTUP_HOME]
windows = '{home}\.rustup'
linux = '{home}/.rustup'
[var.BUN_INSTALL]
windows = '{home}\.bun'
linux = '{home}/.bun'

[var.DENO_INSTALL]
windows = '{home}\.deno'
[var.DENO_DIR]
windows = '{home}\.cache\deno'
[var.DENO_NO_UPDATE_CHECK]
all = '1'

[var.npm_config_fund]
all = 'false'
[var.npm_config_audit]
all = 'false'
[var.npm_config_update_notifier]
all = 'false'

# Telemetry off (names checked in the upstream repositories).
[var.DO_NOT_TRACK]
all = '1'
[var.DOTNET_CLI_TELEMETRY_OPTOUT]
all = '1'
[var.POWERSHELL_TELEMETRY_OPTOUT]
all = '1'
[var.POWERSHELL_UPDATECHECK]
all = 'Off'
[var.NEXT_TELEMETRY_DISABLED]
all = '1'
[var.TURBO_TELEMETRY_DISABLED]
all = '1'
[var.ASTRO_TELEMETRY_DISABLED]
all = '1'
[var.WRANGLER_SEND_METRICS]
all = 'false'
[var.CHECKPOINT_DISABLE]
all = '1'

[var.FZF_DEFAULT_COMMAND]
all = 'fd --type f --hidden --exclude .git --path-separator /'
[var.FZF_DEFAULT_OPTS]
all = '--color=bg+:#313244,bg:#1e1e2e,spinner:#f5e0dc,hl:#f38ba8,fg:#cdd6f4,header:#f38ba8,info:#cba6f7,pointer:#f5e0dc,marker:#b4befe,fg+:#cdd6f4,prompt:#cba6f7,hl+:#f38ba8'
[var.STARSHIP_CONFIG]
windows = '{home}\.config\starship.toml'
linux = '{home}/.config/starship.toml'
[var.EZA_CONFIG_DIR]
windows = '{home}\.config\eza'
linux = '{home}/.config/eza'
[var.BAT_CONFIG_PATH]
windows = '{home}\.config\bat\config'
linux = '{home}/.config/bat/config'
[var.ATUIN_CONFIG_DIR]
windows = '{home}\.config\atuin'
linux = '{home}/.config/atuin'

# PATH: the first wins; absent directories are ignored. pwsh moves an entry that is already present to the front; the
# bash family moves only the entries of `front` (a substitution is costly under niubash).
# niubash prepends its WinuxCmd directory when it opens: Coreutils for Windows must come back in front of it.
[path]
front = [
  '{programfiles}\coreutils\bin',
  '{home}\.local\bin',
  '{CARGO_HOME}\bin',
  '{BUN_INSTALL}\bin',
]
windows = [
  '{programfiles}\coreutils\bin',
  '{home}\.local\bin',
  '{CARGO_HOME}\bin',
  '{BUN_INSTALL}\bin',
]
linux = ['{home}/.local/bin', '{CARGO_HOME}/bin', '{BUN_INSTALL}/bin']

# Variables read before a process starts (pwsh: about_Environment_Variables) must exist in HKCU\Environment.
# The installer writes the missing or different ones with setx (it broadcasts WM_SETTINGCHANGE).
[persist.windows]
POWERSHELL_TELEMETRY_OPTOUT = '1'
POWERSHELL_UPDATECHECK = 'Off'
DOTNET_CLI_TELEMETRY_OPTOUT = '1'
PYTHONUTF8 = '1'
BUN_INSTALL = '{home}\.bun'
CARGO_HOME = '{home}\.cargo'
RUSTUP_HOME = '{home}\.rustup'
AY_SHELL_CACHE = '{home}\.cache\shell'
