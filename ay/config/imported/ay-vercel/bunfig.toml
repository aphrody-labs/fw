[install]
linker = "hoisted"
globalStore = true
exact = true
saveTextLockfile = true
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["next", "@next/env", "@next/swc-win32-x64-msvc", "@next/swc-linux-x64-gnu", "@next/swc-darwin-arm64"]

[fmt]
printWidth = 100

[lint]

[lint.rules]
"eqeqeq" = ["error", "smart"]
"no-var" = "error"
"prefer-const" = "error"
"curly" = ["error", "multi-line"]
"no-eval" = "error"
"no-implied-eval" = "error"
"@typescript-eslint/no-namespace" = "error"
"@typescript-eslint/consistent-type-definitions" = ["error", "interface"]
"import/no-mutable-exports" = "error"

[test]
coverage = false
