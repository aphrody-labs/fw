# Copy to git-ignored `ay-cf.local.toml` or generate via `bun tools/bootstrap-local.ts`.
# Never commit real Account IDs, Zone IDs, Tunnel UUIDs, VPS public IPs, or Mullvad private keys.

[cloudflare]
account_id = "<32-char cloudflare account id>"

[cloudflare.zones]
"aphrody.com" = "<zone id>"
"aphrody.app" = "<zone id>"
"dragonballfr.com" = "<zone id>"
"rosegriffon.fr" = "<zone id>"

[cloudflare.tunnels]
aphrody = "<tunnel uuid>"
rosegriffon = "<tunnel uuid>"
shenron = "<tunnel uuid>"

[hosts.build]
ssh_alias = "fr1"
public_ipv4 = "<ovh build public ip>"
public_ipv6 = "<ovh build public ipv6>"
work_dir = "~/ay-cf"

[hosts.edge_proxy]
ssh_alias = "fr2"
public_ipv4 = "<ovh proxy public ip>"
public_ipv6 = "<ovh proxy public ipv6>"

[hosts.origin]
ssh_alias = "prd"
public_ipv4 = "<hostinger origin public ip>"
