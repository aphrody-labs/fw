[package]
name = "fw-learn"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "fw learn engine: harvests git history, manifests, docs, code graphs, CI runs, releases, issues and pull requests of every product into one SQLite FTS5 store, distills rules and publishes them to AGENTS.md, CLAUDE.md and llms.txt"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fw-learn"
path = "src/main.rs"

# Standalone like fw-corpus: its own lockfile, no edits to the root workspace.
[workspace]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
