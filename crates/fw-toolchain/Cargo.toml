[package]
name = "fw-toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "The Rust toolchain factory: `fw toolchain pin|fetch|xwin|build|cache|status` resolves the pinned rustc, cargo and LLVM from rust-toolchain.toml, fetches them with hash checks, splats the Windows SDK and CRT with xwin and builds cross targets with cargo-xwin and cargo-zigbuild on the cluster nodes"

[lib]
name = "fw_toolchain"
path = "src/fw_toolchain.rs"

[[bin]]
name = "fw-toolchain"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
toml.workspace = true
ureq.workspace = true

[lints]
workspace = true
