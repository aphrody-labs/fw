[package]
name = "fw-corpus"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false
description = "Polite, resumable corpus ingest for fw learn: sitemaps, rendered SPAs, gitiles hosts, GitHub docs trees and rustdoc JSON into per-source SQLite FTS5 stores"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "fw-corpus"
path = "src/main.rs"

# Standalone like fw-edge: its own lockfile, no edits to the root workspace.
[workspace]

[dependencies]
anyhow = "1"
base64 = "0.23"
htmd = "0.6"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
