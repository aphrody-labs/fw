[package]
name = "fw-theme"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Configuration and personalization layer: themes as directories (colors, terminal palette, icon set, wallpaper), one render per target (CSS variables, GPUI theme JSON, rio, Hyprland, web), the settings JSON Schema, live reload and `fw theme switch`."

[lib]
name = "fw_theme"
path = "src/fw_theme.rs"
doctest = false

[dependencies]
fw-m3.workspace = true
fw-material.workspace = true
# Same Rust port of material-color-utilities as fw-m3; used for HCT hue/tone control of derived terminal colors.
material-colors = "0.5.0"
notify.workspace = true
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
