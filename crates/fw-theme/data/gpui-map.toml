# Zed/GPUI theme keys <- sources. A source is `m3.<role>` (Material 3 role of the mode), `pal.<key>` (palette key) or
# `term.<key>` (terminal key), with an optional alpha suffix `@<two hex digits>` (8% = 14, 12% = 1f, 38% = 61).
schema = "https://zed.dev/schema/themes/v0.2.0.json"

# Player colors: cursor, background and selection (alpha below) of each collaborator, in this order.
players = ["pal.accent", "pal.orange", "pal.magenta", "pal.cyan", "pal.green", "pal.yellow", "pal.red", "pal.blue"]
selection_alpha = "3d"

[style]
"background" = "m3.surface-container"
"surface.background" = "m3.surface-container-low"
"elevated_surface.background" = "m3.surface-container-high"
"border" = "m3.outline-variant"
"border.variant" = "m3.surface-container-highest"
"border.focused" = "m3.primary"
"border.selected" = "m3.primary-container"
"border.transparent" = "m3.surface@00"
"border.disabled" = "m3.surface-container-high"
"drop_target.background" = "m3.primary@29"
"element.background" = "m3.surface-container-high"
"element.hover" = "m3.surface-container-highest"
"element.active" = "m3.secondary-container"
"element.selected" = "m3.secondary-container"
"element.disabled" = "m3.surface-container"
"ghost_element.background" = "m3.surface@00"
"ghost_element.hover" = "m3.on-surface@14"
"ghost_element.active" = "m3.on-surface@1f"
"ghost_element.selected" = "m3.secondary-container"
"ghost_element.disabled" = "m3.surface@00"
"text" = "m3.on-surface"
"text.muted" = "m3.on-surface-variant"
"text.placeholder" = "m3.outline"
"text.disabled" = "m3.on-surface@61"
"text.accent" = "m3.primary"
"icon" = "m3.on-surface-variant"
"icon.muted" = "m3.outline"
"icon.disabled" = "m3.on-surface@61"
"icon.placeholder" = "m3.outline"
"icon.accent" = "m3.primary"
"status_bar.background" = "m3.surface-container-low"
"title_bar.background" = "m3.surface-container-low"
"title_bar.inactive_background" = "m3.surface-container-lowest"
"toolbar.background" = "m3.surface"
"tab_bar.background" = "m3.surface-container-low"
"tab.inactive_background" = "m3.surface-container-low"
"tab.active_background" = "m3.surface"
"search.match_background" = "m3.tertiary@66"
"search.active_match_background" = "m3.primary@66"
"panel.background" = "m3.surface-container-low"
"panel.focused_border" = "m3.primary"
"pane.focused_border" = "m3.primary"
"scrollbar.thumb.background" = "m3.on-surface-variant@40"
"scrollbar.thumb.hover_background" = "m3.on-surface-variant@66"
"scrollbar.thumb.border" = "m3.outline-variant"
"scrollbar.track.background" = "m3.surface@00"
"scrollbar.track.border" = "m3.outline-variant"
"editor.foreground" = "m3.on-surface"
"editor.background" = "m3.surface"
"editor.gutter.background" = "m3.surface"
"editor.subheader.background" = "m3.surface-container-low"
"editor.active_line.background" = "m3.surface-container-low"
"editor.highlighted_line.background" = "m3.surface-container"
"editor.line_number" = "m3.outline"
"editor.active_line_number" = "m3.on-surface"
"editor.hover_line_number" = "m3.on-surface-variant"
"editor.invisible" = "m3.outline-variant"
"editor.wrap_guide" = "m3.outline-variant@66"
"editor.active_wrap_guide" = "m3.outline-variant"
"editor.document_highlight.read_background" = "m3.primary@1f"
"editor.document_highlight.write_background" = "m3.primary@3d"
"terminal.background" = "m3.surface"
"terminal.foreground" = "m3.on-surface"
"terminal.bright_foreground" = "pal.bright_foreground"
"terminal.dim_foreground" = "m3.on-surface@99"
"terminal.ansi.black" = "term.black"
"terminal.ansi.red" = "term.red"
"terminal.ansi.green" = "term.green"
"terminal.ansi.yellow" = "term.yellow"
"terminal.ansi.blue" = "term.blue"
"terminal.ansi.magenta" = "term.magenta"
"terminal.ansi.cyan" = "term.cyan"
"terminal.ansi.white" = "term.white"
"terminal.ansi.bright_black" = "term.bright_black"
"terminal.ansi.bright_red" = "term.bright_red"
"terminal.ansi.bright_green" = "term.bright_green"
"terminal.ansi.bright_yellow" = "term.bright_yellow"
"terminal.ansi.bright_blue" = "term.bright_blue"
"terminal.ansi.bright_magenta" = "term.bright_magenta"
"terminal.ansi.bright_cyan" = "term.bright_cyan"
"terminal.ansi.bright_white" = "term.bright_white"
"terminal.ansi.dim_black" = "term.black@99"
"terminal.ansi.dim_red" = "term.red@99"
"terminal.ansi.dim_green" = "term.green@99"
"terminal.ansi.dim_yellow" = "term.yellow@99"
"terminal.ansi.dim_blue" = "term.blue@99"
"terminal.ansi.dim_magenta" = "term.magenta@99"
"terminal.ansi.dim_cyan" = "term.cyan@99"
"terminal.ansi.dim_white" = "term.white@99"
"link_text.hover" = "m3.primary"
"error" = "m3.error"
"error.background" = "m3.error-container"
"error.border" = "m3.error"
"warning" = "pal.yellow"
"warning.background" = "pal.yellow@1f"
"warning.border" = "pal.yellow@66"
"success" = "pal.green"
"success.background" = "pal.green@1f"
"success.border" = "pal.green@66"
"info" = "pal.blue"
"info.background" = "pal.blue@1f"
"info.border" = "pal.blue@66"
"hint" = "pal.cyan"
"hint.background" = "pal.cyan@1f"
"hint.border" = "pal.cyan@66"
"predictive" = "m3.outline"
"predictive.background" = "m3.surface-container@99"
"predictive.border" = "m3.outline-variant"
"conflict" = "pal.orange"
"conflict.background" = "pal.orange@1f"
"conflict.border" = "pal.orange@66"
"created" = "pal.green"
"created.background" = "pal.green@1f"
"created.border" = "pal.green@66"
"deleted" = "pal.red"
"deleted.background" = "pal.red@1f"
"deleted.border" = "pal.red@66"
"modified" = "pal.yellow"
"modified.background" = "pal.yellow@1f"
"modified.border" = "pal.yellow@66"
"renamed" = "pal.blue"
"renamed.background" = "pal.blue@1f"
"renamed.border" = "pal.blue@66"
"ignored" = "m3.outline"
"ignored.background" = "m3.outline@1f"
"ignored.border" = "m3.outline-variant"
"hidden" = "m3.outline"
"hidden.background" = "m3.outline@1f"
"hidden.border" = "m3.outline-variant"
"unreachable" = "m3.outline"
"unreachable.background" = "m3.outline@1f"
"unreachable.border" = "m3.outline-variant"
"version_control.added" = "pal.green"
"version_control.deleted" = "pal.red"
"version_control.modified" = "pal.yellow"
"version_control.conflict" = "pal.orange"
"version_control.word_added" = "pal.green@29"
"version_control.word_deleted" = "pal.red@29"
"version_control.conflict_marker.ours" = "pal.green@1f"
"version_control.conflict_marker.theirs" = "pal.blue@1f"


# Syntax groups <- source. `comment` and `emphasis` styles are data, not code.
[syntax.color]
attribute = "pal.accent"
boolean = "pal.orange"
comment = "m3.outline"
"comment.doc" = "m3.on-surface-variant"
constant = "pal.orange"
constructor = "pal.blue"
embedded = "m3.on-surface"
enum = "pal.yellow"
function = "pal.blue"
hint = "pal.cyan"
keyword = "pal.magenta"
label = "pal.accent"
link_text = "pal.blue"
link_uri = "pal.cyan"
namespace = "pal.yellow"
number = "pal.orange"
operator = "pal.cyan"
predictive = "m3.outline"
preproc = "pal.magenta"
primary = "m3.on-surface"
property = "pal.red"
punctuation = "m3.on-surface-variant"
"punctuation.bracket" = "m3.on-surface-variant"
"punctuation.delimiter" = "m3.on-surface-variant"
"punctuation.list_marker" = "pal.accent"
"punctuation.special" = "pal.cyan"
selector = "pal.yellow"
string = "pal.green"
"string.escape" = "pal.cyan"
"string.regex" = "pal.cyan"
"string.special" = "pal.cyan"
"string.special.symbol" = "pal.cyan"
tag = "pal.red"
"text.literal" = "pal.green"
title = "pal.accent"
type = "pal.yellow"
variable = "m3.on-surface"
"variable.parameter" = "pal.orange"
"variable.special" = "pal.red"
variant = "pal.yellow"

[syntax.style]
comment = { font_style = "italic" }
"comment.doc" = { font_style = "italic" }
emphasis = { font_style = "italic" }
"emphasis.strong" = { font_weight = 700 }
title = { font_weight = 700 }
