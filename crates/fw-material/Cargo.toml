[package]
name = "fw-material"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Material Symbols SVG path data and codepoints as Rust constants, generated by tools/material-cdn and served from the Aphrody CDN, with a checksum-pinned tarball and an offline vendored fallback."

[lib]
path = "src/fw_material.rs"
doctest = false

[features]
# outlined is vendored (no network). rounded and sharp are only in the CDN tarball: building with either downloads
# it (curl + tar) and verifies the SHA-256 pinned in vendor/PIN. FW_MATERIAL_SOURCE=cdn forces the tarball for outlined too.
default = ["outlined"]
outlined = []
rounded = []
sharp = []

[build-dependencies]
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
serde_json.workspace = true
resvg = { version = "0.48", default-features = false }

[lints]
workspace = true
