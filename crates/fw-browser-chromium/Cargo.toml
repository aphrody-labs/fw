[package]
name = "fw-browser-chromium"
version = "4.2.0"
edition = "2024"
description = "Chromium through CEF from Rust and Bun: open a URL off-screen, write a PNG screenshot, evaluate JavaScript and return JSON."
build = "build.rs"
publish = false
license = "Apache-2.0"

# Not a member of the fw workspace: build.rs downloads CEF. Build with `cargo build --release -p fw-browser-chromium` from this directory.

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "fw-browser-chromium"
path = "src/main.rs"

[features]
# The Node-API addon loaded by Bun (packages/chromium): cargo build --release --lib --features node.
# Its symbols resolve only inside the host, so never build the binary with this feature.
node = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

# cef-dll-sys is linked for the CEF symbols of `cef`; no code names it.
[package.metadata.cargo-shear]
ignored = ["cef-dll-sys"]

[package.metadata.browser]
native = true

[dependencies]
cef = { version = "=156.6.0", default-features = false }
cef-dll-sys = { version = "=156.6.0", default-features = false }
download-cef = "3.0.1"
napi = { version = "3.16.2", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.7.1", optional = true }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive", "std"] }
serde_json = { version = "1.0.154", features = ["std"] }
thiserror = "2"

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace]
