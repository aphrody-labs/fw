# One entry per upstream (history imported by tools/import.py; `mode = "pin"` only records the head). The Bun runtime is not here: it is a submodule.
# `mode = "pin"` only records the live branch head in the lock (a non-crate tree too large to import).
# Heads are resolved live at import time and recorded in upstreams.lock.json.

[[upstream]]
name = "servo"
url = "https://github.com/servo/servo"
branch = "main"
drop = ["tests/wpt/tests"]   # in-tree copy of web-platform-tests (re-fetched by mach update-wpt)

