# One entry per upstream (history imported by tools/import.py). `mode = "bun"` keeps src/ as is.
# Heads are resolved live at import time and recorded in upstreams.lock.json.

[[upstream]]
name = "bun"
url = "https://github.com/aphrody-labs/bun"   # fork rebased on oven-sh/bun main
branch = "main"
mode = "bun"
keep = ["Cargo.toml", "Cargo.lock", "clippy.toml", "AGENTS.md", "CLAUDE.md", "README.md", "LICENSE.md"]

[[upstream]]
name = "servo"
url = "https://github.com/servo/servo"
branch = "main"
drop = ["tests/wpt/tests"]   # in-tree copy of web-platform-tests (re-fetched by mach update-wpt)

