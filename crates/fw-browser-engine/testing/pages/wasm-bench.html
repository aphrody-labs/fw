<!doctype html>
<meta charset="utf-8">
<title>wasm-bench</title>
<script>
// fib(n) in WebAssembly: (func (param i32) (result i32)) recursive, hand-assembled bytes.
const bytes = new Uint8Array([
  0x00,0x61,0x73,0x6d,0x01,0x00,0x00,0x00,
  0x01,0x06,0x01,0x60,0x01,0x7f,0x01,0x7f,
  0x03,0x02,0x01,0x00,
  0x07,0x07,0x01,0x03,0x66,0x69,0x62,0x00,0x00,
  0x0a,0x1e,0x01,0x1c,0x00,0x20,0x00,0x41,0x02,0x48,0x04,0x7f,0x20,0x00,0x05,
  0x20,0x00,0x41,0x01,0x6b,0x10,0x00,0x20,0x00,0x41,0x02,0x6b,0x10,0x00,0x6a,0x0b,0x0b,
]);
(async () => {
  const out = { ok: false };
  try {
    const t0 = performance.now();
    const { instance } = await WebAssembly.instantiate(bytes);
    out.instantiateMs = performance.now() - t0;
    const n = 32;
    const t1 = performance.now();
    const value = instance.exports.fib(n);
    const ms = performance.now() - t1;
    // fib(32) makes 7049155 calls
    out.n = n; out.value = value; out.fibMs = ms; out.callsPerSec = Math.round(7049155 / (ms / 1000));
    out.ok = value === 2178309;
  } catch (e) { out.error = String(e); }
  window.__result = out;
  document.title = 'done';
})();
</script>
