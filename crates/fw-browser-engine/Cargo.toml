[package]
name = "browser-engine"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "The engines this browser can run on (WebKit/JSC, Blink/V8/Skia/Dawn, Blitz, Servo, Obscura and the experimental Rust ones) and the rule that picks and escalates between them."

[package.metadata.browser]
native = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
