[package]
name = "browser-browse"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Absorbed anomalyco/browse capabilities: real-browser MCP & extension pairing relay, CDP client pool, protected-frame & domain guardrails, human-handoff challenge guard, ARIA @ref snapshots, network redaction, and WebMCP discovery."

[package.metadata.browser]
native = true

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0.229", features = ["derive", "std"] }
thiserror = "2"
url = { version = "2.5.8", features = ["serde"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
