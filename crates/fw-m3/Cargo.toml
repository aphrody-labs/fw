[package]
name = "fw-m3"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Material 3 Expressive foundation shared by fw, aphrody and ay: design tokens, color schemes, springs, type scale, shapes and WCAG contrast."

[lib]
path = "src/fw_m3.rs"
doctest = false

[features]
default = []
serde = ["dep:serde"]
schemars = ["dep:schemars"]

[dependencies]
serde = { workspace = true, optional = true }
schemars = { version = "1", optional = true }

[build-dependencies]
toml.workspace = true

[lints]
workspace = true
