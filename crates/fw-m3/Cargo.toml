[package]
name = "fw-m3"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
publish = false
description = "Material 3 Expressive foundation shared by fw, aphrody and ay: design tokens, color schemes, springs, type scale, shapes and WCAG contrast."

[lib]
path = "src/fw_m3.rs"
doctest = false

[[bin]]
name = "fw-m3"
path = "src/main.rs"

[features]
default = []
serde = ["dep:serde"]
schemars = ["dep:schemars"]

[dependencies]
# Rust port of material-foundation/material-color-utilities (HCT, tonal palettes, dynamic schemes).
material-colors = "0.5.0"
toml.workspace = true
serde = { workspace = true, optional = true }
schemars = { version = "1", optional = true }

[build-dependencies]
toml.workspace = true

[lints]
workspace = true
