description = "Self-hosted Cloudflare mode: compiles a wrangler config to a workerd config (R2 over S3, D1/KV/Queues over Durable Object SQLite), renders the systemd units and the Garage bootstrap for the nodes of cluster/build.toml, and runs the differential parity suite against the cloud and the self-hosted URL; ships `fw-workerd`"

