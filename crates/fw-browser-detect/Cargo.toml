[package]
name = "browser-detect"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Native technology and challenge detection from HTTP and DNS evidence. Legacy published name: browser_detect."

[package.metadata.browser]
native = true

[features]
default = ["fetch"]
# `detect_url`: bounded HTTP fetch and A/AAAA lookup. The runtime only needs `detect_response`.
fetch = ["dep:reqwest", "dep:rustls", "dep:tokio"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "http2"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "net", "io-util"], optional = true }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["std"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "net", "io-util"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
