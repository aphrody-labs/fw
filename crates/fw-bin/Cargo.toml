fw-ui-blitz = { path = "../fw-ui-blitz" }
fw-ostd-wasm = { path = "../fw-ostd-wasm" }
fw-uutils = { path = "../fw-uutils" }
fw-nix = { path = "../fw-nix" }
fw-unified-stack = { path = "../fw-unified-stack" }
fw-wayland-wgpu = { path = "../fw-wayland-wgpu" }
fw-hermes-claw = { path = "../fw-hermes-claw" }
serde_json.workspace = true
tokio.workspace = true
