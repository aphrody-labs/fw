[package]
name = "fw-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Cluster router over the hosts of a build cluster file (cluster/build.toml) or the nodes of a Kubernetes cluster (kube-rs, feature `kube`): consistent-hash proxy choice, KV-cache prefix affinity and prefill/decode scheduling in the style of Pingora, ai-dynamo and llm-d (none is a dependency)"

[features]
default = []
# Kubernetes through kube-rs: node inventory, pods, server-side apply, and k8s nodes as router nodes. Ships `fw-k8s`.
kube = ["dep:kube", "dep:k8s-openapi", "dep:serde-saphyr", "dep:tokio"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
k8s-openapi = { version = "0.29.0", features = ["v1_34"], optional = true }
kube = { version = "5.1.0", default-features = false, features = ["client", "rustls-tls", "ring"], optional = true }
serde-saphyr = { version = "2.2.0", optional = true }
tokio = { workspace = true, features = ["rt", "macros"], optional = true }

[[bin]]
name = "fw-k8s"
path = "src/bin/fw-k8s.rs"
required-features = ["kube"]

[lints]
workspace = true
