  <a class="skip" href="#main">Skip to content</a>

  <div class="app">
    <nav class="rail" aria-label="Sections">
      <button id="new-chat" class="fab" type="button" aria-label="New chat">
        <svg class="icon"><use href="#i-add"/></svg>
      </button>
      <div class="rail-items">
        <a class="dest" href="#/chat" data-view="chat"><span class="dest-pill"><svg class="icon"><use href="#i-chat"/></svg></span><span class="dest-label">Chat</span></a>
        <a class="dest" href="#/tools" data-view="tools"><span class="dest-pill"><svg class="icon"><use href="#i-build"/></svg></span><span class="dest-label">Tools</span></a>
        <a class="dest" href="#/models" data-view="models"><span class="dest-pill"><svg class="icon"><use href="#i-memory"/></svg></span><span class="dest-label">Models</span></a>
        <a class="dest" href="#/system" data-view="system"><span class="dest-pill"><svg class="icon"><use href="#i-dns"/></svg></span><span class="dest-label">System</span></a>
      </div>
      <button id="theme-btn" class="icon-btn rail-foot" type="button" aria-label="Switch light or dark theme">
        <svg class="icon"><use href="#i-dark"/></svg>
      </button>
    </nav>

    <aside id="threads" class="threads" aria-label="Conversations">
      <div class="threads-head">
        <div class="threads-title">
          <h2 class="title-large">Chats</h2>
          <button id="new-chat-drawer" class="btn tonal" type="button"><svg class="icon"><use href="#i-add"/></svg>New chat</button>
        </div>
        <label class="search">
          <svg class="icon"><use href="#i-search"/></svg>
          <input id="conv-search" type="search" placeholder="Search chats" aria-label="Search chats" />
        </label>
      </div>
      <nav id="conv-list" class="conv-list" aria-label="Chat history"></nav>
    </aside>

    <main id="main" class="main" tabindex="-1">
      <section id="view-chat" class="view" data-view="chat" aria-labelledby="chat-title">
        <header class="top-bar">
          <button id="toggle-threads" class="icon-btn" type="button" aria-label="Show chats" aria-controls="threads" aria-expanded="false">
            <svg class="icon"><use href="#i-menu"/></svg>
          </button>
          <h1 id="chat-title" class="title-large ellipsis">New chat</h1>
          <label class="select">
            <span class="sr-only">Model</span>
            <select id="model-select" aria-label="Model"></select>
          </label>
          <button id="settings-btn" class="icon-btn" type="button" aria-label="Chat settings">
            <svg class="icon"><use href="#i-tune"/></svg>
          </button>
        </header>
        <div id="stream" class="stream" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form id="composer" class="composer">
          <button id="tools-btn" class="icon-btn" type="button" aria-label="Run a tool" aria-haspopup="menu" aria-expanded="false" aria-controls="tools-menu">
            <svg class="icon"><use href="#i-add"/></svg>
          </button>
          <div id="tools-menu" class="menu" role="menu" aria-label="Tools on this server" hidden></div>
          <label class="sr-only" for="prompt">Message</label>
          <textarea id="prompt" rows="1" placeholder="Ask fw" autocomplete="off"></textarea>
          <button id="send-btn" class="send" type="submit" aria-label="Send">
            <svg class="icon"><use href="#i-send"/></svg>
          </button>
        </form>
        <p class="composer-hint label-medium">Enter sends, Shift+Enter adds a line. Chats stay in this browser.</p>
      </section>

      <section id="view-tools" class="view page" data-view="tools" aria-labelledby="tools-title" hidden>
        <header class="page-head">
          <h1 id="tools-title" class="headline-large">Tools</h1>
          <p id="tools-sub" class="body-large muted">Loading tools from /mcp</p>
        </header>
        <ul id="tool-list" class="list" role="list"></ul>
      </section>

      <section id="view-models" class="view page" data-view="models" aria-labelledby="models-title" hidden>
        <header class="page-head">
          <h1 id="models-title" class="headline-large">Models</h1>
          <p id="models-sub" class="body-large muted">Loading models from /v1/models</p>
        </header>
        <ul id="model-list" class="list" role="list"></ul>
      </section>

      <section id="view-system" class="view page" data-view="system" aria-labelledby="system-title" hidden>
        <header class="page-head">
          <h1 id="system-title" class="headline-large">System</h1>
          <p id="system-sub" class="body-large muted">Checking /health</p>
          <button id="refresh-system" class="btn tonal" type="button"><svg class="icon"><use href="#i-refresh"/></svg>Check again</button>
        </header>
        <div id="system-body" class="system"></div>
      </section>
    </main>
  </div>
  <div id="scrim" class="scrim" hidden></div>

  <dialog id="settings-dlg" class="dialog" aria-labelledby="settings-title">
    <form method="dialog" class="dialog-body">
      <h2 id="settings-title" class="headline-small">Chat settings</h2>
      <label class="field">
        <span class="label-large">Instructions for fw</span>
        <textarea id="sys-prompt" rows="4"></textarea>
      </label>
      <label class="field">
        <span class="label-large">Creativity <output id="temp-val" for="temp-input"></output></span>
        <input id="temp-input" type="range" min="0" max="2" step="0.1" />
      </label>
      <label class="field">
        <span class="label-large">Chat endpoint</span>
        <input id="api-endpoint" type="text" spellcheck="false" />
      </label>
      <div class="dialog-actions">
        <button id="clear-all" class="btn text danger" type="button">Delete all chats</button>
        <button class="btn filled" value="save" type="submit">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="tool-dlg" class="dialog wide" aria-labelledby="tool-dlg-title">
    <form method="dialog" class="dialog-body" id="tool-form">
      <h2 id="tool-dlg-title" class="headline-small">Run tool</h2>
      <p id="tool-dlg-desc" class="body-medium muted"></p>
      <label class="field">
        <span class="label-large">Arguments (JSON)</span>
        <textarea id="tool-args" rows="6" spellcheck="false" class="code"></textarea>
      </label>
      <pre id="tool-result" class="result" hidden></pre>
      <div class="dialog-actions">
        <button class="btn text" value="close" type="submit">Close</button>
        <button id="tool-run" class="btn filled" type="button"><svg class="icon"><use href="#i-play"/></svg>Run</button>
      </div>
    </form>
  </dialog>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite" hidden></div>
</body>
</html>
