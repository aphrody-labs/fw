[package]
name = "fw-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "Codex-compatible config.toml model for aphrody: ConfigToml, model providers (managed llama-server, Ollama, LM Studio, vLLM, Antigravity, OpenAI, Anthropic, ChatGPT), layered merge (built-ins < Codex-compat < user < project < profile < -c overrides < CLI flags), dotted -c override parsing, and the No-Human-In-The-Loop policy defaults. Pure, no filesystem access in the core, wasm32-safe."

[lib]
name = "fw_config"
path = "src/lib.rs"

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["parse", "display", "serde"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile = { workspace = true, features = ["getrandom"] }


[lints.rust]
non_ascii_idents = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
