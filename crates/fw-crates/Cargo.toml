[package]
name = "fw-crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Crate intelligence engine over crates.io: the daily database dump, the sparse index and the RustSec advisory-db become a ranked, searchable dataset, per-category awesome lists, load-tested framework benchmarks and a project-skeleton generator. One engine behind `fw crates`, `fw serve`, MCP and the Bun plugin; every output is JSON, MDX or text."

[features]
default = ["sync", "live"]
# Database dump and advisory-db ingestion (csv, tar, gzip). CI builds the sync job with only this feature.
sync = ["dep:csv", "dep:tar", "dep:flate2"]
# `info` merges the live sparse-index record from fw-apm (`fw info cargo`).
live = ["dep:fw-apm"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "fw-crates"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
semver = "1.0.28"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
csv = { version = "1.4.0", optional = true }
tar = { version = "0.4.46", optional = true }
flate2 = { workspace = true, optional = true }
fw-apm = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = "0.4.46"

[lints]
workspace = true
