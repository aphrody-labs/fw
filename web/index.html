<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Fw Chat — Native Rust AI &amp; MCP Workspace</title>
  <meta name="description" content="Clean, zero-dependency chat and coding agent interface served by Fw v4.2 with local conversations, Markdown, MCP tools, and model controls." />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
  <link rel="canonical" href="https://fw.aphrody.com/" />
  <meta property="og:title" content="Fw Chat — Native Rust AI &amp; MCP Workspace" />
  <meta property="og:description" content="Native chat and coding agent UI inspired by llama.cpp with local history, Markdown rendering, and in-process MCP tools." />
  <meta property="og:url" content="https://fw.aphrody.com/" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="/app.css" />
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"WebSite","name":"Fw Chat","url":"https://fw.aphrody.com/","potentialAction":{"@type":"SearchAction","target":"https://fw.aphrody.com/?q={search_term_string}","query-input":"required name=search_term_string"}}
  </script>
  <script defer src="/app.js"></script>
</head>
<body>
  <aside aria-label="Conversations">
    <div class="sb-top">
      <button id="new-chat" class="btn btn-primary" type="button">+ New chat</button>
      <input id="conv-search" class="sb-search" type="search" placeholder="Search chats..." aria-label="Search conversations" />
    </div>
    <nav id="conv-list" class="conv-list" aria-label="Chat history"></nav>
    <div class="sb-foot">
      <span><span id="srv-dot" class="dot"></span> <span id="srv-status">Connecting</span></span>
      <div>
        <button id="theme-btn" class="btn btn-ghost" type="button" aria-label="Toggle theme">Theme</button>
        <button id="settings-btn" class="btn btn-ghost" type="button" aria-label="Open settings">Settings</button>
      </div>
    </div>
  </aside>
  <div class="shell">
    <header>
      <div class="hdr-left">
        <button id="toggle-sb" class="btn btn-ghost" type="button" aria-label="Toggle sidebar">&#9776;</button>
        <select id="model-select" class="model-select" aria-label="Select model">
          <option value="fw-ggml-hybrid">fw-ggml-hybrid</option>
        </select>
      </div>
      <div class="hdr-right">
        <span id="mcp-badge" class="mcp-badge">MCP: ...</span>
        <a href="/webgpu" class="btn btn-ghost nav-link">WebGPU</a>
      </div>
    </header>
    <main>
      <div id="stream" class="stream" role="log" aria-live="polite"></div>
    </main>
    <footer class="composer-wrap">
      <form id="composer" class="composer">
        <textarea id="prompt" rows="2" placeholder="Message Fw... (Enter to send, Shift+Enter for newline)" aria-label="Message input"></textarea>
        <div class="composer-bar">
          <select id="tool-select" class="tool-select" aria-label="Optional MCP tool">
            <option value="">Auto (no forced tool)</option>
          </select>
          <button id="send-btn" class="btn btn-primary" type="submit">Send</button>
        </div>
      </form>
    </footer>
  </div>
  <dialog id="settings-dlg" aria-labelledby="dlg-title">
    <h2 id="dlg-title" class="dlg-title">Chat Settings</h2>
    <div class="field">
      <label for="sys-prompt">System prompt</label>
      <textarea id="sys-prompt" rows="3"></textarea>
    </div>
    <div class="field">
      <label for="api-endpoint">Chat Completions endpoint</label>
      <input id="api-endpoint" type="text" value="/v1/chat/completions" />
    </div>
    <div class="field">
      <label for="temp-input">Temperature (<span id="temp-val">0.7</span>)</label>
      <input id="temp-input" type="range" min="0" max="2" step="0.1" value="0.7" />
    </div>
    <div class="dlg-actions">
      <button id="clear-all" class="btn" type="button">Clear history</button>
      <button id="close-dlg" class="btn btn-primary" type="button">Done</button>
    </div>
  </dialog>
</body>
</html>
