# Single declarative product identity for `fw` (zero hardcoded names/paths/prefixes).
name = "fw"
display_name = "fw"
binary = "fw"
version = "4.2.0"
crate_prefix = "fw-"
license = "MIT"
organization = "aphrody-labs"
repository = "https://github.com/aphrody-labs/fw"
homepage = "https://github.com/aphrody-labs/fw"
crates_io_publish_order = [
  "fw-wasm",
  "fw-ggml",
  "fw-compute",
  "fw-cluster",
  "fw-ostd-wasm",
  "fw-uutils",
  "fw-nix",
  "fw-ui-blitz",
  "fw-unified-stack",
  "fw-wayland-wgpu",
  "fw-hermes-claw",
  "fw-proto",
  "fw-bin",
]

[kotlin]
# core/kotlin (Gradle). group: reversed root domain of ay.toml [domains] (aphrody.com) + the product name.
# theme_*: the Aphrody Compose theme owned by aphrody-labs/ay (kotlin/aphrody-theme), published to its GitHub Packages Maven registry.
group = "com.aphrody.fw"
theme_group = "com.aphrody"
theme_artifact = "aphrody-theme"
theme_version = "0.4.0"
theme_registry = "https://maven.pkg.github.com/aphrody-labs/ay"
# Without registry credentials (CI, a clean clone) the theme is built from the public source repository at this pinned commit
# (Gradle property aphrody.ay.checkout, composite build with dependency substitution): bump the rev to take a newer theme.
theme_source = "aphrody-labs/ay"
theme_source_rev = "5339bc337d3de46b27b1d755442756b1c504dc51"

[brand]
# Material 3 source color and scheme variant; fw-m3 derives every color role from these
# (same values as aphrody-labs/ay brand/tokens/m3-tokens.json, which ay generates from this seed).
seed = "#e2dbad"
variant = "tonal-spot"
