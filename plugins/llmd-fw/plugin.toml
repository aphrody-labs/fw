[plugin]
name = "llmd-fw"
version = "4.2.0"
description = "Fairwind native llm-d Endpoint Picker (EPP) prefix-cache, KV-load, and disaggregated P/D scorer aligned with fw-cluster"
protocol = "llm-d.ai/v1/EndpointPickerConfig"
entrypoint = "fw_llmd_scorer:score_endpoints"
pd_selector = "fw_llmd_scorer:select_pd_endpoints"
min_python = "3.12"
dependencies = []

[llmd]
api_version = "llm-d.ai/v1"
kind = "EndpointPickerConfig"
gaie_api_version = "inference.networking.k8s.io/v1"
gaie_kind = "InferencePool"
router_repo = "llm-d/llm-d-router"
scorer_plugins = [
  "precise-prefix-cache-producer",
  "prefix-cache-affinity-filter",
  "token-load-scorer",
  "active-request-scorer",
  "disagg-profile-handler",
]
default_prefill_port = 8000
default_decode_port = 8200
default_epp_metrics_port = 9090

[fairwind]
cluster_crate = "fw-cluster"
prefix_hash = "sha256-128b-hex16"
disaggregated_pd = true
supports_webgpu_draft = true
