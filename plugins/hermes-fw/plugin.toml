[plugin]
id = "hermes-fw"
name = "fw Native Tool & AI Kernel Plugin"
version = "0.1.0"
description = "Exposes Fw CLI (bench/grep/find/ls), ggml_dlpack, and vllm_paged_kv as native Hermes Agent tools."
entrypoint = "fw_hermes_plugin:register"
requires_python = ">=3.12"
license = "MIT OR Apache-2.0"

[compat]
hermes_plugin_api = "v1"
touches_core = false
uv_isolated = true
zero_external_deps = true

[tools]
exposed = [
    "fw_bench",
    "fw_grep",
    "fw_find",
    "fw_ls",
    "fw_ggml_dlpack",
    "fw_vllm_paged_kv",
]
