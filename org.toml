description = "New capability or behavior"

[[labels]]
name = "docs"
color = "0075ca"
description = "Documentation only"

[[labels]]
name = "chore"
color = "ededed"
description = "Maintenance, refactor, tooling, no behavior change"

[[labels]]
name = "security"
color = "b60205"
description = "Vulnerability or hardening; report privately first (SECURITY.md)"

[[labels]]
name = "question"
