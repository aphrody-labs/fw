# One source of truth for the build cluster: hosts, mesh addresses, ports, paths, resource policy.
# Read by configs/claude/scripts/build-cluster.ts; nothing else carries these names or addresses.

[mesh]
cidr = "10.200.77.0/24"

# Hub: runs the sccache-dist scheduler and the NativeLink scheduler.
[scheduler]
host = "fr1"

[sccache_dist]
scheduler_port = 10600
server_port = 10501
version = "0.19.0"
# Built with `--features dist-client dist-server`; target-cpu is the lowest tier of the hosts that run it.
build_target_cpu = "x86-64-v3"
tools_dir = "tools/sccache"          # under the scheduler host's work dir

[nativelink]
scheduler_port = 50051
cas_port = 50061

# Reference build used by `build-cluster.ts bench`: one commit, cold target dir.
[bench]
repo = "aphrody-labs/fw"
package = "fw-bin"
profile_lto = "thin"
codegen_units = 16

[hosts.fr1]
ssh = "fr1"
address = "10.200.77.1"
user = "ubuntu"
work = "/srv/xbuild"
vcpu = 12
target_cpu = "x86-64-v3"
slice = ""                           # dedicated factory host: no cgroup cap
roles = ["scheduler", "server", "nativelink-scheduler", "nativelink-worker"]

[hosts.prd]
ssh = "prd"
address = "10.200.77.5"
user = "builduser"
work = "/srv/build"
vcpu = 8
target_cpu = "znver4"
# Production shares the host: build bursts run in this slice (CPUWeight 15, MemoryHigh 12G) so services keep priority.
slice = "fairwind-build-worker.slice"
roles = ["server", "nativelink-worker"]
