# The edge estate: the single source of names for Cloudflare zones, DNS, Worker routes and domains, Workers, R2 buckets and services,
# with the OVH (registrar, mail) and Hostinger (prd VPS) facts read by `fw estate check --providers`.
#
#   fw estate plan     diff live state against this file, write estate.plan.json
#   fw estate apply    execute the committed plan (tracked, unmodified, equal to a fresh plan)
#   fw estate check    best-practice findings, each with its source document
#
# It replaces the zone cartography of ay/packages/cf-control-plane/cf.toml (records, routes, custom domains, zone settings): cf.toml kept
# one table per record kind and `${host:...}` placeholders that only its TypeScript reconciler understood, and it declared records the
# zones no longer hold or should not (three private .mesh SRV names). The records here carry the live values; tunnels and Workers are
# named, never identified by UUID. cf.toml keeps the FinOps and policy tables until they move here.
# Deletions are the records, routes and domains a zone no longer lists; they run only from a committed plan.
# Record syntax: "TYPE name [proxied] [prio=N] [ttl=N] | content"; content `tunnel:<name>` is that tunnel's cfargotunnel.com name and
# `worker` the placeholder address of a Worker-only hostname.

[estate]
schema = 1
account_env = "CLOUDFLARE_ACCOUNT_ID"
token_env = "CLOUDFLARE_API_TOKEN"
hostinger_token_env = "HOSTINGER_API_TOKEN"
ovh_config_env = "OVH_CONFIG"
cluster_file = "build.toml"
plan_file = "estate.plan.json"
compat_max_age_days = 120

# Best practices, each with the document it comes from. `check` prints the source next to the finding that carries the same id.
[practice."zone.dnssec"]
rule = "DNSSEC active on every delegated zone, DS record published at the registrar"
source = "https://developers.cloudflare.com/dns/zone-setups/dnssec/"
[practice."dns.caa"]
rule = "CAA at the apex limits which CAs may issue"
source = "https://developers.cloudflare.com/ssl/edge-certificates/caa-records/"
[practice."dns.spf"]
rule = "SPF on every zone that receives mail"
source = "https://developers.cloudflare.com/dns/manage-dns-records/reference/dns-record-types/#txt"
[practice."dns.dmarc"]
rule = "DMARC on every zone that receives mail, reports to a mailbox we read"
source = "https://developers.cloudflare.com/dmarc-management/"
[practice."zone.hsts"]
rule = "HSTS with includeSubDomains and preload"
source = "https://developers.cloudflare.com/ssl/edge-certificates/additional-options/http-strict-transport-security/"
[practice."dns.dead-origin"]
rule = "a proxied hostname must reach a Worker route, a Worker custom domain or a tunnel ingress rule; otherwise visitors get 522 or the catch-all 404"
source = "https://developers.cloudflare.com/support/troubleshooting/http-status-codes/cloudflare-5xx-errors/error-522/"
[practice."dns.wildcard"]
rule = "no wildcard record without a route that serves it"
source = "https://developers.cloudflare.com/dns/manage-dns-records/reference/wildcard-dns-records/"
[practice."dns.private-target"]
rule = "public DNS carries no private names or addresses"
source = "https://developers.cloudflare.com/dns/manage-dns-records/reference/dns-record-types/"
[practice."worker.observability"]
rule = "Workers Logs on, head sampling set per profile"
source = "https://developers.cloudflare.com/workers/observability/logs/workers-logs/"
[practice."worker.compat-date"]
rule = "compatibility_date recent so the runtime fixes apply"
source = "https://developers.cloudflare.com/workers/configuration/compatibility-dates/"
[practice."worker.dangling-binding"]
rule = "every binding resolves to an existing resource"
source = "https://developers.cloudflare.com/workers/runtime-apis/bindings/"
[practice."r2.abort-multipart"]
rule = "lifecycle rule aborting incomplete multipart uploads"
source = "https://developers.cloudflare.com/r2/buckets/object-lifecycles/"
[practice."token.no-expiry"]
rule = "API tokens carry an expiry and the least scope their job needs"
source = "https://developers.cloudflare.com/fundamentals/api/get-started/create-token/"
[practice."registrar.ds-missing"]
rule = "the DS record Cloudflare generates is published at the registrar"
source = "https://developers.cloudflare.com/dns/zone-setups/dnssec/enable-dnssec/"
[practice."vps.firewall"]
rule = "a provider firewall in front of every VPS"
source = "https://developers.hostinger.com/"

# Zone settings applied to every zone (a zone table may override a key).
# min_tls_version stays 1.2 except where the 7-day clientSSLMap shows under 1% of requests on TLS 1.2 (aphrody.app: 564 of 155,579).
[zone_defaults]
ssl = "strict"
always_use_https = "on"
automatic_https_rewrites = "on"
http3 = "on"
"0rtt" = "on"
tls_1_3 = "zrt"
early_hints = "on"
brotli = "on"
opportunistic_encryption = "on"
min_tls_version = "1.2"
security_header = { strict_transport_security = { enabled = true, max_age = 63072000, include_subdomains = true, preload = true, nosniff = true } }

