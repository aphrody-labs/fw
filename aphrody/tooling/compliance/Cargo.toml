[package]
name = "compliance"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
doctest = false

[features]
octo-client = ["dep:octocrab", "dep:jsonwebtoken", "dep:serde_json", "dep:tokio"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
derive_more = { workspace = true, features = ["display"] }
futures.workspace = true
itertools.workspace = true
jsonwebtoken = { workspace = true, features = ["use_pem"], optional = true }
octocrab = { workspace = true, features = [
    "default-client",
    "jwt-aws-lc-rs",
    "retry",
    "rustls",
    "rustls-aws-lc-rs",
    "stream",
    "timeout"
], optional = true }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
semver.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"], optional = true }
tokio = { version = "1.54.1", optional = true }
[dev-dependencies]
indoc.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
tokio = { version = "1.54.1", features = ["rt", "macros"] }