[package]
name = "crates_io_client"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "crates.io <https://crates.io> API client"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
test-support = []

[lib]
path = "src/crates_io_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
derive_more = { workspace = true, features = ["display"] }
futures.workspace = true
http_client.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
semver.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
smol.workspace = true
thiserror.workspace = true
url = { version = "2.5.9", features = ["serde"] }
[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
