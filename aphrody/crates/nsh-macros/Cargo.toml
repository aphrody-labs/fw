[package]
name = "nsh-macros"
description = "Derive macros of nsh's Rust components: props, prop enums, events and component metadata."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
proc-macro = true

[dependencies]
imagesize.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true
ttf-parser.workspace = true
# WOFF and WOFF2 fonts' family names (`asset!`), read from what they hold.
wuff.workspace = true

[dev-dependencies]
# The integration tests use the macros as an app's crate does, through
# nsh-core's re-exports and the `__private` items they expand to.
# By path only, so `cargo publish` drops it: nsh-core depends on this crate,
# which could not be packaged until nsh-core is on crates.io.
nsh-core.workspace = true