[package]
name = "extension_host"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/extension_host.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-tar.workspace = true
async-trait.workspace = true
client.workspace = true
cloud_api_types.workspace = true
collections.workspace = true
dap.workspace = true
extension.workspace = true
fs.workspace = true
futures.workspace = true
github_releases.workspace = true
gpui.workspace = true
gpui_tokio.workspace = true
http_client.workspace = true
language = { workspace = true, features = ["wasm-grammars"] }
log.workspace = true
lsp.workspace = true
moka.workspace = true
node_runtime.workspace = true
paths.workspace = true
project.workspace = true
remote.workspace = true
release_channel.workspace = true
semver.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
settings.workspace = true
sha2 = { version = "0.10" }
task.workspace = true
telemetry.workspace = true
tempfile.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse", "display"] }
tracing.workspace = true
url = { version = "2.5.9" }
util.workspace = true
wasmparser.workspace = true
wasmtime-wasi.workspace = true
wasmtime.workspace = true
ztracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor.workspace = true
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
language_extension.workspace = true
parking_lot.workspace = true
project = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
reqwest_client.workspace = true
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
theme_extension.workspace = true
zlog.workspace = true

[[bench]]
name = "extension_compilation_benchmark"
harness = false

[package.metadata.cargo-shear]
ignored = ["tracing"]
