[package]
name = "nsh-package"
description = "Signed app packages (.nshpkg), two-level signing keys, revocation lists and the trust store."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[dependencies]
nsh-core.workspace = true
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
sha2 = { version = "0.10" }
base64 = { version = "0.22" }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
thiserror.workspace = true

# Signing keys are made by the CLI; WebAssembly only verifies packages.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
