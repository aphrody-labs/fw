[package]
name = "nsh-linux-host"
description = "Development host app (GTK 4) that runs a nsh bundle on Linux."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["webview"]
# Web views (WebKitGTK 6.0): `libwebkitgtk-6.0-dev` to build; off, a web
# view shows a placeholder.
webview = ["nsh-platform-linux/webview"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-base.workspace = true
nsh-platform-linux = { workspace = true, features = ["dev"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }
