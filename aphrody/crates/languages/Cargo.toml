[package]
name = "languages"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
doctest = false

[features]
test-support = [
    "load-grammars"
]
load-grammars = [
    "grammars/load-grammars",
    "tree-sitter",
]

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
async-fs.workspace = true
async-tar.workspace = true
async-trait.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
collections.workspace = true
futures.workspace = true
github_releases.workspace = true
globset.workspace = true
gpui.workspace = true
grammars.workspace = true
itertools.workspace = true
json_schema_store.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
node_runtime.workspace = true
parking_lot.workspace = true
pet-conda.workspace = true
pet-core.workspace = true
pet-fs.workspace = true
pet-poetry.workspace = true
pet-reporter.workspace = true
pet-virtualenv.workspace = true
pet.workspace = true
project.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
rope.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
settings.workspace = true
smallvec.workspace = true
semver.workspace = true
smol.workspace = true
snippet.workspace = true
task.workspace = true
terminal.workspace = true
theme.workspace = true
tree-sitter = { workspace = true, optional = true }
url = { version = "2.5.9" }
util.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
indoc.workspace = true
language = { workspace = true, features = ["test-support"] }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
tempfile.workspace = true
settings = { workspace = true, features = ["test-support"] }
theme = { workspace = true, features = ["test-support"] }
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-css.workspace = true
tree-sitter-go.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter = { workspace = true, features = ["wasm"] }
unindent.workspace = true
