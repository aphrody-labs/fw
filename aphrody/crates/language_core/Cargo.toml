[package]
name = "language_core"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/language_core.rs"
doctest = false

[dependencies]
anyhow.workspace = true
bitflags.workspace = true
collections.workspace = true
gpui_shared_string.workspace = true
gpui_util.workspace = true
log.workspace = true
lru.workspace = true
parking_lot.workspace = true
path.workspace = true
regex = { version = "1.13.2", default-features = true, features = ["std", "perf"] }
schemars = { workspace = true, features = ["derive"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
smallvec.workspace = true
strum.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
tree-sitter.workspace = true
