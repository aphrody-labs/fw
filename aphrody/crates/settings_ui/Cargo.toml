[package]
name = "settings_ui"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/settings_ui.rs"
doctest = false

[features]
default = []
test-support = []

[dependencies]
agent.workspace = true
agent_settings.workspace = true
agent_skills.workspace = true
anyhow.workspace = true
audio.workspace = true
client.workspace = true
cloud_api_types.workspace = true
component.workspace = true
codestral.workspace = true
collections.workspace = true
context_server.workspace = true
copilot.workspace = true
copilot_ui.workspace = true
cpal.workspace = true
edit_prediction.workspace = true
edit_prediction_ui.workspace = true
editor.workspace = true
extension.workspace = true
extension_host.workspace = true
fs.workspace = true
feature_flags.workspace = true
futures.workspace = true
fuzzy.workspace = true
gpui.workspace = true
heck.workspace = true
http_client.workspace = true
http_proxy.workspace = true
itertools.workspace = true
language.workspace = true
language_model.workspace = true
log.workspace = true
menu.workspace = true
paths.workspace = true
picker.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
platform_title_bar.workspace = true
project.workspace = true
release_channel.workspace = true
rodio.workspace = true
schemars.workspace = true
search.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
shell_command_parser.workspace = true
strum.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
url = { version = "2.5.9" }
ui_input.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
zed_credentials_provider.workspace = true

[dev-dependencies]
credentials_provider = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
language_models = { workspace = true, features = ["test-support"] }
paths.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
project = { workspace = true, features = ["test-support"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["component"]
