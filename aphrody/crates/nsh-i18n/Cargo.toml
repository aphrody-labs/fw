[package]
name = "nsh-i18n"
description = "Native Shell's languages: the language data apps format numbers and dates with, and the app's translations read with rust-i18n."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
# Reading an app's translations (`locales/`) with rust-i18n: the toolchain's
# part (the bundler, the CLI). Without it the crate is the language data
# alone, which the runtime formats with.
build = ["dep:serde_json", "dep:rust-i18n-support"]

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"], optional = true }
rust-i18n-support = { workspace = true, features = ["codegen"], optional = true }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }