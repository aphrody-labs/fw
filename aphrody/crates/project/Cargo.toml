[package]
name = "project"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/project.rs"
doctest = false

[[test]]
name = "integration"
required-features = ["test-support"]
path = "tests/integration/project_tests.rs"

[features]
test-support = [
    "buffer_diff/test-support",
    "client/test-support",
    "language/test-support",
    "remote/test-support",
    "settings/test-support",
    "snippet_provider/test-support",
    "text/test-support",
    "prettier/test-support",
    "worktree/test-support",
    "gpui/test-support",
    "dap/test-support",
]

[dependencies]
aho-corasick.workspace = true
anyhow.workspace = true
askpass.workspace = true
async-channel.workspace = true
async-lock.workspace = true
async-trait.workspace = true
base64 = { version = "0.22" }
buffer_diff.workspace = true
client.workspace = true
clock.workspace = true
collections.workspace = true
context_server.workspace = true
credentials_provider.workspace = true
dap.workspace = true
encoding_rs.workspace = true
extension.workspace = true
fancy-regex.workspace = true
file_content.workspace = true
fs = { workspace = true, features = ["proto"] }
futures.workspace = true
fuzzy.workspace = true
fuzzy_nucleo.workspace = true
git.workspace = true
git_hosting_providers.workspace = true
github_releases.workspace = true
globset.workspace = true
gpui.workspace = true
http_client.workspace = true
image.workspace = true
indexmap.workspace = true
itertools.workspace = true
language.workspace = true
log.workspace = true
lsp.workspace = true
markdown.workspace = true
node_runtime.workspace = true
parking_lot.workspace = true
path.workspace = true
paths.workspace = true
percent-encoding.workspace = true
postage.workspace = true
prettier.workspace = true
rand.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
release_channel.workspace = true
remote.workspace = true
rpc.workspace = true
schemars.workspace = true
semver.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
time.workspace = true
sha2 = { version = "0.10" }
shellexpand.workspace = true
smallvec.workspace = true
smol.workspace = true
snippet.workspace = true
snippet_provider.workspace = true
sum_tree.workspace = true
task.workspace = true
tempfile.workspace = true
terminal.workspace = true
text.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
tracing.workspace = true
url = { version = "2.5.9" }
usvg.workspace = true
util.workspace = true
watch.workspace = true
wax.workspace = true
which.workspace = true
worktree.workspace = true
zed_credentials_provider.workspace = true
zeroize.workspace = true
zlog.workspace = true
ztracing.workspace = true

[dev-dependencies]
client = { workspace = true, features = ["test-support"] }
collections = { workspace = true, features = ["test-support"] }
context_server = { workspace = true, features = ["test-support"] }
buffer_diff = { workspace = true, features = ["test-support"] }
dap = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
language = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
prettier = { workspace = true, features = ["test-support"] }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
project = {workspace = true, features = ["test-support"]}
rpc = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
snippet_provider = { workspace = true, features = ["test-support"] }
unindent.workspace = true
util = { workspace = true, features = ["test-support"] }
worktree = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["tracing"]
