[package]
name = "edit_prediction"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/edit_prediction.rs"
doctest = false

[features]
cli-support = []

[dependencies]
ai_onboarding.workspace = true
anyhow.workspace = true
heapless.workspace = true
buffer_diff.workspace = true
client.workspace = true
clock.workspace = true
cloud_api_client.workspace = true
cloud_api_types.workspace = true
cloud_llm_client = { workspace = true, features = ["predict-edits"] }
collections.workspace = true
copilot.workspace = true
copilot_ui.workspace = true
credentials_provider.workspace = true
db.workspace = true
edit_prediction_types.workspace = true
edit_prediction_context.workspace = true
edit_prediction_metrics.workspace = true
feature_flags.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
gpui.workspace = true
indoc.workspace = true
itertools.workspace = true
language.workspace = true
language_model.workspace = true
log.workspace = true
lsp.workspace = true
menu.workspace = true
ollama.workspace = true
open_ai.workspace = true
postage.workspace = true
project.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
release_channel.workspace = true
semver.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
strum.workspace = true
telemetry.workspace = true
telemetry_events.workspace = true
text.workspace = true
thiserror.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse", "display"] }
ui.workspace = true
util.workspace = true
uuid = { version = "1.29.3", features = ["serde"] }
workspace.workspace = true
worktree.workspace = true
zed_actions.workspace = true
zed_credentials_provider.workspace = true
zeta_prompt.workspace = true
zstd.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
languages = { workspace = true, features = ["load-grammars"] }
node_runtime.workspace = true
clock = { workspace = true, features = ["test-support"] }
cloud_llm_client = { workspace = true, features = ["test-support"] }
ctor.workspace = true
indoc.workspace = true
language = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
lsp.workspace = true
parking_lot.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
project = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }

zlog.workspace = true

[[bench]]
name = "kept_rate"
harness = false

[[bench]]
name = "ts_error_count"
harness = false
