[package]
name = "cli"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/cli.rs"
doctest = false

[[bin]]
name = "cli"
path = "src/main.rs"
required-features = ["cli"]

[features]
no-bundled-uninstall = ["cli"]
default = ["cli"]
cli = [
    "dep:askpass",
    "dep:clap",
    "dep:clap_complete",
    "dep:clap_complete_nushell",
    "dep:console",
    "dep:core-foundation",
    "dep:core-services",
    "dep:dialoguer",
    "dep:exec",
    "dep:fork",
    "dep:parking_lot",
    "dep:paths",
    "dep:plist",
    "dep:rayon",
    "dep:release_channel",
    "dep:tempfile",
    "dep:util",
    "dep:walkdir",
    "dep:windows",
    "dep:windows_resources",
]

[dependencies]
anyhow.workspace = true
askpass = { workspace = true, optional = true }
brand.workspace = true
clap = { version = "4.6.9", features = ["derive", "wrap_help"], optional = true }
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
collections.workspace = true
console = { workspace = true, optional = true }
dialoguer = { workspace = true, optional = true }
ipc-channel.workspace = true
parking_lot = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
release_channel = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["rc", "derive"] }
util = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
walkdir = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
util = { workspace = true, features = ["test-support"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
exec = { workspace = true, optional = true }
fork = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true, optional = true }
core-services = { workspace = true, optional = true }
plist = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["std", "Data_Xml_Dom", "Foundation_Numerics", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Imaging_D2D", "Win32_Media_Audio", "Win32_Media_Audio_XAudio2", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"], optional = true }
[target.'cfg(target_os = "windows")'.build-dependencies]
windows_resources = { workspace = true, optional = true }
