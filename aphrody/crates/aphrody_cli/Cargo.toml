[package]
name = "aphrody_cli"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_cli.rs"
doctest = false

[[bin]]
name = "gpui-wgpu"
path = "src/main.rs"

[[bin]]
name = "aphrody-cli"
path = "src/aphrody_cli_bin.rs"

[dependencies]
anyhow.workspace = true
aphrody = { workspace = true, features = ["minimal", "craft", "pilot", "store", "installer", "cosmic"] }
aphrody_craft.workspace = true
aphrody_design.workspace = true
aphrody_google = { workspace = true, features = ["native"] }
aphrody_installer.workspace = true
aphrody_media = { workspace = true, features = ["video-encode"] }
aphrody_pilot.workspace = true
aphrody_session.workspace = true
aphrody_store.workspace = true
brand.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
cosmic_gpui.workspace = true
flate2.workspace = true
image.workspace = true
naga = { workspace = true, features = ["wgsl-in", "wgsl-out", "glsl-out", "hlsl-out", "msl-out", "spv-out"] }
pollster.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = { version = "0.10" }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
wasm-encoder.workspace = true
wasmparser.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl", "dx12", "metal", "vulkan", "gles"] }

[dev-dependencies]
tempfile.workspace = true
