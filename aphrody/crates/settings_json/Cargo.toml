[package]
name = "settings_json"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/settings_json.rs"
doctest = false

[features]
default = ["editing"]
editing = ["dep:tree-sitter", "dep:tree-sitter-json", "dep:serde_json"]

[dependencies]
anyhow.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"], optional = true }
serde_json_lenient.workspace = true
serde_path_to_error.workspace = true

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
unindent.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }