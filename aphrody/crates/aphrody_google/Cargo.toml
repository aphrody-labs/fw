[package]
name = "aphrody_google"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Pure-Rust Google Cloud, OAuth 2.0/gcloud, Vertex AI & Gemini multimodal, Google Workspace Discovery, and dual YouTube / YouTube Music (InnerTube + Data API v3) engine."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_google.rs"
doctest = false

[features]
default = ["native"]
native = ["dep:ureq", "dep:oauth_callback_server"]
wasm = []

[dependencies]
anyhow.workspace = true
base64 = { version = "0.22" }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = { version = "0.10" }
url = { version = "2.5.9" }
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
oauth_callback_server = { workspace = true, optional = true }
ureq = { version = "3.5.2", features = ["platform-verifier"], optional = true }