[package]
name = "git"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/git.rs"
doctest = false

[features]
test-support = ["rand", "gpui/test-support"]

[dependencies]
anyhow.workspace = true
askpass.workspace = true
async-trait.workspace = true
collections.workspace = true
derive_more.workspace = true
file_content.workspace = true
gpui.workspace = true
http_client.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
rand = { workspace = true, optional = true }
rope.workspace = true
schemars.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
smallvec.workspace = true
async-channel.workspace = true
smol.workspace = true
sum_tree.workspace = true
text.workspace = true
thiserror.workspace = true
time.workspace = true
url = { version = "2.5.9" }
urlencoding.workspace = true
util.workspace = true
uuid = { version = "1.29.3", features = ["serde"] }
futures.workspace = true
ztracing.workspace = true

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
text = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
rand.workspace = true
