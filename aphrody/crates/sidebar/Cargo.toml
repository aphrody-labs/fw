[package]
name = "sidebar"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/sidebar.rs"
doctest = false

[features]
default = []

[dependencies]
acp_thread.workspace = true
action_log.workspace = true
async-channel.workspace = true
agent.workspace = true
agent-client-protocol.workspace = true
agent_settings.workspace = true
agent_ui = { workspace = true, features = ["audio"] }
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
editor.workspace = true
feature_flags.workspace = true
fs.workspace = true
git.workspace = true
gpui.workspace = true
itertools.workspace = true
language_model.workspace = true
log.workspace = true
menu.workspace = true
notifications.workspace = true
platform_title_bar.workspace = true
project.workspace = true
recent_projects.workspace = true
remote.workspace = true
remote_connection.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
unicode-segmentation.workspace = true
util.workspace = true
workspace.workspace = true
git_ui_core.workspace = true
zed_actions.workspace = true

[dev-dependencies]
acp_thread = { workspace = true, features = ["test-support"] }
agent = { workspace = true, features = ["test-support"] }
agent_ui = { workspace = true, features = ["test-support"] }
editor.workspace = true
extension.workspace = true
language = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
semver.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
prompt_store.workspace = true
recent_projects = { workspace = true, features = ["test-support"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
fs = { workspace = true, features = ["test-support"] }
git.workspace = true
gpui = { workspace = true, features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
clock = { workspace = true, features = ["test-support"] }
db = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
node_runtime = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
remote_server = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
