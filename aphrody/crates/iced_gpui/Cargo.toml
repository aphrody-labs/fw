[package]
name = "iced_gpui"
version = "0.14.0"
edition.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Iced Elm-style reactive runtime and libcosmic COSMIC RON theme adapter placed cleanly alongside GPUI and aligned to workspace WGPU v30 + AccessKit 0.25."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/iced_gpui.rs"
doctest = false

[features]
default = []
cosmic-theme = []
wgpu = ["dep:wgpu"]

[dependencies]
anyhow.workspace = true
aphrody_ui.workspace = true
gpui.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
ui.workspace = true
web-time.workspace = true
wgpu = { workspace = true, optional = true }
