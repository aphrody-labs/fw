[package]
name = "theme_importer"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "theme-importer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
collections.workspace = true
gpui.workspace = true
indexmap.workspace = true
log.workspace = true
palette.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
simplelog = { workspace = true, features = ["termcolor"] }
strum.workspace = true
theme.workspace = true
theme_settings.workspace = true
vscode_theme.workspace = true
