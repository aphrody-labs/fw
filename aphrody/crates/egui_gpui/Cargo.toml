[package]
name = "egui_gpui"
version = "0.37.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Native GPUI + WGPU v30 bridge for egui 0.37, Craft Studio controls, and Google Design Material 3 Expressive themes."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/egui_gpui.rs"
doctest = false

[[example]]
name = "google_design_egui"
path = "examples/google_design_egui.rs"

[features]
default = []
wgpu = ["dep:egui-wgpu"]

[dependencies]
anyhow.workspace = true
ecolor.workspace = true
egui = { workspace = true, features = ["bytemuck", "default_fonts", "serde"] }
egui-wgpu = { workspace = true, optional = true }
egui_extras.workspace = true
emath.workspace = true
epaint.workspace = true
gpui.workspace = true
aphrody_ui.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
web-time.workspace = true
