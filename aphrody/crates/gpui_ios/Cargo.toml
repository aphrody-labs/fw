[package]
name = "gpui_ios"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/gpui_ios.rs"
crate-type = ["staticlib", "rlib"]
doctest = false

[[example]]
name = "ios"
path = "examples/ios.rs"
test = false
bench = false

[[test]]
name = "text_input"
path = "tests/text_input.rs"
harness = false

[features]
runtime_shaders = ["gpui_apple/runtime_shaders"]


[target.'cfg(target_os = "ios")'.dev-dependencies]
gpui_platform.workspace = true
objc2-ui-kit = { workspace = true, features = ["UIConversationContext"] }
slotmap.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
anyhow.workspace = true
block2.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_apple = { workspace = true, features = ["font-kit"] }
log.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSThread", "NSOperation", "NSUserActivity", "block2"] }
objc2-ui-kit.workspace = true
objc2-quartz-core = { workspace = true, features = ["CADisplayLink"] }
objc2-core-foundation = { workspace = true, default-features = true }
parking_lot.workspace = true
raw-window-handle.workspace = true
uuid = { version = "1.29.3", features = ["serde", "v5"] }