[package]
name = "benchmarks"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/benchmarks.rs"
doctest = false
test = false

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[dependencies]
rand.workspace = true

[dev-dependencies]
action_log.workspace = true
agent = { workspace = true, features = ["test-support"] }
agent_settings.workspace = true
assets.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }
editor = { workspace = true, features = ["test-support"] }
futures.workspace = true
gpui = { workspace = true, features = ["bench-support"] }
gpui_platform = { workspace = true, features = ["bench-support", "font-kit"] }
indoc.workspace = true
itertools.workspace = true
language = { workspace = true, features = ["test-support"] }
language_model = { workspace = true, features = ["test-support"] }
lsp = { workspace = true, features = ["test-support"] }
markdown.workspace = true
multi_buffer.workspace = true
project = { workspace = true, features = ["test-support"] }
prompt_store.workspace = true
rpc.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings = { workspace = true, features = ["test-support"] }
text.workspace = true
theme = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
ui.workspace = true
util = { workspace = true, features = ["test-support"] }
zed_actions.workspace = true

[package.metadata.cargo-shear]
ignored = ["gpui_platform"]

[[bench]]
name = "editor_render"
harness = false

[[bench]]
name = "display_map"
harness = false

[[bench]]
name = "edit_file_tool"
harness = false

[[bench]]
name = "markdown_renderer"
harness = false
