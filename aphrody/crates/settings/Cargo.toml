[package]
name = "settings"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/settings.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "fs/test-support"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
ec4rs.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
inventory.workspace = true
log = { workspace = true, features = ["kv_unstable_std"] }
migrator.workspace = true
paths.workspace = true
release_channel.workspace = true
schemars.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
settings_content.workspace = true
settings_json = { workspace = true, features = ["editing"] }
settings_macros.workspace = true
smallvec.workspace = true
util.workspace = true

[dev-dependencies]
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
zlog.workspace = true

indoc.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
unindent.workspace = true
