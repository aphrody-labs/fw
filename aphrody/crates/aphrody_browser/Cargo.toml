[package]
name = "aphrody_browser"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Complete Chromium //ui/views browser in GPUI fused with ayvpn per-tab WireGuard/Mullvad routing, anomalyco/browse real-browser MCP relay, Kitesurf/Servo/Blink escalation, and the Full WebGPU OS (ai-os + cloudflare-os + nysh)."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_browser.rs"
doctest = false

[features]
default = ["gpui-views"]
gpui-views = ["dep:gpui", "dep:aphrody_ui", "dep:ui"]
vpn-daemon = ["dep:aphrody_vpn"]

[dependencies]
anyhow.workspace = true
aphrody_pilot.workspace = true
aphrody_ui = { workspace = true, optional = true }
aphrody_vpn = { workspace = true, optional = true }
browser-browse.workspace = true
browser-detect.workspace = true
browser-engine.workspace = true
browser-views.workspace = true
browser-vpn.workspace = true
gpui = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
ui = { workspace = true, optional = true }
url = { version = "2.5.9" }