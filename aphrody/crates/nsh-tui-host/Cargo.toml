[package]
name = "nsh-tui-host"
description = "Development host that runs a prebuilt Native Shell bundle in a terminal."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[dependencies]
nsh-core.workspace = true
base64 = { version = "0.22" }
nsh-platform-tui = { workspace = true, features = ["js", "run-app", "dev"] }
nsh-engine.workspace = true
ratatui-core.workspace = true
ratatui-crossterm.workspace = true
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
log.workspace = true

[dev-dependencies]
nsh-base.workspace = true
nsh-dev = { workspace = true, features = ["server"] }
nsh-bundler = { workspace = true, features = ["bundle"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# Its bounded poll reader returns on EOF; the default mio reader can spin inside read.
crossterm = { workspace = true, features = ["use-dev-tty"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }