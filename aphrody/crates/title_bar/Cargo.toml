[package]
name = "title_bar"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/title_bar.rs"
doctest = false

[features]
default = []
collab = ["dep:call", "dep:channel", "dep:livekit_client", "gpui/screen-capture"]

test-support = [
    "collab",
    "call/test-support",
    "client/test-support",

    "gpui/test-support",

    "project/test-support",
    "remote/test-support",
    "util/test-support",
    "workspace/test-support",
    "recent_projects/test-support",
]

[dependencies]
agent_settings.workspace = true
anyhow.workspace = true
auto_update.workspace = true
fs.workspace = true
platform_title_bar.workspace = true
call = { workspace = true, optional = true }
channel = { workspace = true, optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
client.workspace = true
cloud_api_types.workspace = true
command_palette_hooks.workspace = true
db.workspace = true

git_ui_core.workspace = true
gpui.workspace = true
icons.workspace = true
livekit_client = { workspace = true, optional = true }
path.workspace = true
project.workspace = true
recent_projects.workspace = true
remote.workspace = true
remote_connection.workspace = true
rpc.workspace = true
semver.workspace = true
schemars.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
settings.workspace = true
smallvec.workspace = true
telemetry.workspace = true
theme.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true
arrayvec.workspace = true

[dev-dependencies]
call = { workspace = true, features = ["test-support"] }
client = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
recent_projects = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
rpc = { workspace = true, features = ["test-support"] }
semver.workspace = true
settings = { workspace = true, features = ["test-support"] }
theme_settings.workspace = true
util = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
