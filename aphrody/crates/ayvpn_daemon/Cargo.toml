[package]
name = "ayvpn-daemon"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "The Aphrody VPN daemon: Mullvad's daemon embedded in one process, a client for its management IPC, and C ABI v1 bindings."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "ayvpn"
path = "src/main.rs"

[dependencies]
mullvad-api.workspace = true
mullvad-daemon.workspace = true
mullvad-management-interface.workspace = true
mullvad-paths.workspace = true
mullvad-types.workspace = true
tokio = { version = "1.54.1" }