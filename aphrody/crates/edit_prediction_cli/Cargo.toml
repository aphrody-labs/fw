[package]
name = "edit_prediction_cli"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/lib.rs"

[[bin]]
name = "ep"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
anthropic.workspace = true
http_client.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
client.workspace = true
cloud_llm_client = { workspace = true, features = ["predict-edits"] }
collections.workspace = true
db.workspace = true
debug_adapter_extension.workspace = true
dirs.workspace = true
extension.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui_tokio.workspace = true
indoc.workspace = true
language.workspace = true
language_extension.workspace = true
language_model.workspace = true
language_models.workspace = true
languages = { workspace = true, features = ["load-grammars"] }
libc.workspace = true
log.workspace = true
node_runtime.workspace = true
open_ai.workspace = true

paths.workspace = true
project.workspace = true
prompt_store.workspace = true
release_channel.workspace = true
reqwest_client.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
shellexpand.workspace = true
smol.workspace = true
sqlez.workspace = true
strum.workspace = true
sqlez_macros.workspace = true
terminal_view.workspace = true
util.workspace = true
watch.workspace = true
edit_prediction = { workspace = true, features = ["cli-support"] }
edit_prediction_context.workspace = true
edit_prediction_metrics.workspace = true
telemetry_events.workspace = true
wasmtime.workspace = true
zeta_prompt.workspace = true
rand.workspace = true
similar.workspace = true
flate2.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
gaoya.workspace = true

# Wasmtime is included as a dependency in order to enable the same
# features that are enabled in Zed.
#
# If we don't enable these features we get crashes when creating
# a Tree-sitter WasmStore.
[features]
dynamic_prompts = []

[package.metadata.cargo-shear]
ignored = ["wasmtime", "workspace"]

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
indoc.workspace = true
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
project = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
workspace = { workspace = true, features = ["test-support"] }
