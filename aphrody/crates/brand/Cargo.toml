[package]
name = "brand"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Compile-time and runtime product identity constants generated from root product.toml with full Zed ecosystem compatibility."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/brand.rs"
doctest = false

[features]
default = []
serde = ["dep:serde", "fw-m3/serde"]
schemars = ["dep:schemars", "fw-m3/schemars"]

[dependencies]
fw-m3.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"], optional = true }
schemars = { workspace = true, optional = true }

[build-dependencies]
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }