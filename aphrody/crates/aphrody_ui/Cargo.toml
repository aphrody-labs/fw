[package]
name = "aphrody_ui"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Unified GPUI OS toolkit combining Iced-style reactive programs, Egui-style immediate inspectors/charts, and Libcosmic theme/config/nav abstractions with WCAG AA verification."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_ui.rs"
doctest = false

[features]
default = []
test-support = ["gpui/test-support", "theme/test-support"]

[dependencies]
anyhow.workspace = true
backdrop-blur-core.workspace = true
brand = { workspace = true, features = ["serde"] }
dirs.workspace = true
aphrody_design.workspace = true
gpui.workspace = true
log.workspace = true
lucide-static-svg.workspace = true
material-colors.workspace = true
md-icons.workspace = true
aphrody_session.workspace = true
palette.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
syntax_theme.workspace = true
theme.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
ui.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
raw-window-handle.workspace = true
window-vibrancy.workspace = true
