[package]
name = "remote"
description = "Client-side subsystem for remote editing"
edition.workspace = true
version = "0.1.0"
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/remote.rs"
doctest = false

[features]
default = []
build-remote-server-binary = []
test-support = ["fs/test-support"]

[dependencies]
anyhow.workspace = true
askpass.workspace = true
async-trait.workspace = true
base64 = { version = "0.22" }
collections.workspace = true
fs = { workspace = true, optional = true }
futures.workspace = true
gpui.workspace = true
log = { workspace = true, features = ["kv_unstable_std"] }
parking_lot.workspace = true
paths.workspace = true
release_channel.workspace = true
rpc = { workspace = true, features = ["gpui"] }
schemars.workspace = true
semver.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings_content.workspace = true
smol.workspace = true
telemetry.workspace = true
tempfile.workspace = true
thiserror.workspace = true
util.workspace = true
which.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
