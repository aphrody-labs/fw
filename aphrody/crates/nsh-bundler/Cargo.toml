[package]
name = "nsh-bundler"
description = "JS bundler: rolldown + nsh's JSX compiler; the compiler alone without feature `bundle`."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["bundle"]
# Bundling apps (rolldown), development bundles, assets and `.nsh/types`.
# Without it only `compile_module` is left, which also builds for
# WebAssembly (the website's playground).
bundle = [
  "dep:anyhow",
  "dep:nsh-js",
  "dep:rolldown",
  "dep:rolldown_common",
  "dep:rolldown_error",
  "dep:rolldown_sourcemap",
  "dep:string_wizard",
  "dep:nsh-i18n",
  "dep:imagesize",
  "dep:resvg",
  "nsh-core/svg",
  "dep:ttf-parser",
  "dep:tokio",
  "oxc/minifier",
]

[[example]]
name = "browser_bootstrap"
required-features = ["bundle"]

[dependencies]
dunce.workspace = true
anyhow = { workspace = true, optional = true }
oxc.workspace = true
rolldown = { workspace = true, optional = true }
rolldown_common = { workspace = true, optional = true }
rolldown_error = { workspace = true, optional = true }
rolldown_sourcemap = { workspace = true, optional = true }
string_wizard = { workspace = true, optional = true }
oxc_sourcemap.workspace = true
imagesize = { workspace = true, optional = true }
# SVG imports are read with the XML parser usvg uses (`resvg::usvg::roxmltree`).
resvg = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "sync", "fs"], optional = true }
nsh-core.workspace = true
# The app's theme (`nsh.json` `"theme"`): its tokens are classes.
nsh-base = { workspace = true, features = ["editor", "emoji-picker", "highlight", "plot", "rich-editor", "term"] }
nsh-js = { workspace = true, optional = true, features = ["zlib", "crypto"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
log.workspace = true
# The app's translations and the language data it ships (nsh.json `locales`).
nsh-i18n = { workspace = true, features = ["build"], optional = true }
