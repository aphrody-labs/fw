[package]
name = "nsh-dev"
description = "Development tooling: dev-server protocol, server (CLI side) and client (host side)."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
client = ["dep:tungstenite"]
server = ["dep:axum", "dep:tokio", "dep:nsh-core"]

[dependencies]
dunce.workspace = true
log.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
base64 = { version = "0.22" }
nsh-core = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"], optional = true }
tokio = { version = "1.54.1", optional = true, features = ["rt", "rt-multi-thread", "macros", "net", "sync", "fs"] }
tungstenite = { workspace = true, optional = true }

[dev-dependencies]
# Enables both sides for the round-trip test.
nsh-dev = { workspace = true, features = ["client", "server"] }
tungstenite.workspace = true
