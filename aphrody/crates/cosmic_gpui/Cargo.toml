[package]
name = "cosmic_gpui"
version = "1.0.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "COSMIC Epoch + Pop!_OS compositor, layer-shell panel/dock, applet, launcher, portal, and unified CLI/MCP/Web/Desktop deploy layer aligned onto GPUI and aphrody_session."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/cosmic_gpui.rs"
doctest = false

[features]
default = ["mcp", "web", "desktop"]
wayland-contract = []
mcp = []
web = []
desktop = []

[dependencies]
aphrody_session.workspace = true
aphrody_store = { workspace = true, default-features = false }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }