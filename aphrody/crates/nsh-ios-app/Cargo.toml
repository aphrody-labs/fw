[package]
name = "nsh-ios-app"
description = "Release app runner: the executable of packaged nsh apps (no development features)."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "nsh-ios-app"
path = "src/main.rs"

[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg"]
# JS apps (the bundle in the app). Without it the runner runs a Rust app
# only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-ios/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-ios/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-ios/editor"]
rich-editor = ["nsh-platform-ios/rich-editor"]
plot = ["nsh-platform-ios/plot"]
term = ["nsh-platform-ios/term"]
highlight = ["nsh-platform-ios/highlight"]
math = ["nsh-platform-ios/math"]
emoji-picker = ["nsh-platform-ios/emoji-picker"]
zlib = ["nsh-platform-ios/zlib"]
crypto = ["nsh-platform-ios/crypto"]

# The native WebSocket client and app self-updates (`docs/dev/features.md`).
websocket = ["nsh-platform-ios/websocket"]
updater = ["nsh-platform-ios/updater"]
# SVG images and (Linux, Windows) HTTP for `fetch` and remote images.
svg = ["nsh-platform-ios/svg"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
nsh-base.workspace = true
nsh-platform-ios.workspace = true
# The app's logs in the unified log (`unified_log`).
nsh-platform-apple.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
