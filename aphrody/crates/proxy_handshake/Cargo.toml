[package]
name = "proxy_handshake"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Sans-IO client handshakes for HTTP CONNECT and SOCKS proxies"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/proxy_handshake.rs"
doctest = true

[features]
default = []
futures-io = ["dep:futures"]
tokio = ["dep:tokio"]

[dependencies]
base64 = { version = "0.22" }
futures = { workspace = true, optional = true }
httparse.workspace = true
percent-encoding.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["io-util"], optional = true }
url = { version = "2.5.9" }
[dev-dependencies]
futures.workspace = true
piper.workspace = true
proptest.workspace = true
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt"] }