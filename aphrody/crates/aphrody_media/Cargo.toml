[package]
name = "aphrody_media"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Zero-FFmpeg pure-Rust multimedia player, studio, WGSL GPU YUV/HDR/scopes pipeline, HLS/DASH ingest, declarative programmatic video engine (composition format, keyframes, springs, transitions, captions, H.264 MP4 export), and video intelligence index."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_media.rs"
doctest = false

[features]
default = ["player", "ingest", "watch", "motion"]
player = []
studio = ["player", "motion", "watch"]
ingest = []
watch = []
motion = []
video-encode = ["dep:craft-media", "dep:craft-video"]
craft-codecs = [
    "video-encode",
    "dep:craft-aaf",
    "dep:craft-aep",
    "dep:craft-media",
    "dep:craft-video",
    "dep:craft-audio",
    "dep:craft-audio-dsp",
    "dep:craft-captions",
    "dep:craft-time",
    "dep:craft-timeline",
    "dep:craft-raw",
    "dep:craft-image-codecs",
    "dep:craft-raster-codecs",
    "dep:craft-color-transform",
    "dep:craft-cms",
    "dep:craft-gainmap",
    "dep:craft-metadata",
    "dep:craft-print",
]
audio-native = ["dep:cpal"]
wasm = []

[dependencies]
anyhow.workspace = true
brand.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
naga.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
image.workspace = true
tiny-skia.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
ttf-parser.workspace = true
sha2 = { version = "0.10" }
unicode-bidi.workspace = true

craft-aaf = { workspace = true, optional = true }
craft-aep = { workspace = true, optional = true }
craft-audio = { workspace = true, optional = true }
craft-audio-dsp = { workspace = true, optional = true }
craft-captions = { workspace = true, optional = true }
craft-cms = { workspace = true, optional = true }
craft-color-transform = { workspace = true, optional = true }
craft-gainmap = { workspace = true, optional = true }
craft-image-codecs = { workspace = true, optional = true }
craft-media = { workspace = true, optional = true }
craft-metadata = { workspace = true, optional = true }
craft-print = { workspace = true, optional = true }
craft-raster-codecs = { workspace = true, optional = true }
craft-raw = { workspace = true, optional = true }
craft-time = { workspace = true, optional = true }
craft-timeline = { workspace = true, optional = true }
craft-video = { workspace = true, optional = true, features = ["h264-encode"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
cpal = { workspace = true, optional = true }
