[package]
name = "language_model_core"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/language_model_core.rs"

[dependencies]
anyhow.workspace = true
cloud_llm_client.workspace = true
collections.workspace = true
futures.workspace = true
gpui_shared_string.workspace = true
http.workspace = true
log.workspace = true
partial-json-fixer.workspace = true
schemars = { workspace = true, features = ["derive"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
strum.workspace = true
thiserror.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
async-lock.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
async-lock = { workspace = true, features = ["std"] }

[dev-dependencies]
pretty_assertions = { version = "1.4.1", features = ["unstable"] }