[package]
name = "nsh-cli"
description = "The nsh command line tool: build, package and run apps."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "nsh"
path = "src/main.rs"

[dependencies]
dunce.workspace = true
semver.workspace = true
nsh-bundler = { workspace = true, features = ["bundle"] }
nsh-core = { workspace = true, features = ["declarations", "websocket", "updater"] }
# A Rust app's translations (`locales/`), compiled into its runners.
nsh-i18n = { workspace = true, features = ["build"] }
nsh-engine = { workspace = true, features = ["js"] }
nsh-dev = { workspace = true, features = ["server"] }
nsh-js = { workspace = true, features = ["zlib", "crypto"] }
nsh-base = { workspace = true, features = ["editor", "emoji-picker", "highlight", "plot", "rich-editor", "term"] }
nsh-package.workspace = true
nsh-testing = { workspace = true, features = ["agent", "bundle"] }
crossbeam-channel.workspace = true
anyhow.workspace = true
clap = { version = "4.6.9", features = ["derive", "wrap_help", "env"] }
notify.workspace = true
log.workspace = true
libc.workspace = true
ureq = { version = "3.5.2", features = ["platform-verifier"] }
ring.workspace = true
nsh-updater.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
tungstenite.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_ignored.workspace = true
serde_path_to_error.workspace = true
plist.workspace = true
zip.workspace = true
brotli.workspace = true
flate2.workspace = true
tar.workspace = true
sha2 = { version = "0.10" }
base64 = { version = "0.22" }
image.workspace = true
wasmparser.workspace = true
# `--asset-url`: checked as an http(s) URL, its origin allowed to `connect-src`.
url = { version = "2.5.9" }
[build-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[dev-dependencies]
# The syntaxes file the web runtime fetches must be a dump its syntect reads.
syntect.workspace = true
# Pages loaded at the app's paths resolve their files as browsers do.
url = { version = "2.5.9" }