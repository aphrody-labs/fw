[package]
name = "anthropic"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[features]
default = []
schemars = ["dep:schemars"]

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/anthropic.rs"
doctest = false

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = true, features = ["std", "serde"] }
collections.workspace = true
futures.workspace = true
http_client.workspace = true
language_model_core.workspace = true
log.workspace = true
schemars = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
strum.workspace = true
thiserror.workspace = true

[dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
