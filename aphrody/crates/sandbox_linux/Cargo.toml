[package]
name = "sandbox_linux"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/sandbox_linux.rs"
doctest = false

# The end-to-end harness is an example, not a test target: CI runs the suite
# with `cargo nextest run --workspace`, which skips targets whose
# required-features are unset. The NixOS VM tests build it explicitly
# (nix/tests/sandboxing/helper.nix).
[features]
__end_to_end_harness = []

[[example]]
name = "end_to_end"
path = "examples/end_to_end.rs"
required-features = ["__end_to_end_harness"]

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
libc.workspace = true
log.workspace = true
nix = { workspace = true, features = ["net", "socket", "uio"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
