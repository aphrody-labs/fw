[package]
name = "aphrody_installer"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Aphrody OS & Arch Net-Installer + Live Desktop Environment Switcher (Aphrody GPUI, Iced COSMIC, egui Craft, WebGPU, GNOME, KDE, Hyprland, Sway, Niri) rewritten from cachyos/new-cli-installer in Rust + NSH."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_installer.rs"
doctest = false

[[bin]]
name = "aphrody-installer"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["nsh-ui"]
nsh-ui = ["dep:nsh-core", "dep:nsh-base"]
desktop = [
    "nsh-ui",
    "dep:env_logger",
    "dep:nsh-platform-windows",
    "dep:nsh-platform-linux",
    "dep:nsh-platform-macos",
]

[dependencies]
brand.workspace = true
env_logger = { workspace = true, optional = true }
nsh-base = { workspace = true, optional = true }
nsh-core = { workspace = true, optional = true }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
thiserror.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
nsh-engine.workspace = true
nsh-testing = { workspace = true, features = ["live"] }
