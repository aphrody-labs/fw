[package]
name = "nsh-macos-app"
description = "Release app runner on macOS: the executable of packaged nsh apps (no development features)."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg"]
# JS apps (the bundle in the app's resources). Without it the runner runs a
# Rust app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-macos/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-macos/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-macos/editor"]
rich-editor = ["nsh-platform-macos/rich-editor"]
plot = ["nsh-platform-macos/plot"]
term = ["nsh-platform-macos/term"]
highlight = ["nsh-platform-macos/highlight"]
math = ["nsh-platform-macos/math"]
emoji-picker = ["nsh-platform-macos/emoji-picker"]
zlib = ["nsh-platform-macos/zlib"]
crypto = ["nsh-platform-macos/crypto"]

# The native WebSocket client and app self-updates (`docs/dev/features.md`).
websocket = ["nsh-platform-macos/websocket"]
updater = ["nsh-platform-macos/updater"]
# SVG images and (Linux, Windows) HTTP for `fetch` and remote images.
svg = ["nsh-platform-macos/svg"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nsh-base.workspace = true
nsh-platform-macos.workspace = true
# The app's logs in the unified log (`unified_log`).
nsh-platform-apple.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }