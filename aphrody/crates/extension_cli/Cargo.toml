[package]
name = "extension_cli"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "zed-extension"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4.6.9", features = ["derive", "wrap_help"] }
cloud_api_types.workspace = true
env_logger.workspace = true
extension.workspace = true
futures.workspace = true
fs.workspace = true
gpui_platform.workspace = true
http_client.workspace = true
language = { workspace = true, features = ["wasm-grammars"] }
log.workspace = true
reqwest_client.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
settings_content.workspace = true
snippet_provider.workspace = true
task.workspace = true
theme_settings.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["fs", "macros", "parking_lot", "process", "sync", "time"] }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
tree-sitter = { workspace = true, features = ["wasm"] }
wasmtime.workspace = true
