[package]
name = "acp_thread"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/acp_thread.rs"
doctest = false

[features]
test-support = ["gpui/test-support", "project/test-support", "dep:parking_lot"]

[dependencies]
action_log.workspace = true
agent_settings.workspace = true
agent-client-protocol.workspace = true
async-channel.workspace = true
base64 = { version = "0.22" }
anyhow.workspace = true
buffer_diff.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
collections.workspace = true
diffy.workspace = true
feature_flags.workspace = true
multi_buffer.workspace = true
file_icons.workspace = true
futures.workspace = true
gpui.workspace = true
http_proxy.workspace = true
itertools.workspace = true
language.workspace = true
language_model.workspace = true
libc.workspace = true
log.workspace = true
markdown.workspace = true
mime.workspace = true
parking_lot = { workspace = true, optional = true }
image.workspace = true
project.workspace = true
sandbox.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
task.workspace = true
telemetry.workspace = true
terminal.workspace = true
text.workspace = true
ui.workspace = true
url = { version = "2.5.9" }
util.workspace = true
uuid = { version = "1.29.3", features = ["serde"] }
watch.workspace = true
urlencoding.workspace = true

[dev-dependencies]
env_logger.workspace = true
gpui = { workspace = true, "features" = ["test-support"] }
indoc.workspace = true
markdown = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
project = { workspace = true, "features" = ["test-support"] }
rand.workspace = true
tempfile.workspace = true
util.workspace = true
settings.workspace = true
