[package]
name = "nsh-gpui-host"
description = "Development host app (GPUI) that runs a nsh bundle on macOS, Windows and Linux."
version = "0.6.0"
edition.workspace = true
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
# Compile GPUI's Metal shaders at run time: builds on macOS without a Metal Toolchain.
runtime-shaders = ["nsh-platform-gpui/runtime-shaders"]

[dependencies]
log.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
nsh-base.workspace = true
nsh-platform-gpui = { workspace = true, features = ["dev", "webview"] }
nsh-dev.workspace = true
nsh-engine = { workspace = true, features = ["js"] }

# Offscreen `shot` script steps (Linux reads the window from the X server).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
nsh-platform-gpui = { workspace = true, features = ["dev", "shot", "webview"] }

# Videos play through GStreamer, which Linux desktops have.
[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-gpui = { workspace = true, features = ["dev", "webview", "video"] }
