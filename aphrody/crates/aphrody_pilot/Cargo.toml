[package]
name = "aphrody_pilot"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0 OR GPL-3.0-or-later"
description = "Cross-platform AI OS pilotage engine fusing native accessibility trees (UIA, AT-SPI2, AXUIElement), GPUI AccessKit, and COSMIC compositor control."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_pilot.rs"
doctest = false

[features]
default = []
test-support = []

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
base64 = { version = "0.22" }
brand.workspace = true
image = { workspace = true, features = ["png"] }
log.workspace = true
aphrody_session.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
futures-util = { version = "0.3", features = ["sink"] }
smol.workspace = true
tokio = { version = "1.54.1", features = ["net", "rt", "sync", "time", "process"] }
tokio-tungstenite.workspace = true
tree-sitter.workspace = true
tree-sitter-json.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-typescript.workspace = true
ureq = { version = "3.5.2", features = ["platform-verifier"] }
[target.'cfg(all(target_os = "windows", not(target_family = "wasm")))'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true

[target.'cfg(all(target_os = "linux", not(target_family = "wasm")))'.dependencies]
x11rb = { workspace = true, features = ["randr", "xtest"] }
zbus.workspace = true

[target.'cfg(all(target_os = "macos", not(target_family = "wasm")))'.dependencies]
core-foundation.workspace = true
core-graphics.workspace = true

[dev-dependencies]
tempfile.workspace = true
