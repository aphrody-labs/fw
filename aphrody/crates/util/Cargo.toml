[package]
name = "util"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A collection of utility structs and functions used by Zed and GPUI"


[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/util.rs"
doctest = true

[features]
test-support = ["rand", "util_macros", "path/test-support", "dep:tempfile"]
# Embed `fs_embed!` assets at compile time even in debug builds.
debug-embed = ["rust-embed/debug-embed"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
globset.workspace = true
itertools.workspace = true
rand = { workspace = true, optional = true }
regex = { version = "1.13.2", default-features = false, features = ["std", "perf", "unicode-bool", "unicode-gencat"] }
schemars = { workspace = true, features = ["derive"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_json_lenient.workspace = true
tempfile = { workspace = true, optional = true }
unicase.workspace = true
url = { version = "2.5.9" }
percent-encoding.workspace = true
util_macros = { workspace = true, optional = true }
gpui_util.workspace = true
path = { workspace = true, features = ["serde"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed.workspace = true
async_zip.workspace = true
futures-lite.workspace = true
futures.workspace = true
shlex.workspace = true
smol.workspace = true
async-fs.workspace = true
walkdir.workspace = true
dirs.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
rust-embed = { workspace = true, features = ["debug-embed"] }

[target.'cfg(any(unix, not(target_family = "wasm")))'.dependencies]
log.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { workspace = true, features = ["resource", "user"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true
which.workspace = true

[target.'cfg(windows)'.dependencies]
which.workspace = true
windows = { version = "0.62.2", features = ["std", "Data_Xml_Dom", "Foundation_Numerics", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Imaging_D2D", "Win32_Media_Audio", "Win32_Media_Audio_XAudio2", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects"] }
[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
util_macros.workspace = true
path = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
which.workspace = true
