[package]
name = "docs_preprocessor"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[dependencies]
anyhow.workspace = true
collections.workspace = true
jsonschema.workspace = true
# We are specifically pinning this version of mdbook, as later versions introduce issues with double-nested subdirectories.
# Ask @maxdeviant about this before bumping.
mdbook.workspace = true
regex = { version = "1.13.2", default-features = false, features = ["std", "perf"] }
schemars.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
util.workspace = true
zlog.workspace = true
task.workspace = true
theme.workspace = true

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[[bin]]
name = "docs-preprocessor"
path = "src/main.rs"
