[package]
name = "gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit-assets"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
edition.workspace = true
publish = false
version = "0.10.0"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[dependencies]
anyhow.workspace = true
gpui.workspace = true
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed.workspace = true
[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Response", "Window"] }
[features]
gpui-fast = []
