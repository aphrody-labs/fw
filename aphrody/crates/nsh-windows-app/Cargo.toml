[package]
name = "nsh-windows-app"
description = "Release app runner on Windows: the executable of packaged nsh apps (no development features)."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg", "net", "webview", "media"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-windows/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-windows/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-windows/editor"]
rich-editor = ["nsh-platform-windows/rich-editor"]
plot = ["nsh-platform-windows/plot"]
term = ["nsh-platform-windows/term"]
highlight = ["nsh-platform-windows/highlight"]
math = ["nsh-platform-windows/math"]
emoji-picker = ["nsh-platform-windows/emoji-picker"]
zlib = ["nsh-platform-windows/zlib"]
crypto = ["nsh-platform-windows/crypto"]

# The native WebSocket client and app self-updates (`docs/dev/features.md`).
websocket = ["nsh-platform-windows/websocket"]
updater = ["nsh-platform-windows/updater"]
# SVG images and (Linux, Windows) HTTP for `fetch` and remote images.
svg = ["nsh-platform-windows/svg"]
net = ["nsh-platform-windows/net"]
# WebView2 web views.
webview = ["nsh-platform-windows/webview"]
# Video and sound (Media Foundation, XAudio2).
media = ["nsh-platform-windows/media"]

[dependencies]
log.workspace = true

[target.'cfg(windows)'.dependencies]
nsh-base.workspace = true
nsh-platform-windows.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }