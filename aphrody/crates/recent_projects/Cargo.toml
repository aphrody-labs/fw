[package]
name = "recent_projects"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/recent_projects.rs"
doctest = false

[features]
default = []
extensions = ["dep:extension_host"]
test-support = ["remote/test-support", "remote_connection/test-support", "project/test-support", "workspace/test-support"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
askpass.workspace = true
db.workspace = true
dev_container.workspace = true
editor.workspace = true
extension_host = { workspace = true, optional = true }
fs.workspace = true
futures.workspace = true
fuzzy_nucleo.workspace = true
gpui.workspace = true
language.workspace = true
log.workspace = true
menu.workspace = true
node_runtime.workspace = true
open_path_prompt.workspace = true
ordered-float.workspace = true
paths.workspace = true
picker.workspace = true
project.workspace = true
release_channel.workspace = true
remote.workspace = true
remote_connection.workspace = true
semver.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings.workspace = true
telemetry.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
worktree.workspace = true
zed_actions.workspace = true
indoc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry.workspace = true

[dev-dependencies]
editor = { workspace = true, features = ["test-support"] }
extension.workspace = true
fs.workspace = true
gpui = { workspace = true, features = ["test-support"] }
http_client.workspace = true
language = { workspace = true, features = ["test-support"] }
picker = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
release_channel.workspace = true
remote = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
remote_server.workspace = true
rpc.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
settings = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
