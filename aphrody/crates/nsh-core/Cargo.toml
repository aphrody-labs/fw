[package]
name = "nsh-core"
description = "Platform-independent core: shadow tree, styles, layout and mount instructions."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[dependencies]
unicode-linebreak.workspace = true
unicode-properties.workspace = true
rustc-hash.workspace = true
slab.workspace = true
taffy = { workspace = true, features = ["std", "block_layout", "flexbox", "grid", "taffy_tree", "content_size", "detailed_layout_info"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
rust-i18n.workspace = true
nsh-macros.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time"] }
log.workspace = true
ordered-float.workspace = true
resvg = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
url = { version = "2.5.9" }
sha2 = { version = "0.10" }
# Picked images' sizes and types (`picker.rs`).
imagesize.workspace = true
# A GIF's first frame for the SVG layer budget (`svg/layers.rs`).
gif = { workspace = true, optional = true }
# Inline SVG style declarations, parsed as usvg parses them (`svg/mod.rs`).
simplecss = { workspace = true, optional = true }
naga = { workspace = true, optional = true }
# WOFF and WOFF2 fonts (`text::font_data`).
wuff.workspace = true
# Fonts' family names (`text::font_family`).
ttf-parser.workspace = true
# `nsh/mobile`'s `DateTimePicker` values (`mobile.rs`).
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
[features]
# SVG images for the native backends (`svg`: sniffing, sizes and rasters with
# resvg). The web runtime leaves it off: the browser draws SVG itself.
svg = ["dep:resvg", "dep:flate2", "dep:gif", "dep:simplecss"]
# Remote images for the shared image loader (`image::loader`: downloads with
# ureq). Without it, the loader reads files, assets and inline bytes only.
loader = ["dep:ureq"]
# The shader compiler (`Shader::compile`, on naga). Without it every shader
# source is refused, and the views and transitions asking for one draw none.
shader = ["dep:naga"]
# Shaders as GLSL ES 3.00 (`Shader::glsl_es`), for the web runtime's WebGL 2.
glsl = ["shader", "naga/glsl-out"]
# The text of declarations (documentation and TypeScript of the specs),
# which only `.nsh/types` needs: `nsh` and the program describing an app's
# UI sets turn it on; apps and the web runtime go without
# (`element::DECLARATIONS`).
declarations = []
# The native WebSocket client (`websocket` on native hosts: tokio-tungstenite
# over rustls, with the platform's trust store). Without it `connect` rejects
# with `ERR_FEATURE_UNAVAILABLE_ON_PLATFORM` unless the host supplies a transport.
websocket = [
  "dep:futures-util",
  "dep:tokio-tungstenite",
  "dep:rustls",
  "dep:rustls-platform-verifier",
]
# App self-updates (`nsh/updater`, on nsh-updater). Without it a check finds
# nothing and downloads, installs and package restarts reject.
updater = ["dep:nsh-updater"]

# Native socket/file implementations. Browser WebSockets and files use
# the host services; their shared checks do not need these dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.54.1", features = ["net", "io-util", "sync", "macros"] }
cap-std.workspace = true
# The native WebSocket client (feature `websocket`).
futures-util = { version = "0.3", features = ["sink"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["ring"] }
# The image disk cache (`image/cache.rs`).
httpdate.workspace = true
# The image loader's downloads (`image/loader.rs`, feature `loader`).
ureq = { version = "3.5.2", features = ["platform-verifier"], optional = true }
crc32fast.workspace = true
# `nsh/updater` (feature `updater`).
nsh-updater = { workspace = true, optional = true }

# `process`'s children: their process groups and exits (`runtime/process.rs`);
# the names of Unix error numbers (`element/system.rs`). Emscripten is wasm32
# and `unix` both, so it needs libc for the `cfg(unix)` code too.
# WebSocket TLS roots: the system trust store. On Android the host
# initializes it over JNI (nsh-platform-android).
rustls-platform-verifier = { workspace = true, optional = true }

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "emscripten"))'.dependencies]
libc.workspace = true

# `process`'s children on Windows: their jobs (`runtime/process.rs`); the
# machine's memory for the image budget (`image/memory.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[dev-dependencies]
# The tests compile shaders.
nsh-core = { workspace = true, features = ["shader"] }
# The tests use `futures_util` directly.
futures-util = { version = "0.3", features = ["sink"] }
# The `unit_types` check reads the crate's public API.
syn = { workspace = true, features = ["derive", "full", "parsing", "visit"] }
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "time"] }
