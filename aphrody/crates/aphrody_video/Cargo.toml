[package]
name = "aphrody_video"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Aphrody Video: GPUI desktop video app over a local media library (home grid, watch view, search, creator pages, short-form viewer) with pure-Rust MP4/H.264 playback."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_video.rs"
doctest = false

[[bin]]
name = "aphrody-video"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["gpui_ui/desktop"]

[dependencies]
anyhow.workspace = true
aphrody_media.workspace = true
aphrody_ui.workspace = true
craft-media.workspace = true
dirs.workspace = true
craft-video = { workspace = true, features = ["h264-decode"] }
gpui.workspace = true
gpui_ui = { workspace = true, default-features = false }
icons.workspace = true
image.workspace = true
log.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
assets.workspace = true
brand.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
