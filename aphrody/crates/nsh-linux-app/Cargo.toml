[package]
name = "nsh-linux-app"
description = "Release app runner on Linux: the executable of packaged nsh apps (no development features)."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "webview", "websocket", "updater", "svg", "net", "sound"]
# JS apps (the bundle in the package). Without it the runner runs a Rust
# app only (`run_rust`) and links no QuickJS.
js = ["nsh-platform-linux/js", "nsh-engine/js-core"]
# Shaders, on naga and wgpu. Without them, the runner links neither.
shader = ["nsh-platform-linux/shader"]
# The large parts of `nsh/base` and the standard JS modules
# (`docs/dev/features.md`).
editor = ["nsh-platform-linux/editor"]
rich-editor = ["nsh-platform-linux/rich-editor"]
plot = ["nsh-platform-linux/plot"]
term = ["nsh-platform-linux/term"]
highlight = ["nsh-platform-linux/highlight"]
math = ["nsh-platform-linux/math"]
emoji-picker = ["nsh-platform-linux/emoji-picker"]
zlib = ["nsh-platform-linux/zlib"]
crypto = ["nsh-platform-linux/crypto"]
# Web views (WebKitGTK 6.0): `libwebkitgtk-6.0-dev` to build, and packaged
# apps then need `libwebkitgtk-6.0-4` to start; off, a web view shows a
# placeholder and the runner needs only GTK 4.
webview = ["nsh-platform-linux/webview"]

# The native WebSocket client and app self-updates (`docs/dev/features.md`).
websocket = ["nsh-platform-linux/websocket"]
updater = ["nsh-platform-linux/updater"]
# SVG images and (Linux, Windows) HTTP for `fetch` and remote images.
svg = ["nsh-platform-linux/svg"]
net = ["nsh-platform-linux/net"]
# Sounds, with GStreamer (`libgstreamer1.0-dev
# libgstreamer-plugins-base1.0-dev` to build).
sound = ["nsh-platform-linux/sound"]

[dependencies]
log.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nsh-base.workspace = true
nsh-platform-linux.workspace = true
# Over-the-air packages of the app's code (`nsh_engine::updates`).
nsh-engine.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }