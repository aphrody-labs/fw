[package]
name = "gpui_wgpu"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/gpui_wgpu.rs"
doctest = false

[features]
default = ["webgl-fallback"]
bench-support = ["gpui/bench-support", "dep:image"]
font-kit = ["dep:font-kit"]
test-support = ["gpui/test-support", "dep:image"]
# Enables the WebGL2 fallback backend on wasm32. Disable default features for pure WebGPU builds
# to drop glow, wgpu-hal/gles, and WebGL2 shader/web-sys overhead from Wasm bundles.
webgl-fallback = ["wgpu/webgl"]

[dependencies]
gpui.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
collections.workspace = true
cosmic-text.workspace = true
etagere.workspace = true
itertools.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
gpui_util.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd", target_family = "wasm")))'.dependencies]
wgpu = { workspace = true, default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys.workspace = true
web-sys = { workspace = true, features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, features = ["webgpu", "wgsl"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
gpui = { workspace = true, features = ["bench-support"] }
image.workspace = true
# Validate shaders with the same Naga revision that wgpu uses at runtime.
naga.workspace = true

[[bench]]
name = "layout_line"
harness = false
