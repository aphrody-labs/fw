[package]
name = "aphrody_vpn"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Native GPUI VPN client for the Aphrody VPN daemon: tunnel state, location, account and settings, as a gpui_app_shell module."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_vpn.rs"
doctest = false

[[bin]]
name = "aphrody-vpn"
path = "src/main.rs"

[[example]]
name = "vpn_screenshot"
path = "examples/vpn_screenshot.rs"

[features]
default = ["nsh"]
nsh = ["gpui_app_shell/nsh"]

[dependencies]
anyhow.workspace = true
dirs.workspace = true
ayvpn-daemon.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_app_shell.workspace = true
gpui_tokio.workspace = true
gpui_ui.workspace = true
log.workspace = true
util.workspace = true
workspace.workspace = true

[dev-dependencies]
assets.workspace = true
brand.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_ui = { workspace = true, features = ["test-support"] }
gpui_wgpu = { workspace = true, features = ["test-support"] }
image.workspace = true
