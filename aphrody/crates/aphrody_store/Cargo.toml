[package]
name = "aphrody_store"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "Awesome GPUI Store catalog, NSH + GPUI cross-platform store UI, unified upt package manager integration, and 22-target store/distro packager."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_store.rs"
doctest = false

[features]
default = ["desktop", "nsh-ui", "webgl-fallback"]
webgl-fallback = ["gpui_ui/webgl-fallback"]
desktop = ["gpui_ui/desktop", "gpui_ui/nsh", "nsh-ui"]
nsh-ui = ["dep:nsh-core", "dep:nsh-base"]
nsh-js = ["desktop", "gpui_ui/nsh-js", "dep:nsh-engine"]
nsh-dev = ["nsh-js", "gpui_ui/nsh-dev", "dep:nsh-bundler"]
web = ["nsh-ui"]
slim = []
mobile = ["nsh-ui"]
test-support = ["gpui/test-support", "aphrody_ui/test-support", "gpui_ui/test-support"]

[dependencies]
brand.workspace = true
dirs.workspace = true
gpui.workspace = true
gpui_ui = { workspace = true, default-features = false }
nsh-base = { workspace = true, optional = true }
nsh-bundler = { workspace = true, optional = true }
nsh-core = { workspace = true, optional = true }
nsh-engine = { workspace = true, optional = true }
aphrody_ui.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
thiserror.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
ui.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
upt.workspace = true

[dev-dependencies]
quick-xml.workspace = true
serde_yaml_ng.workspace = true
tempfile.workspace = true
