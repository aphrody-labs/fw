[package]
name = "aphrody_session"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"
description = "COSMIC-inspired session supervisor, Taffy layer-shell & tiling compositor state, and live cross-platform app/distro discovery for Aphrody GPUI OS."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_session.rs"
doctest = false

[features]
default = []
test-support = []

[dependencies]
bitflags.workspace = true
brand.workspace = true
dirs.workspace = true
log.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
taffy = { workspace = true, features = ["std", "taffy_tree", "flexbox", "grid"] }
thiserror.workspace = true
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }