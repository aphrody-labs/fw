[package]
name = "aphrody_design"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Pure-Rust curl/wget/monolith fusion for real-time mirroring of https://design.google/, DESIGN.md specs, GoogleChrome modern-web-guidance Baseline audits, Google Stitch SDK screen capture, and WGSL/CSS/TSX export."

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/aphrody_design.rs"
doctest = false

[dependencies]
anyhow.workspace = true
brand.workspace = true
html5ever.workspace = true
image.workspace = true
log.workspace = true
markup5ever_rcdom.workspace = true
roxmltree.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
serde_yaml.workspace = true
sha2 = { version = "0.10" }
toml = { version = "0.9", default-features = false, features = ["std", "serde", "parse"] }
url = { version = "2.5.9" }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = { version = "3.5.2", features = ["platform-verifier"] }
[dev-dependencies]
tempfile.workspace = true
