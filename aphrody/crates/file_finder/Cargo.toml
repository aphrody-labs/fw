[package]
name = "file_finder"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/file_finder.rs"
doctest = false

[dependencies]
anyhow.workspace = true
channel.workspace = true
client.workspace = true
collections.workspace = true
editor.workspace = true
file_icons.workspace = true
futures.workspace = true
fuzzy.workspace = true
fuzzy_nucleo.workspace = true
gpui.workspace = true
language.workspace = true
menu.workspace = true
open_path_prompt.workspace = true
picker.workspace = true
picker_preview.workspace = true
project.workspace = true
settings.workspace = true
theme.workspace = true
ui.workspace = true
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true

[dev-dependencies]
ctor.workspace = true
editor = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }

picker = { workspace = true, features = ["test-support"] }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
release_channel.workspace = true
remote = { workspace = true, features = ["test-support"] }
remote_server = { workspace = true, features = ["test-support"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
theme = { workspace = true, features = ["test-support"] }
workspace = { workspace = true, features = ["test-support"] }
zlog.workspace = true
theme_settings = { workspace = true, features = ["test-support"] }
