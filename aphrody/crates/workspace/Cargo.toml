[package]
name = "workspace"
version = "0.1.0"
edition.workspace = true
publish = false
license = "GPL-3.0-or-later"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[lib]
path = "src/workspace.rs"
doctest = false

[features]
test-support = [
    "client/test-support",
    "http_client/test-support",
    "db/test-support",
    "project/test-support",
    "remote/test-support",
    "session/test-support",
    "settings/test-support",
    "gpui/test-support",
    "fs/test-support",
]

[dependencies]
any_vec.workspace = true
agent_settings.workspace = true
anyhow.workspace = true
async-recursion.workspace = true
brand.workspace = true
client.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
clock.workspace = true
collections.workspace = true
component.workspace = true
db.workspace = true
dirs.workspace = true
futures-lite.workspace = true
fs.workspace = true
futures.workspace = true
git.workspace = true
gpui.workspace = true
http_client.workspace = true
itertools.workspace = true
language.workspace = true
log.workspace = true
menu.workspace = true
markdown.workspace = true
node_runtime.workspace = true
parking_lot.workspace = true
postage.workspace = true
project.workspace = true
release_channel.workspace = true
remote.workspace = true
schemars.workspace = true
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
session.workspace = true
settings.workspace = true
smallvec.workspace = true
sqlez.workspace = true
strum.workspace = true
task.workspace = true
telemetry.workspace = true
theme.workspace = true
theme_settings.workspace = true
ui.workspace = true
ui_input.workspace = true
url = { version = "2.5.9" }
util.workspace = true
uuid = { version = "1.29.3", features = ["serde"] }
zed_actions.workspace = true

[dev-dependencies]
client = { workspace = true, features = ["test-support"] }
db = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
lsp.workspace = true
project = { workspace = true, features = ["test-support"] }
remote = { workspace = true, features = ["test-support"] }
session = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
pretty_assertions = { version = "1.4.1", features = ["unstable"] }
proptest.workspace = true
proptest-derive.workspace = true
tempfile.workspace = true
zlog.workspace = true
