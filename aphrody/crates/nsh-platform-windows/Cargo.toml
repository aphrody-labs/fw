[package]
name = "nsh-platform-windows"
description = "Windows backend (Win32, Direct2D, DirectWrite): view mounting, text engine, input, standalone app."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[features]
default = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "svg", "net", "webview", "media"]
# JS apps (bundles, signed packages); without it, the library only runs a
# Rust app and links no QuickJS.
js = ["nsh-engine/js-core"]
# Development support: dev server client, log forwarding, error overlay.
dev = ["js", "shader", "editor", "emoji-picker", "highlight", "math", "plot", "rich-editor", "term", "zlib", "crypto", "websocket", "updater", "dep:nsh-dev", "dep:nsh-testing", "svg", "net", "webview", "media"]
# Web views with WebView2 (webview2-com). Without it a web view fails at
# once, as on a platform that shows none.
webview = ["dep:webview2-com"]
# Video and sound with Media Foundation and XAudio2. Without them a video
# shows nothing and a sound's load fails as not supported, naming the
# feature; the runtime imports no mfplat, mfreadwrite or xaudio2 DLL.
media = ["windows/Win32_Media_Audio", "windows/Win32_Media_Audio_XAudio2", "windows/Win32_Media_MediaFoundation"]
# Shaders (`Shader`, `ShaderEffect`, `ShaderTransition`, the shader transitions
# of pages and dialogs), on naga and wgpu. Without it they draw nothing.
shader = ["nsh-engine/shader"]
# The large parts of `nsh/base`: see `docs/dev/features.md`. An app that imports
# one its runtime was built without fails at the import, naming it.
# `Editor` and `DiffView`, with ropey and imara-diff.
editor = ["nsh-base/editor"]
# `RichEditor`, its schema, session and plugin classes.
rich-editor = ["nsh-base/rich-editor"]
# The charts: `nsh/base/plot`.
plot = ["nsh-base/plot"]
# `Terminal` and its emulator: `vte`.
term = ["nsh-base/term"]
# Highlighted code in `TextView` and the `Editor` (syntect). Without it, plain.
highlight = ["nsh-base/highlight"]
# `TextView`'s formulas typeset natively (RaTeX and the KaTeX fonts). Without
# it a formula shows as its TeX, or as the app's `renderMath`.
math = ["nsh-base/math"]
# `EmojiPicker`, with Unicode's emoji and their English names (about 440 kB).
emoji-picker = ["nsh-base/emoji-picker"]
# The standard JS module `zlib`: deflate, gzip, brotli and zstd.
zlib = ["js", "nsh-engine/zlib"]
# The standard JS module `crypto` and the globals of Web Crypto.
crypto = ["js", "nsh-engine/crypto"]

# The native WebSocket client (tokio-tungstenite, rustls). Without it
# `connect` of `websocket` rejects with ERR_FEATURE_UNAVAILABLE_ON_PLATFORM.
websocket = ["nsh-core/websocket"]
# App self-updates (`nsh/updater`). Without it a check finds no update.
updater = ["nsh-core/updater"]

# SVG images (resvg). Without it an SVG is recognized and shows nothing,
# its load failing with a message naming the feature.
svg = ["nsh-core/svg"]
# HTTP: `fetch` and remote images (ureq, rustls). Without it `fetch`
# rejects and an `<Image>` shows only files, assets and inline data.
net = ["nsh-core/loader", "nsh-engine/net"]

[dependencies]
log.workspace = true

# Empty off Windows (like the other platform crates off their targets).
[target.'cfg(windows)'.dependencies]
nsh-core.workspace = true
nsh-engine.workspace = true
nsh-base.workspace = true
windows = { version = "0.62.2", features = ["std", "Data_Xml_Dom", "Foundation_Numerics", "UI_Notifications", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Graphics_Imaging_D2D", "Win32_Media_Audio", "Win32_Media_Audio_XAudio2", "Win32_Media_MediaFoundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
windows-core.workspace = true
windows-numerics.workspace = true
webview2-com = { workspace = true, optional = true }
# GIF and WebP animations (WIC decodes the first frame of everything else).
image = { workspace = true, features = ["gif", "webp"] }
rustc-hash.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
url = { version = "2.5.9" }
ttf-parser.workspace = true
crossbeam-channel.workspace = true
nsh-dev = { workspace = true, features = ["client"], optional = true }
nsh-testing = { workspace = true, features = ["agent"], optional = true }
