[package]
name = "nsh-platform-apple"
description = "Code shared by the macOS and iOS backends: sound playback, offscreen canvas bitmaps and their encoding, which images of a decoded file to show, the Speech recognizer, the notification center, the URL schemes web views serve from the app, web views' script evaluation and the unified log as the release runners' logger."
version = "0.6.0"
edition.workspace = true
rust-version = "1.97"
license = "Apache-2.0"
homepage = "https://aphrody.com"
readme = "README.md"
repository = "https://github.com/aphrody-labs/aphrody"
[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
[build-dependencies]
# `os_log_with_type`, a C macro, compiled into a function (`src/os_log.c`).
cc.workspace = true

# Empty off Apple platforms (like the platform crates off their targets).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc.workspace = true
log.workspace = true
nsh-core.workspace = true
nsh-engine.workspace = true
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-text.workspace = true
objc2-foundation.workspace = true
objc2-image-io.workspace = true
rustc-hash.workspace = true
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
unicode-bidi.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit.workspace = true
